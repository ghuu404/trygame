<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>采药</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box;
    font-family: "KaiTi", "STKaiti", "楷体", "Kaiti SC", serif; }
html, body { height: 100%; overflow: hidden; }
body {
    user-select: none; color: #3a2a1a;
    background: #f5ead3;
    background-image: url('images/forest-bg.jpg');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    display: flex;
    flex-direction: column;
    position: relative;
}

/* 顶栏 */
#topBar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 12px;
    background: rgba(255,255,255,0.6);
    border-bottom: 2px solid #d4c4a8;
    flex-shrink: 0; z-index: 10;
}
#backBtn {
    width: 34px; height: 34px;
    border-radius: 50%;
    background: rgba(255,255,255,0.9);
    border: 2px solid #8b5e3c;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 18px; color: #3a2a1a;
    text-decoration: none;
}
#backBtn:active { transform: scale(0.93); }
.info-chip {
    font-size: 13px; font-weight: bold;
    background: rgba(255,255,255,0.85);
    padding: 4px 10px;
    border-radius: 12px;
    border: 2px solid #d4c4a8;
    color: #8b5e3c;
    margin-left: 6px;
}

/* 卡片区 */
#cardArea {
    flex: 1;
    position: relative;
    margin: 6px;
    background: rgba(255,255,255,0.12);
    border-radius: 14px;
    border: 2px dashed rgba(139,94,60,0.35);
    overflow: hidden;
    min-height: 0;
}
.card {
    position: absolute;
    width: 42px; height: 52px;
    background: #fff;
    border: 2px solid #8b5e3c;
    border-radius: 7px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.12s, opacity 0.2s;
    z-index: 1;
    overflow: hidden;
    padding: 1px;
}
.card img {
    width: 90%; height: 90%;
    object-fit: contain;
    pointer-events: none;
}
.card.blocked {
    filter: brightness(0.7);
    cursor: not-allowed;
}
.card:not(.blocked):active { transform: scale(0.9); }

/* 卡槽 */
#slotBar {
    flex-shrink: 0;
    padding: 4px 12px;
    display: flex;
    justify-content: center;
    gap: 5px;
}
.slot {
    width: 40px; height: 48px;
    background: rgba(255,255,255,0.75);
    border: 2px solid #8b5e3c;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; padding: 1px;
}
.slot img { width: 88%; height: 88%; object-fit: contain; }
.slot.empty { background: rgba(139,94,60,0.25); border-style: dashed; }
.slot.filled { animation: slotPop 0.25s ease-out; }
@keyframes slotPop { from { transform: scale(0.5); } to { transform: scale(1); } }

/* 底部功能区 */
#bottomBar {
    flex-shrink: 0;
    padding: 6px 10px 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 6px;
    background: rgba(255,255,255,0.55);
    border-top: 2px solid #d4c4a8;
}
.bottom-btn {
    flex: 1;
    padding: 8px 4px;
    background: #d4a574;
    color: #fff;
    border: 2px solid #8b5e3c;
    border-radius: 10px;
    font-family: inherit;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
    text-align: center;
}
.bottom-btn:active { transform: scale(0.95); }
.bottom-btn.secondary {
    background: #f0e6d8;
    color: #8b5e3c;
}

/* 飘字提示：屏幕中下方 */
.toast {
    position: fixed;
    left: 50%;
    bottom: 22%;
    transform: translateX(-50%);
    background: rgba(58,42,26,0.9);
    color: #fff;
    padding: 8px 20px;
    border-radius: 18px;
    font-size: 14px;
    font-weight: bold;
    z-index: 9999;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.25s, transform 0.25s;
    white-space: nowrap;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(-10px); }
.toast.good { background: rgba(46,125,50,0.92); }
.toast.bad { background: rgba(198,40,40,0.92); }

/* 开始弹窗：小、半透明 */
#startModal {
    position: fixed;
    left: 50%; top: 45%;
    transform: translate(-50%, -50%);
    background: rgba(245,240,232,0.82);
    border: 2px solid rgba(139,94,60,0.7);
    border-radius: 18px;
    padding: 20px 24px;
    text-align: center;
    box-shadow: 0 8px 24px rgba(0,0,0,0.25);
    z-index: 500;
    min-width: 230px;
    display: none;
}
#startModal.active { display: block; }
#startModal .sm-title { font-size: 18px; font-weight: bold; color: #3a2a1a; margin-bottom: 6px; }
#startModal .sm-text { font-size: 13px; color: #8b5e3c; margin-bottom: 4px; font-weight: bold; }
#startModal .sm-stamina { font-size: 16px; font-weight: bold; color: #33691e; margin: 8px 0 14px; }
#startModal .sm-btn {
    display: block; width: 100%; padding: 10px; margin: 6px 0;
    font-family: inherit; font-size: 15px; font-weight: bold;
    border-radius: 10px; cursor: pointer;
    border: 2px solid #8b5e3c;
    background: #d4a574; color: #fff;
}
#startModal .sm-btn.secondary {
    background: rgba(224,224,224,0.9); border-color: #999; color: #555;
}
#startModal .sm-btn:active { transform: scale(0.96); }

/* 通用弹窗 */
#modalOverlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.6);
    display: none; align-items: center; justify-content: center;
    z-index: 999;
}
#modalOverlay.active { display: flex; }
.modal-box {
    background: #f5f0e8;
    border-radius: 18px;
    padding: 22px 26px;
    text-align: center;
    border: 3px solid #8b5e3c;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    max-width: 320px; width: 85%;
    max-height: 80vh; overflow-y: auto;
}
.modal-title { font-size: 18px; font-weight: bold; color: #3a2a1a; margin-bottom: 10px; }
.modal-text { font-size: 14px; color: #555; margin-bottom: 14px; line-height: 1.6; }
.modal-btn {
    display: block; width: 100%;
    padding: 10px; margin: 6px 0;
    font-family: inherit; font-size: 15px; font-weight: bold;
    background: #d4a574; color: #fff;
    border: 2px solid #8b5e3c; border-radius: 10px; cursor: pointer;
}
.modal-btn.secondary {
    background: #e0e0e0; border-color: #999; color: #555;
}
.modal-btn:active { transform: scale(0.97); }

/* 药书图鉴 */
#bookGrid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    margin: 8px 0;
    text-align: left;
}
.book-item {
    background: #fff;
    border: 1px solid #d4c4a8;
    border-radius: 8px;
    padding: 4px;
    font-size: 11px;
    text-align: center;
    color: #3a2a1a;
}
.book-item img {
    width: 100%; height: 42px;
    object-fit: contain;
}
.book-item .bn { font-size: 10px; margin-top: 2px; }
</style>
</head>
<body>

<div id="topBar">
    <a id="backBtn" href="index.html">←</a>
    <div>
        <span class="info-chip">⚡ <span id="staminaText">5</span></span>
        <span class="info-chip">💰 <span id="coinText">0</span></span>
        <span class="info-chip">🌿 <span id="groupText">0</span>/6</span>
    </div>
</div>

<div id="cardArea"></div>
<div id="slotBar"></div>

<div id="bottomBar">
    <button class="bottom-btn secondary" id="btnBook">📖 药书</button>
    <button class="bottom-btn secondary" id="btnHint">💡 提示</button>
    <button class="bottom-btn" id="btnShuffle">🔄 转换</button>
</div>

<div id="startModal">
    <div class="sm-title">🌿 采药</div>
    <div class="sm-text">每次采药消耗 1 点体力</div>
    <div class="sm-stamina">⚡ 体力：<span id="startStamina">5</span> / 5</div>
    <button class="sm-btn" id="btnStart">开始采药</button>
    <button class="sm-btn secondary" id="btnBackStart">返回主页</button>
</div>

<div id="modalOverlay">
    <div class="modal-box" id="modalBox"></div>
</div>

<script>
(function() {
    'use strict';

    // ===== 常量 =====
    var MAX_STAMINA = 5;
    var STAMINA_RECOVER_MS = 10 * 60 * 1000;
    var SLOT_MAX = 7;
    var TARGET_GROUPS = 6;         // 收集 6 组通关

    // 全部药材池（一次全部出现）
    var HERB_POOL = [
        '桂枝','麻黄','杏仁','甘草','芍药','生姜',
        '大枣','葛根','细辛','干姜'
    ];
    // 杂草池（多种）
    var WEED_POOL = ['杂草','枯枝','落叶','藤蔓','苔藓','烂草','野蒿'];
    var WEED_REAL_NAME = '杂草'; // 实际都当杂草处理

    // 每种药出现 6 张（3组）
    var CARDS_PER_HERB = 6;

    // ===== 仓库 =====
    function getWarehouse() {
        try {
            return JSON.parse(localStorage.getItem('warehouse')) ||
                { herbs: {}, seeds: {}, materials: {}, processed: {} };
        } catch(e) {
            return { herbs: {}, seeds: {}, materials: {}, processed: {} };
        }
    }
    function saveWarehouse(w) {
        localStorage.setItem('warehouse', JSON.stringify(w));
    }
    function addHerb(name, count) {
        var w = getWarehouse();
        w.herbs[name] = (w.herbs[name] || 0) + count;
        saveWarehouse(w);
    }

    // ===== 体力 =====
    function getStamina() {
        var now = Date.now();
        var stamina = parseInt(localStorage.getItem('stamina') || MAX_STAMINA);
        var lastTime = parseInt(localStorage.getItem('staminaTime') || now);
        if (stamina >= MAX_STAMINA) {
            localStorage.setItem('staminaTime', String(now));
            localStorage.setItem('stamina', String(MAX_STAMINA));
            return MAX_STAMINA;
        }
        var elapsed = now - lastTime;
        if (elapsed >= STAMINA_RECOVER_MS) {
            var gained = Math.floor(elapsed / STAMINA_RECOVER_MS);
            stamina = Math.min(MAX_STAMINA, stamina + gained);
            var remainder = elapsed % STAMINA_RECOVER_MS;
            localStorage.setItem('staminaTime', String(now - remainder));
        }
        localStorage.setItem('stamina', String(stamina));
        return stamina;
    }
    function setStamina(v) {
        v = Math.max(0, Math.min(v, MAX_STAMINA));
        localStorage.setItem('stamina', String(v));
        localStorage.setItem('staminaTime', String(Date.now()));
    }
    function getCoins() { return parseInt(localStorage.getItem('coins') || 0); }

    // ===== 元素 =====
    var cardArea = document.getElementById('cardArea');
    var slotBar = document.getElementById('slotBar');
    var startModal = document.getElementById('startModal');
    var staminaText = document.getElementById('staminaText');
    var coinText = document.getElementById('coinText');
    var groupText = document.getElementById('groupText');
    var startStamina = document.getElementById('startStamina');
    var modalOverlay = document.getElementById('modalOverlay');
    var modalBox = document.getElementById('modalBox');

    var slot = [];
    var allCards = [];
    var collectedGroups = 0;
    var gameActive = false;

    // ===== 顶栏 =====
    function renderTop() {
        staminaText.textContent = getStamina();
        coinText.textContent = getCoins();
        groupText.textContent = collectedGroups;
    }
    renderTop();

    // ===== 弹窗 =====
    function showModal(title, html, buttons) {
        var inner = '<div class="modal-title">' + title + '</div>' +
                    '<div class="modal-text">' + html + '</div>';
        for (var i = 0; i < buttons.length; i++) {
            var b = buttons[i];
            inner += '<button class="modal-btn ' + (b.secondary ? 'secondary' : '') + '" data-i="' + i + '">' + b.text + '</button>';
        }
        modalBox.innerHTML = inner;
        modalOverlay.classList.add('active');
        modalBox.querySelectorAll('.modal-btn').forEach(function(btn) {
            btn.onclick = function() {
                var idx = parseInt(this.getAttribute('data-i'));
                var cb = buttons[idx].callback;
                if (cb) cb();
            };
        });
    }
    function closeModal() { modalOverlay.classList.remove('active'); }

    // ===== 卡片生成 =====
    function generateCardList() {
        var list = [];
        // 每种药材 9 张
        for (var i = 0; i < HERB_POOL.length; i++) {
            for (var j = 0; j < CARDS_PER_HERB; j++) list.push(HERB_POOL[i]);
        }
        // 杂草数量 = 药材种类 / 3（向上取整）
        var weedTypes = Math.ceil(HERB_POOL.length / 3);
        for (var k = 0; k < weedTypes; k++) {
            var weedName = WEED_POOL[k % WEED_POOL.length];
            for (var m = 0; m < CARDS_PER_HERB; m++) list.push(weedName);
        }
        // 洗牌
        for (var p = list.length - 1; p > 0; p--) {
            var q = Math.floor(Math.random() * (p + 1));
            var tmp = list[p]; list[p] = list[q]; list[q] = tmp;
        }
        return list;
    }

    function isWeed(name) {
        return WEED_POOL.indexOf(name) !== -1;
    }

    function createCard(name) {
        var el = document.createElement('div');
        el.className = 'card';
        el.dataset.herb = name;

        var img = document.createElement('img');
        img.src = 'images/herbs/' + name + '.png';
        img.onerror = function() { this.style.display = 'none'; };
        el.appendChild(img);

        el.addEventListener('click', function() {
            if (el.classList.contains('blocked')) return;
            clickCard(el, name);
        });
        return el;
    }

    function layoutCards(cardList) {
        cardArea.innerHTML = '';
        allCards = [];
        var w = cardArea.clientWidth;
        var h = cardArea.clientHeight;
        var cw = 42, ch = 52;
        var n = cardList.length;

        for (var i = 0; i < n; i++) {
            var el = createCard(cardList[i]);
            var x = Math.random() * (w - cw);
            var y = Math.random() * (h - ch);
            var z = Math.floor(Math.random() * 999) + 1;
            el.style.left = x + 'px';
            el.style.top = y + 'px';
            el.style.zIndex = z;
            cardArea.appendChild(el);
            allCards.push({ el: el, x: x, y: y, z: z, name: cardList[i] });
        }
        updateBlocked();
    }

    function updateBlocked() {
        for (var i = 0; i < allCards.length; i++) {
            allCards[i].el.classList.remove('blocked');
        }
        for (var a = 0; a < allCards.length; a++) {
            var A = allCards[a];
            if (A.el.style.opacity === '0') continue;
            for (var b = 0; b < allCards.length; b++) {
                if (a === b) continue;
                var B = allCards[b];
                if (B.el.style.opacity === '0') continue;
                if (B.z > A.z && overlap(A, B)) {
                    A.el.classList.add('blocked');
                    break;
                }
            }
        }
    }
    function overlap(a, b) {
        var aw = 42, ah = 52;
        var ox = Math.max(0, Math.min(a.x + aw, b.x + aw) - Math.max(a.x, b.x));
        var oy = Math.max(0, Math.min(a.y + ah, b.y + ah) - Math.max(a.y, b.y));
        return (ox * oy) > (aw * ah * 0.25);
    }

    // ===== 点击卡片 =====
    function clickCard(el, name) {
        if (!gameActive) return;
        if (slot.length >= SLOT_MAX) {
            showToast('卡槽已满，整理一下', 'bad');
            return;
        }

        el.style.opacity = '0';
        el.style.pointerEvents = 'none';
        setTimeout(function() { updateBlocked(); }, 250);

        if (isWeed(name)) {
            showToast('这是杂草，扔掉了', 'bad');
            return;
        }

        slot.push(name);
        renderSlot();
        checkMatch();
    }

    // ===== 三消 =====
    function checkMatch() {
        var counts = {};
        for (var i = 0; i < slot.length; i++) {
            counts[slot[i]] = (counts[slot[i]] || 0) + 1;
        }
        for (var name in counts) {
            if (counts[name] >= 3) {
                var removed = 0;
                slot = slot.filter(function(n) {
                    if (n === name && removed < 3) { removed++; return false; }
                    return true;
                });
                addHerb(name, 3);
                collectedGroups++;
                renderSlot();
                renderTop();
                showToast('采得 ' + name + ' ×3', 'good');

                // 场景里该药材的卡片也一起消失（可选）
                // 这里保留，玩家可以继续收集
                setTimeout(checkWin, 350);
                return;
            }
        }
    }

    function checkWin() {
        if (collectedGroups >= TARGET_GROUPS) {
            gameActive = false;
            showModal(
                '🎉 收获满满！',
                '本局收集了 ' + collectedGroups + ' 组药材<br>是否继续采药？<br><span style="color:#8b5e3c;">继续将消耗 1 点体力</span>',
                [
                    { text: '继续采药（⚡1）', callback: function() { closeModal(); tryStart(); } },
                    { text: '返回主页', secondary: true, callback: function() { location.href = 'index.html'; } }
                ]
            );
        }
    }

    // ===== 卡槽 =====
    function renderSlot() {
        slotBar.innerHTML = '';
        for (var i = 0; i < SLOT_MAX; i++) {
            var s = document.createElement('div');
            s.className = 'slot';
            if (i < slot.length) {
                s.classList.add('filled');
                var img = document.createElement('img');
                img.src = 'images/herbs/' + slot[i] + '.png';
                img.onerror = function() { this.style.display = 'none'; };
                s.appendChild(img);
                s.title = slot[i];
            } else {
                s.classList.add('empty');
            }
            slotBar.appendChild(s);
        }
    }

    // ===== 飘字 =====
    var toastTimer = null;
    function showToast(msg, type) {
        var old = document.querySelector('.toast');
        if (old) old.remove();
        var t = document.createElement('div');
        t.className = 'toast' + (type ? ' ' + type : '');
        t.textContent = msg;
        document.body.appendChild(t);
        requestAnimationFrame(function() { t.classList.add('show'); });
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function() {
            t.classList.remove('show');
            setTimeout(function() { t.remove(); }, 300);
        }, 1400);
    }

    // ===== 药书图鉴 =====
    function showBook() {
        var html = '<div id="bookGrid">';
        for (var i = 0; i < HERB_POOL.length; i++) {
            var n = HERB_POOL[i];
            html += '<div class="book-item">' +
                '<img src="images/herbs/' + n + '.png" onerror="this.style.display=\'none\';">' +
                '<div class="bn">' + n + '</div></div>';
        }
        html += '</div>';
        showModal('📖 中药图鉴', html, [
            { text: '关闭', secondary: true, callback: closeModal }
        ]);
    }

    // ===== 提示 =====
    function showHint() {
        // 找卡槽里数量最多的药材，提示玩家凑齐它
        var counts = {};
        for (var i = 0; i < slot.length; i++) {
            counts[slot[i]] = (counts[slot[i]] || 0) + 1;
        }
        var bestName = null, bestCount = 0;
        for (var name in counts) {
            if (counts[name] > bestCount) { bestCount = counts[name]; bestName = name; }
        }
        var msg;
        if (bestName) {
            msg = '你卡槽里有 ' + bestCount + ' 个「' + bestName + '」<br>再找 ' + (3 - bestCount) + ' 个即可消除';
        } else {
            msg = '卡槽为空，试试点击卡片开始采集吧';
        }
        showModal('💡 提示', msg, [
            { text: '知道了', secondary: true, callback: closeModal }
        ]);
    }

    // ===== 转换（洗牌）=====
    function shuffleCards() {
        if (!gameActive) return;
        var w = cardArea.clientWidth;
        var h = cardArea.clientHeight;
        var cw = 42, ch = 52;
        for (var i = 0; i < allCards.length; i++) {
            var A = allCards[i];
            if (A.el.style.opacity === '0') continue;
            var x = Math.random() * (w - cw);
            var y = Math.random() * (h - ch);
            var z = Math.floor(Math.random() * 999) + 1;
            A.x = x; A.y = y; A.z = z;
            A.el.style.left = x + 'px';
            A.el.style.top = y + 'px';
            A.el.style.zIndex = z;
        }
        updateBlocked();
        showToast('卡片已重新打乱', 'good');
    }

    // ===== 开始游戏 =====
    function tryStart() {
        var s = getStamina();
        if (s < 1) {
            showToast('体力不足，休息一会儿吧', 'bad');
            return;
        }
        setStamina(s - 1);
        renderTop();

        slot = [];
        collectedGroups = 0;
        gameActive = true;
        renderTop();
        renderSlot();

        var list = generateCardList();
        setTimeout(function() { layoutCards(list); }, 20);
    }

    document.getElementById('btnStart').addEventListener('click', function() {
        startModal.classList.remove('active');
        tryStart();
    });
    document.getElementById('btnBackStart').addEventListener('click', function() {
        location.href = 'index.html';
    });
    document.getElementById('btnBook').addEventListener('click', showBook);
    document.getElementById('btnHint').addEventListener('click', showHint);
    document.getElementById('btnShuffle').addEventListener('click', shuffleCards);

    // ===== 初始化 =====
    function openStartModal() {
        startStamina.textContent = getStamina();
        startModal.classList.add('active');
    }
    openStartModal();

    setInterval(renderTop, 30000);
    document.addEventListener('visibilitychange', function() {
        if (!document.hidden) renderTop();
    });
})();
