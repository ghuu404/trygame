<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>采药 - 重生之我是赤脚医生</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: sans-serif;
            user-select: none;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #f5f0e8;
            position: relative;
        }

        /* ===== 开始界面 ===== */
        #startScreen {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: url('images/forest-bg.jpg') no-repeat center center;
            background-size: cover;
            z-index: 5;
        }
        #startScreen::before {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.45);
        }
        #startScreen > * { position: relative; z-index: 2; }
        #startTitle {
            font-size: 38px;
            color: #fff;
            font-weight: bold;
            text-shadow: 2px 2px 6px rgba(0,0,0,0.8);
            margin-bottom: 25px;
        }
        #staminaDisplay {
            font-size: 20px;
            color: #fff;
            background: rgba(51, 105, 30, 0.85);
            padding: 8px 26px;
            border-radius: 30px;
            margin-bottom: 50px;
            font-weight: bold;
            border: 2px solid #aed581;
        }
        .start-btn {
            font-size: 19px;
            font-weight: bold;
            padding: 14px 50px;
            border: 3px solid #33691e;
            border-radius: 30px;
            background: #aed581;
            color: #33691e;
            cursor: pointer;
            margin: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: all 0.15s;
            min-width: 220px;
        }
        .start-btn:active { transform: scale(0.95); }
        #btnBack {
            background: rgba(224, 224, 224, 0.95);
            border-color: #666;
            color: #333;
            font-size: 16px;
            padding: 10px 40px;
        }

        /* ===== 游戏界面 ===== */
        #gameScreen {
            width: 100%;
            max-width: 480px;
            height: 100%;
            display: none;
            flex-direction: column;
            align-items: center;
            padding: 8px 0;
        }
        #gameScreen.active { display: flex; }

        h1 { font-size: 20px; color: #5a3e2b; margin-bottom: 5px; }
        #areaSelect {
            display: flex;
            gap: 8px;
            margin-bottom: 6px;
        }
        .areaBtn {
            padding: 5px 14px;
            border-radius: 16px;
            border: 2px solid #8b5e3c;
            background: #fff;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: all 0.2s;
        }
        .areaBtn.active {
            background: #8b5e3c;
            color: #fff;
        }
        #target {
            font-size: 14px;
            padding: 5px 12px;
            background: rgba(255,255,255,0.85);
            border-radius: 20px;
            border: 2px solid #d4a574;
            margin-bottom: 4px;
        }
        #message {
            font-size: 15px;
            height: 22px;
            font-weight: bold;
            margin: 2px 0;
        }
        #cardArea {
            position: relative;
            width: 95%;
            height: 48vh;
            max-height: 420px;
            margin: 5px auto;
            background: rgba(255,255,255,0.3);
            border-radius: 16px;
            border: 3px solid #b89a72;
            overflow: hidden;
            background-size: cover;
            background-position: center;
        }
        .card {
            position: absolute;
            width: 20vw;
            max-width: 80px;
            height: 24vw;
            max-height: 96px;
            background: #fff;
            border: 2px solid #8b5e3c;
            border-radius: 10px;
            cursor: pointer;
            text-align: center;
            font-size: 12px;
            font-weight: bold;
            transition: transform 0.1s, opacity 0.2s;
            z-index: 1;
        }
        .card img {
            width: 70%;
            height: 60%;
            object-fit: cover;
            border-radius: 6px;
            margin-top: 5px;
            pointer-events: none;
        }
        .card .name {
            display: block;
            font-size: 12px;
            color: #3a2a1a;
            pointer-events: none;
        }
        .card.blocked {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .card:hover:not(.blocked) {
            transform: translateY(-3px);
            border-color: #ff8c00;
            z-index: 100;
        }
        #slotArea { margin-top: 4px; }
        #slot {
            display: flex;
            justify-content: center;
            gap: 4px;
            background: #5a3e2b;
            padding: 6px;
            border-radius: 12px;
            min-height: 60px;
            width: 90%;
            margin: 0 auto;
        }
        .slot-item {
            width: 40px;
            height: 48px;
            background: #e8d5c0;
            border-radius: 6px;
            font-size: 10px;
            font-weight: bold;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .slot-item img {
            width: 28px;
            height: 28px;
            object-fit: cover;
            border-radius: 4px;
        }
        #rewards {
            font-size: 12px;
            color: #5a3e2b;
            margin-top: 3px;
        }

        /* ===== 弹窗 ===== */
        #modalOverlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.65);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 999;
        }
        #modalOverlay.active { display: flex; }
        .modal-box {
            background: #f5f0e8;
            border-radius: 20px;
            padding: 28px 32px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            width: 80%;
            max-width: 300px;
            border: 3px solid #558b2f;
        }
        .modal-title {
            font-size: 22px;
            font-weight: bold;
            color: #33691e;
            margin-bottom: 8px;
        }
        .modal-text {
            font-size: 14px;
            color: #666;
            margin-bottom: 20px;
        }
        .modal-btn {
            display: block;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            padding: 12px;
            margin: 8px 0;
            border: 2px solid #558b2f;
            border-radius: 12px;
            background: #aed581;
            color: #33691e;
            cursor: pointer;
            transition: all 0.15s;
        }
        .modal-btn:active { transform: scale(0.96); }
        .modal-btn.secondary {
            background: #e0e0e0;
            border-color: #999;
            color: #555;
        }
    </style>
</head>
<body>
    <!-- 开始界面 -->
    <div id="startScreen">
        <div id="startTitle">🌿 采药</div>
        <div id="staminaDisplay">⚡ 体力：5 / 5</div>
        <button class="start-btn" id="btnStart">开始采药（⚡1）</button>
        <button class="start-btn" id="btnBack">返回主页面</button>
    </div>

    <!-- 游戏界面 -->
    <div id="gameScreen">
        <h1>🌿 采药</h1>
        <div id="areaSelect">
            <div class="areaBtn active" data-area="forest">丛林</div>
            <div class="areaBtn" data-area="mountain">山地</div>
            <div class="areaBtn" data-area="field">田野</div>
        </div>
        <div id="target">🎯 <span id="targetDisplay"></span></div>
        <div id="message"></div>
        <div id="cardArea"></div>
        <div id="slotArea">
            <div id="slot"></div>
        </div>
        <div id="rewards">🏆 已获得：暂无</div>
    </div>

    <!-- 弹窗 -->
    <div id="modalOverlay">
        <div class="modal-box">
            <div class="modal-title" id="modalTitle">采药失败</div>
            <div class="modal-text" id="modalText">继续采药需要消耗 1 点体力</div>
            <button class="modal-btn" id="modalContinue">继续采药 ⚡1</button>
            <button class="modal-btn secondary" id="modalBack">返回主页面</button>
        </div>
    </div>

    <script>
        // ===== 体力系统 =====
        const MAX_STAMINA = 5;
        const STORAGE_KEY = 'playerStamina';

        function getStamina() {
            let s = localStorage.getItem(STORAGE_KEY);
            if (s === null) {
                localStorage.setItem(STORAGE_KEY, MAX_STAMINA);
                return MAX_STAMINA;
            }
            return Math.min(parseInt(s), MAX_STAMINA);
        }

        function setStamina(v) {
            v = Math.max(0, Math.min(v, MAX_STAMINA));
            localStorage.setItem(STORAGE_KEY, v);
        }

        // ===== 药材数据 =====
        const herbs = [
            { name: '桂枝', img: '', area: 'forest' },
            { name: '茯苓', img: '', area: 'forest' },
            { name: '葛根', img: '', area: 'forest' },
            { name: '黄连', img: '', area: 'forest' },
            { name: '人参', img: '', area: 'forest' },
            { name: '细辛', img: '', area: 'forest' },
            { name: '厚朴', img: '', area: 'forest' },
            { name: '枳实', img: '', area: 'forest' },
            { name: '猪苓', img: '', area: 'forest' },
            { name: '麻黄', img: '', area: 'mountain' },
            { name: '杏仁', img: '', area: 'mountain' },
            { name: '柴胡', img: '', area: 'mountain' },
            { name: '黄芩', img: '', area: 'mountain' },
            { name: '知母', img: '', area: 'mountain' },
            { name: '附子', img: '', area: 'mountain' },
            { name: '白术', img: '', area: 'mountain' },
            { name: '大黄', img: '', area: 'mountain' },
            { name: '当归', img: '', area: 'mountain' },
            { name: '五味子', img: '', area: 'mountain' },
            { name: '芍药', img: '', area: 'field' },
            { name: '甘草', img: '', area: 'field' },
            { name: '生姜', img: '', area: 'field' },
            { name: '大枣', img: '', area: 'field' },
            { name: '半夏', img: '', area: 'field' },
            { name: '茵陈', img: '', area: 'field' },
            { name: '泽泻', img: '', area: 'field' },
            { name: '栀子', img: '', area: 'field' },
            { name: '通草', img: '', area: 'field' },
            { name: '干姜', img: '', area: 'field' },
            { name: '粳米', img: '', area: 'field' }
        ];

        const areaBackgrounds = {
            forest: 'url("images/forest-bg.jpg")',
            mountain: 'url("images/mountain-bg.jpg")',
            field: 'url("images/field-bg.jpg")'
        };

        const TARGET_KINDS = 3;
        const CARDS_PER_TARGET = 9;
        const TOTAL_KINDS = 6;
        const SLOT_MAX = 7;

        let currentArea = 'forest';
        let currentGoal = {};
        let slot = [];
        let collected = {};
        let totalRewards = {};
        let allCards = [];

        const startScreenEl = document.getElementById('startScreen');
        const gameScreenEl = document.getElementById('gameScreen');
        const staminaDisplayEl = document.getElementById('staminaDisplay');
        const targetDisplay = document.getElementById('targetDisplay');
        const messageEl = document.getElementById('message');
        const cardAreaEl = document.getElementById('cardArea');
        const slotEl = document.getElementById('slot');
        const rewardsEl = document.getElementById('rewards');

        const modalOverlay = document.getElementById('modalOverlay');
        const modalTitle = document.getElementById('modalTitle');
        const modalText = document.getElementById('modalText');
        const modalContinue = document.getElementById('modalContinue');
        const modalBack = document.getElementById('modalBack');

        // ===== 开始界面 =====
        function showStartScreen() {
            startScreenEl.style.display = 'flex';
            gameScreenEl.classList.remove('active');
            staminaDisplayEl.textContent = `⚡ 体力：${getStamina()} / ${MAX_STAMINA}`;
        }

        function showGameScreen() {
            startScreenEl.style.display = 'none';
            gameScreenEl.classList.add('active');
        }

        function tryStart() {
            const stamina = getStamina();
            if (stamina < 1) {
                alert('体力不足！等待恢复或明天再来吧～');
                return;
            }
            setStamina(stamina - 1);
            showGameScreen();
            initLevel();
        }

        function showModal(title, text) {
            modalTitle.textContent = title;
            modalText.textContent = text;
            modalOverlay.classList.add('active');
        }

        function hideModal() {
            modalOverlay.classList.remove('active');
        }

        // ===== 初始化关卡 =====
        function initLevel() {
            const areaHerbs = herbs.filter(h => h.area === currentArea);
            const shuffled = [...areaHerbs].sort(() => Math.random() - 0.5);
            const targetHerbs = shuffled.slice(0, Math.min(TARGET_KINDS, shuffled.length));
            currentGoal = {};
            targetHerbs.forEach(h => { currentGoal[h.name] = CARDS_PER_TARGET; });
            collected = {};
            slot = [];
            updateTargetDisplay();
            createCards(areaHerbs);
            renderSlot();
            messageEl.textContent = '';
            cardAreaEl.style.background = areaBackgrounds[currentArea];
            cardAreaEl.style.backgroundSize = 'cover';
            cardAreaEl.style.backgroundPosition = 'center';
        }

        function updateTargetDisplay() {
            let parts = [];
            for (let [name, total] of Object.entries(currentGoal)) {
                const got = collected[name] || 0;
                parts.push(`${name} ${got}/${total}`);
            }
            targetDisplay.textContent = parts.join('  ');
        }

        function createCards(areaHerbs) {
            cardAreaEl.innerHTML = '';
            allCards = [];

            let cardList = [];
            for (let [name] of Object.entries(currentGoal)) {
                const herb = areaHerbs.find(h => h.name === name);
                for (let i = 0; i < CARDS_PER_TARGET; i++) cardList.push(herb);
            }
            const nonTargets = areaHerbs.filter(h => !(h.name in currentGoal));
            const shuffledNonTargets = nonTargets.sort(() => Math.random() - 0.5);
            shuffledNonTargets.slice(0, TOTAL_KINDS - TARGET_KINDS).forEach(herb => {
                for (let i = 0; i < CARDS_PER_TARGET; i++) cardList.push(herb);
            });

            cardList.sort(() => Math.random() - 0.5);
            const positions = generatePositions(cardList.length);

            cardList.forEach((herb, index) => {
                const div = document.createElement('div');
                div.className = 'card';
                div.dataset.herb = herb.name;
                div.style.left = positions[index].x + 'px';
                div.style.top = positions[index].y + 'px';
                div.style.zIndex = positions[index].z;
                div.innerHTML = herb.img
                    ? `<img src="${herb.img}"><span class="name">${herb.name}</span>`
                    : `<div style="font-size:25px;margin-top:6px;">🌿</div><span class="name">${herb.name}</span>`;
                div.onclick = function() {
                    if (!div.classList.contains('blocked')) {
                        clickCard(div, herb.name);
                    }
                };
                cardAreaEl.appendChild(div);
                allCards.push({
                    el: div,
                    x: positions[index].x,
                    y: positions[index].y,
                    z: positions[index].z,
                    name: herb.name
                });
            });

            updateBlocked();
        }

        function generatePositions(count) {
            const positions = [];
            const areaWidth = cardAreaEl.clientWidth;
            const areaHeight = cardAreaEl.clientHeight;
            const cardW = Math.min(80, areaWidth * 0.2);
            const cardH = cardW * 1.2;

            for (let i = 0; i < count; i++) {
                const x = Math.random() * (areaWidth - cardW);
                const y = Math.random() * (areaHeight - cardH);
                positions.push({
                    x: x,
                    y: y,
                    z: Math.floor(Math.random() * 10) + 1
                });
            }
            return positions;
        }

        function updateBlocked() {
            allCards.forEach(card => card.el.classList.remove('blocked'));

            for (let i = 0; i < allCards.length; i++) {
                const cardA = allCards[i];
                if (cardA.el.style.opacity === '0') continue;

                for (let j = 0; j < allCards.length; j++) {
                    if (i === j) continue;
                    const cardB = allCards[j];
                    if (cardB.el.style.opacity === '0') continue;

                    if (cardB.z > cardA.z && isOverlapping(cardA, cardB)) {
                        cardA.el.classList.add('blocked');
                        break;
                    }
                }
            }
        }

        function isOverlapping(a, b) {
            const aw = a.el.clientWidth, ah = a.el.clientHeight;
            const bw = b.el.clientWidth, bh = b.el.clientHeight;
            const ax1 = a.x, ay1 = a.y;
            const ax2 = a.x + aw, ay2 = a.y + ah;
            const bx1 = b.x, by1 = b.y;
            const bx2 = b.x + bw, by2 = b.y + bh;

            const overlapX = Math.max(0, Math.min(ax2, bx2) - Math.max(ax1, bx1));
            const overlapY = Math.max(0, Math.min(ay2, by2) - Math.max(ay1, by1));
            const overlapArea = overlapX * overlapY;
            const cardArea = aw * ah;

            return overlapArea > cardArea * 0.3;
        }

        function clickCard(cardEl, herbName) {
            if (slot.length >= SLOT_MAX) {
                messageEl.textContent = '❌ 卡槽满了！';
                messageEl.style.color = 'red';
                return;
            }

            cardEl.style.opacity = '0';
            cardEl.style.pointerEvents = 'none';

            slot.push(herbName);
            renderSlot();
            checkSlotMatch();
            updateBlocked();
        }

        // ===== 同步写入仓库 =====
        function addToInventory(name, count) {
            let inv = JSON.parse(localStorage.getItem('herbInventory') || '{}');
            inv[name] = (inv[name] || 0) + count;
            localStorage.setItem('herbInventory', JSON.stringify(inv));
        }

        function checkSlotMatch() {
            const counts = {};
            for (let name of slot) {
                counts[name] = (counts[name] || 0) + 1;
            }

            for (let [name, count] of Object.entries(counts)) {
                if (count >= 3) {
                    let removed = 0;
                    slot = slot.filter(n => {
                        if (n === name && removed < 3) {
                            removed++;
                            return false;
                        }
                        return true;
                    });

                    if (currentGoal[name] !== undefined) {
                        collected[name] = (collected[name] || 0) + 3;
                        addToInventory(name, 3);
                    }

                    renderSlot();
                    updateTargetDisplay();
                    checkWin();
                    return;
                }
            }

            if (slot.length >= SLOT_MAX) {
                messageEl.textContent = '❌ 卡槽满了，失败！';
                messageEl.style.color = 'red';
                setTimeout(() => {
                    showModal('采药失败', '卡槽已满，继续采药需要消耗 1 点体力');
                }, 400);
            }
        }

        function checkWin() {
            for (let [name, total] of Object.entries(currentGoal)) {
                if ((collected[name] || 0) < total) return;
            }

            messageEl.textContent = '🎉 过关！';
            messageEl.style.color = 'green';

            for (let [name, total] of Object.entries(currentGoal)) {
                totalRewards[name] = (totalRewards[name] || 0) + total;
                addToInventory(name, total);
            }
            updateRewards();

            setTimeout(() => {
                showModal('采药成功', '已获得奖励，继续采药需要消耗 1 点体力');
            }, 500);
        }

        function renderSlot() {
            slotEl.innerHTML = '';
            for (let name of slot) {
                const herb = herbs.find(h => h.name === name);
                const div = document.createElement('div');
                div.className = 'slot-item';
                div.innerHTML = herb.img
                    ? `<img src="${herb.img}"><span>${herb.name}</span>`
                    : `<div style="font-size:18px;">🌿</div><span>${herb.name}</span>`;
                slotEl.appendChild(div);
            }
            for (let i = slot.length; i < SLOT_MAX; i++) {
                const empty = document.createElement('div');
                empty.className = 'slot-item';
                empty.style.background = '#8a7255';
                slotEl.appendChild(empty);
            }
        }

        function updateRewards() {
            if (Object.keys(totalRewards).length === 0) {
                rewardsEl.textContent = '🏆 已获得：暂无';
            } else {
                let parts = [];
                for (let [name, count] of Object.entries(totalRewards)) {
                    parts.push(`${name} x${count}`);
                }
                rewardsEl.textContent = '🏆 已获得：' + parts.join('、');
            }
        }

        // ===== 区域切换 =====
        document.querySelectorAll('.areaBtn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.areaBtn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentArea = this.dataset.area;
                initLevel();
            });
        });

        // ===== 按钮事件 =====
        document.getElementById('btnStart').addEventListener('click', tryStart);
        document.getElementById('btnBack').addEventListener('click', () => {
            window.location.href = 'index.html';
        });

        modalContinue.addEventListener('click', () => {
            const stamina = getStamina();
            if (stamina < 1) {
                alert('体力不足！等待恢复或明天再来吧～');
                return;
            }
            setStamina(stamina - 1);
            hideModal();
            initLevel();
            messageEl.textContent = '';
        });

        modalBack.addEventListener('click', () => {
            hideModal();
            window.location.href = 'index.html';
        });

        // ===== 初始化 =====
        showStartScreen();
    </script>
</body>
</html>
