<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>行医 · 问诊</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    user-select: none; background: #2a1a0a;
    display: flex; flex-direction: column; align-items: center;
  }
  #app {
    width: 100%; max-width: 440px; height: 100%;
    display: flex; flex-direction: column; position: relative;
    background: #f5f0e8;
  }
  #topBar {
    height: 46px; display: flex; align-items: center;
    padding: 0 12px; gap: 10px;
    background: linear-gradient(180deg, #6d4c2a 0%, #4a2f1a 100%);
    color: #fff; box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    flex-shrink: 0; z-index: 5;
  }
  .icon-btn {
    background: rgba(255,255,255,0.15); border: none; color: #fff;
    font-size: 18px; width: 34px; height: 34px; border-radius: 8px; cursor: pointer;
  }
  .icon-btn:active { transform: scale(0.92); }
  #progress { flex: 1; text-align: center; font-size: 14px; font-weight: bold; letter-spacing: 1px; }
  #coinTag {
    font-size: 13px; font-weight: bold;
    background: rgba(255,215,0,0.2); color: #ffd700;
    border: 1px solid rgba(255,215,0,0.5);
    padding: 4px 10px; border-radius: 12px;
  }
  #stage {
    flex: 1; position: relative; overflow: hidden;
    background: #3a2a1a;
    display: flex; align-items: center; justify-content: center;
  }
  #sceneWrap {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
  }
  #sceneWrap svg { width: 100%; height: 100%; display: block; }

  @keyframes shiver {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-3px); }
    75% { transform: translateX(3px); }
  }
  .shiver { animation: shiver 0.3s infinite; }
  @keyframes breathe {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-2.5px); }
  }
  .breathe { animation: breathe 3s ease-in-out infinite; }
  .patient-group { transform-origin: 180px 340px; }

  .hotspot { cursor: pointer; pointer-events: all; }
  .hotspot .hotspot-ring {
    transform-box: fill-box;
    transform-origin: center;
    animation: pulseRing 1.4s infinite ease-out;
  }
  @keyframes pulseRing {
    0% { transform: scale(0.7); opacity: 0.85; }
    100% { transform: scale(1.55); opacity: 0; }
  }
  .hotspot .hotspot-dot { animation: dotBlink 1.4s infinite ease-in-out; }
  @keyframes dotBlink {
    0%,100% { opacity: 0.5; }
    50% { opacity: 1; }
  }

  #bubble {
    position: absolute; top: 14px; left: 50%;
    transform: translateX(-50%) scale(0.9);
    background: #fffdf5; border: 2px solid #6d4c2a;
    border-radius: 14px; padding: 10px 16px;
    font-size: 14px; color: #3a2a1a; font-weight: bold;
    max-width: 82%; line-height: 1.4;
    box-shadow: 0 6px 16px rgba(0,0,0,0.3);
    opacity: 0; transition: all 0.25s ease;
    z-index: 3; text-align: center;
  }
  #bubble::after {
    content: ''; position: absolute; bottom: -10px; left: 50%;
    transform: translateX(-50%);
    border: 8px solid transparent;
    border-top-color: #6d4c2a;
  }
  #bubble.show { opacity: 1; transform: translateX(-50%) scale(1); }

  #casePanel {
    background: #fffaf0; border-top: 3px solid #6d4c2a;
    padding: 8px 14px; min-height: 62px; max-height: 96px;
    overflow-y: auto; font-size: 12px; color: #5a4a30;
    flex-shrink: 0;
  }
  .case-title { font-size: 12px; font-weight: bold; color: #6d4c2a; margin-bottom: 4px; }
  #caseContent { line-height: 1.6; }
  #caseContent .sym { color: #b34100; font-weight: bold; }
  #caseContent .pulse { color: #1565c0; font-weight: bold; }

  #actionArea {
    padding: 10px 14px 16px; background: #f0e6d0;
    border-top: 2px solid #d4c4a8; flex-shrink: 0;
    min-height: 76px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .action-tip {
    font-size: 13px; color: #6b5a3a; text-align: center;
    font-weight: bold; line-height: 1.4;
  }
  .action-btn {
    display: block; width: 100%; font-size: 15px; font-weight: bold;
    padding: 11px; border: 2px solid #6d4c2a; border-radius: 12px;
    background: linear-gradient(180deg, #d4a574 0%, #b8845a 100%);
    color: #3a2a1a; cursor: pointer; transition: all 0.15s;
    box-shadow: 0 3px 0 #6d4c2a;
  }
  .action-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #6d4c2a; }
  .option-btn {
    display: block; width: 100%; text-align: left;
    font-size: 15px; font-weight: bold;
    padding: 12px 16px; margin-bottom: 6px;
    border: 2px solid #8b7355; border-radius: 12px;
    background: #fffdf5; color: #4a3a20; cursor: pointer;
    transition: all 0.15s;
  }
  .option-btn:active { transform: scale(0.98); background: #f0e6d0; }
  .option-btn.correct { background: #c5e1a5; border-color: #33691e; color: #1a3a00; }
  .option-btn.wrong { background: #ffcdd2; border-color: #c62828; color: #7a1010; }
  .option-btn:disabled { cursor: default; }

  #modalOverlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.65);
    display: none; align-items: center; justify-content: center;
    z-index: 999; padding: 20px;
  }
  #modalOverlay.active { display: flex; }
  .modal-box {
    background: #f5f0e8; border-radius: 20px; padding: 26px 30px;
    text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    width: 100%; max-width: 320px; border: 3px solid #6d4c2a;
  }
  .modal-title { font-size: 22px; font-weight: bold; color: #6d4c2a; margin-bottom: 10px; }
  .modal-text { font-size: 14px; color: #5a4a30; margin-bottom: 20px; line-height: 1.5; white-space: pre-line; }
  .modal-btn {
    display: block; width: 100%; font-size: 16px; font-weight: bold;
    padding: 12px; margin: 8px 0; border: 2px solid #6d4c2a;
    border-radius: 12px;
    background: linear-gradient(180deg, #d4a574 0%, #b8845a 100%);
    color: #3a2a1a; cursor: pointer;
    box-shadow: 0 3px 0 #6d4c2a;
  }
  .modal-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #6d4c2a; }
</style>
</head>
<body>

<div id="app">
  <header id="topBar">
    <button class="icon-btn" id="btnHome">←</button>
    <div id="progress">病人 1 / 5</div>
    <div id="coinTag">💰 0</div>
  </header>

  <div id="stage">
    <div id="sceneWrap"></div>
    <div id="bubble"></div>
  </div>

  <div id="casePanel">
    <div class="case-title">📋 病历</div>
    <div id="caseContent">尚未开始诊治</div>
  </div>

  <div id="actionArea"></div>
</div>

<div id="modalOverlay">
  <div class="modal-box">
    <div class="modal-title" id="modalTitle"></div>
    <div class="modal-text" id="modalText"></div>
    <button class="modal-btn" id="modalBtn"></button>
  </div>
</div>

<script src="common.js"></script>
<script>
/* ================================================================
 *  行医 · 问诊模块  v3  (完整游戏画面)
 * ================================================================ */

/* ---------- 音效 ---------- */
let audioCtx = null;
function beep(freq, dur = 0.12, type = 'sine', vol = 0.12) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type; osc.frequency.value = freq;
    osc.connect(gain); gain.connect(audioCtx.destination);
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.start(); osc.stop(audioCtx.currentTime + dur);
  } catch (e) {}
}
const sfx = {
  wrong:   () => { beep(180, 0.14, 'square', 0.1); setTimeout(() => beep(140, 0.2, 'square', 0.1), 110); },
  correct: () => { beep(660, 0.1); setTimeout(() => beep(880, 0.14), 90); },
  click:   () => beep(520, 0.06, 'sine', 0.08),
  win:     () => { beep(523,0.1); setTimeout(()=>beep(659,0.1),100); setTimeout(()=>beep(784,0.2),200); },
  lose:    () => { beep(300,0.2,'sawtooth',0.08); setTimeout(()=>beep(200,0.3,'sawtooth',0.08),180); }
};

/* ================================================================
 *  场景布局常量（viewBox: 0 0 360 500）
 *  - 上半：药柜墙
 *  - 中：患者
 *  - 下：诊桌（y=380 起）
 * ================================================================ */

/* ----- 匾额 ----- */
function buildPlaqueSVG() {
  return `
    <rect x="110" y="14" width="140" height="42" rx="4" fill="#3a1a08" stroke="#1a0a00" stroke-width="2"/>
    <rect x="114" y="18" width="132" height="34" rx="3" fill="#5a2a10"/>
    <rect x="114" y="18" width="132" height="34" rx="3" fill="none" stroke="#c9a05a" stroke-width="1.5"/>
    <text x="180" y="42" text-anchor="middle" font-size="20" font-family="KaiTi, STKaiti, serif" fill="#e8c880" letter-spacing="2">妙手回春</text>
  `;
}

/* ----- 药柜 ----- */
function buildCabinetSVG() {
  let s = '';
  const cols = 6, rows = 4;
  const x0 = 12, y0 = 68, w = 56, h = 68;
  const totalW = cols * w, totalH = rows * h;
  // 柜体
  s += `<rect x="${x0-6}" y="${y0-6}" width="${totalW+12}" height="${totalH+12}" rx="6" fill="#3a1e0a" stroke="#1a0a00" stroke-width="2"/>`;
  // 顶部横梁
  s += `<rect x="${x0-6}" y="${y0-10}" width="${totalW+12}" height="8" rx="2" fill="#5a2a10"/>`;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const x = x0 + c*w, y = y0 + r*h;
      // 抽屉
      s += `<rect x="${x+2}" y="${y+2}" width="${w-4}" height="${h-4}" rx="2" fill="#6a3a18" stroke="#2a1206" stroke-width="1.2"/>`;
      // 内嵌面板
      s += `<rect x="${x+7}" y="${y+10}" width="${w-14}" height="${h-20}" rx="2" fill="#8a4a22"/>`;
      s += `<rect x="${x+7}" y="${y+10}" width="${w-14}" height="${h-20}" rx="2" fill="none" stroke="#2a1206" stroke-width="0.8"/>`;
      // 铜环
      s += `<circle cx="${x+w/2}" cy="${y+h/2+3}" r="3.8" fill="#c9a05a" stroke="#3a1a08" stroke-width="1"/>`;
      s += `<circle cx="${x+w/2}" cy="${y+h/2+3}" r="1.4" fill="#5a3a10"/>`;
    }
  }
  return s;
}

/* ----- 艾草挂饰 ----- */
function buildHangingHerbSVG() {
  return `
    <g opacity="0.85">
      <path d="M14 62 Q18 90 20 118" stroke="#4a6a2a" stroke-width="2" fill="none"/>
      <ellipse cx="18" cy="80" rx="6" ry="12" fill="#6a8a3a" transform="rotate(-15 18 80)"/>
      <ellipse cx="22" cy="98" rx="5" ry="10" fill="#5a7a2a" transform="rotate(10 22 98)"/>
      <ellipse cx="18" cy="112" rx="5" ry="9" fill="#6a8a3a" transform="rotate(-10 18 112)"/>
    </g>
    <g opacity="0.85">
      <path d="M346 62 Q342 90 340 118" stroke="#4a6a2a" stroke-width="2" fill="none"/>
      <ellipse cx="342" cy="80" rx="6" ry="12" fill="#6a8a3a" transform="rotate(15 342 80)"/>
      <ellipse cx="338" cy="98" rx="5" ry="10" fill="#5a7a2a" transform="rotate(-10 338 98)"/>
      <ellipse cx="342" cy="112" rx="5" ry="9" fill="#6a8a3a" transform="rotate(10 342 112)"/>
    </g>
  `;
}

/* ----- 玩家把脉的手 ----- */
function buildDoctorHandSVG() {
  return `
    <!-- 袖管 -->
    <path d="M360 480 Q312 458 278 420 L292 384 Q328 408 360 420 Z" fill="#f5ecd6" stroke="#b0a080" stroke-width="2"/>
    <path d="M278 420 Q300 402 316 408 L292 384 Q272 382 264 398 Z" fill="#ddd0a8" opacity="0.6"/>
    <!-- 袖口纹 -->
    <path d="M292 384 Q308 396 322 396" stroke="#8a7a50" stroke-width="1.5" fill="none"/>
    <!-- 手掌 -->
    <ellipse cx="268" cy="362" rx="22" ry="18" fill="#f6d5b4" stroke="#b88a60" stroke-width="2"/>
    <!-- 三指搭在脉枕 -->
    <ellipse cx="256" cy="330" rx="6" ry="15" fill="#f6d5b4" stroke="#b88a60" stroke-width="1.5" transform="rotate(-14 256 330)"/>
    <ellipse cx="268" cy="325" rx="6" ry="15" fill="#f6d5b4" stroke="#b88a60" stroke-width="1.5" transform="rotate(-14 268 325)"/>
    <ellipse cx="280" cy="328" rx="6" ry="15" fill="#f6d5b4" stroke="#b88a60" stroke-width="1.5" transform="rotate(-14 280 328)"/>
    <!-- 指甲 -->
    <ellipse cx="255" cy="321" rx="2.6" ry="3.8" fill="#f0c8a8" opacity="0.8"/>
    <ellipse cx="267" cy="316" rx="2.6" ry="3.8" fill="#f0c8a8" opacity="0.8"/>
    <ellipse cx="279" cy="319" rx="2.6" ry="3.8" fill="#f0c8a8" opacity="0.8"/>
    <!-- 拇指 -->
    <ellipse cx="290" cy="362" rx="12" ry="7" fill="#f6d5b4" stroke="#b88a60" stroke-width="1.5" transform="rotate(20 290 362)"/>
    <!-- 手掌肉色阴影 -->
    <path d="M256 356 Q268 366 282 358" stroke="#c9a07a" stroke-width="1.2" fill="none" opacity="0.5"/>
    <!-- 袖口 -->
    <path d="M292 384 Q282 396 272 406" stroke="#b0a080" stroke-width="2" fill="none"/>
  `;
}

/* ----- 患者身体（肩宽 160） ----- */
function buildBodySVG(look) {
  const { skin, skinShade, robe, robeDark } = look;
  let s = '';
  // 脖子
  s += `<rect x="161" y="184" width="38" height="42" rx="8" fill="${skin}" stroke="${skinShade}" stroke-width="1"/>`;
  s += `<path d="M161 206 Q180 216 199 206" stroke="${skinShade}" stroke-width="1.2" fill="none" opacity="0.55"/>`;
  // 袍身
  s += `<path d="M100 234 Q180 200 260 234 L280 430 L80 430 Z" fill="${robe}"/>`;
  s += `<path d="M100 234 Q180 200 260 234 L280 430 L80 430 Z" fill="url(#robeShade)" opacity="0.4"/>`;
  // 衣襟
  s += `<path d="M180 224 L180 430" stroke="${robeDark}" stroke-width="2.4" fill="none" opacity="0.55"/>`;
  // V 领
  s += `<path d="M156 216 L180 270 L204 216 Q180 232 156 216 Z" fill="${robeDark}"/>`;
  // 衣纹
  s += `<path d="M120 268 Q145 300 132 360" stroke="${robeDark}" stroke-width="1.6" fill="none" opacity="0.35"/>`;
  s += `<path d="M240 268 Q215 300 228 360" stroke="${robeDark}" stroke-width="1.6" fill="none" opacity="0.35"/>`;
  return s;
}

/* ----- 头发 ----- */
function buildHairSVG(look) {
  const { hair, hairDark, hairStyle } = look;
  let s = '';
  if (hairStyle === 'bun') {
    s += `<path d="M118 128 Q120 78 180 76 Q240 78 242 128 Q234 100 180 98 Q126 100 118 128 Z" fill="${hair}"/>`;
    s += `<ellipse cx="180" cy="66" rx="26" ry="18" fill="${hair}"/>`;
    s += `<ellipse cx="180" cy="66" rx="26" ry="18" fill="none" stroke="${hairDark}" stroke-width="1.6"/>`;
    s += `<path d="M148 70 Q180 64 212 70" stroke="#8b2a2a" stroke-width="3.5" fill="none"/>`;
  } else if (hairStyle === 'topknot') {
    s += `<path d="M118 128 Q120 78 180 76 Q240 78 242 128 Q234 100 180 98 Q126 100 118 128 Z" fill="${hair}"/>`;
    s += `<circle cx="180" cy="62" r="17" fill="${hair}"/>`;
    s += `<circle cx="180" cy="62" r="17" fill="none" stroke="${hairDark}" stroke-width="1.6"/>`;
  } else if (hairStyle === 'old-bun') {
    s += `<path d="M116 128 Q118 74 180 72 Q242 74 244 128 Q234 98 180 96 Q126 98 116 128 Z" fill="${hair}"/>`;
    s += `<ellipse cx="180" cy="60" rx="24" ry="17" fill="${hair}"/>`;
    s += `<ellipse cx="180" cy="60" rx="24" ry="17" fill="none" stroke="${hairDark}" stroke-width="1.6"/>`;
    s += `<path d="M154 62 Q180 58 206 62" stroke="${hairDark}" stroke-width="1.6" fill="none"/>`;
  } else if (hairStyle === 'longhair') {
    s += `<path d="M112 128 Q112 66 180 64 Q248 66 248 128 Q254 190 244 240 L248 268 L212 268 L212 200 Q214 118 180 116 Q146 118 148 200 L148 268 L112 268 L116 240 Q106 190 112 128 Z" fill="${hair}"/>`;
    s += `<ellipse cx="180" cy="54" rx="30" ry="20" fill="${hair}"/>`;
    s += `<ellipse cx="180" cy="54" rx="30" ry="20" fill="none" stroke="${hairDark}" stroke-width="1.6"/>`;
    s += `<line x1="156" y1="54" x2="206" y2="46" stroke="#d4af37" stroke-width="3"/>`;
    s += `<circle cx="206" cy="46" r="4" fill="#d4af37" stroke="#8a6a10" stroke-width="1"/>`;
  } else if (hairStyle === 'towel') {
    s += `<path d="M116 124 Q120 76 180 74 Q240 76 244 124 Q234 100 180 98 Q126 100 116 124 Z" fill="${hair}" opacity="0.75"/>`;
    s += `<path d="M114 124 Q120 74 180 72 Q240 74 246 124 Q246 134 240 142 Q232 116 180 114 Q128 116 120 142 Q114 134 114 124 Z" fill="#4a6a8a"/>`;
    s += `<path d="M114 124 Q110 138 116 152" stroke="#4a6a8a" stroke-width="5" fill="none"/>`;
    s += `<path d="M246 124 Q250 138 244 152" stroke="#4a6a8a" stroke-width="5" fill="none"/>`;
  }
  return s;
}

/* ----- 面部 ----- */
function buildFaceSVG(look, expr) {
  const arr = [];
  const dark = '#3a2a1a';
  const { skinShade, hair, blush, redFace, sweat, wrinkles, beard } = look;

  if (blush) {
    arr.push(`<ellipse cx="138" cy="172" rx="14" ry="8" fill="#e88a8a" opacity="0.42"/>`);
    arr.push(`<ellipse cx="222" cy="172" rx="14" ry="8" fill="#e88a8a" opacity="0.42"/>`);
  }
  if (redFace) {
    arr.push(`<ellipse cx="138" cy="172" rx="20" ry="13" fill="#e06060" opacity="0.48"/>`);
    arr.push(`<ellipse cx="222" cy="172" rx="20" ry="13" fill="#e06060" opacity="0.48"/>`);
    arr.push(`<ellipse cx="180" cy="158" rx="42" ry="12" fill="#e06060" opacity="0.2"/>`);
  }

  if (expr.eyebrow === 'worried') {
    arr.push(`<path d="M138 124 Q152 116 166 124" stroke="${dark}" stroke-width="3.6" fill="none" stroke-linecap="round"/>`);
    arr.push(`<path d="M194 124 Q208 116 222 124" stroke="${dark}" stroke-width="3.6" fill="none" stroke-linecap="round"/>`);
  } else if (expr.eyebrow === 'angry') {
    arr.push(`<path d="M138 126 L168 118" stroke="${dark}" stroke-width="4" fill="none" stroke-linecap="round"/>`);
    arr.push(`<path d="M192 118 L222 126" stroke="${dark}" stroke-width="4" fill="none" stroke-linecap="round"/>`);
  } else if (expr.eyebrow === 'sad') {
    arr.push(`<path d="M138 120 Q152 126 166 128" stroke="${dark}" stroke-width="3.2" fill="none" stroke-linecap="round"/>`);
    arr.push(`<path d="M194 128 Q208 126 222 120" stroke="${dark}" stroke-width="3.2" fill="none" stroke-linecap="round"/>`);
  } else {
    arr.push(`<path d="M138 124 Q152 120 166 124" stroke="${dark}" stroke-width="3.2" fill="none" stroke-linecap="round"/>`);
    arr.push(`<path d="M194 124 Q208 120 222 124" stroke="${dark}" stroke-width="3.2" fill="none" stroke-linecap="round"/>`);
  }

  if (expr.eye === 'closed') {
    arr.push(`<path d="M140 150 Q152 158 164 150" stroke="${dark}" stroke-width="3.4" fill="none" stroke-linecap="round"/>`);
    arr.push(`<path d="M196 150 Q208 158 220 150" stroke="${dark}" stroke-width="3.4" fill="none" stroke-linecap="round"/>`);
  } else if (expr.eye === 'wide') {
    arr.push(`<ellipse cx="152" cy="150" rx="12" ry="13" fill="#fff" stroke="${dark}" stroke-width="1.2"/>`);
    arr.push(`<ellipse cx="208" cy="150" rx="12" ry="13" fill="#fff" stroke="${dark}" stroke-width="1.2"/>`);
    arr.push(`<circle cx="152" cy="151" r="8" fill="${dark}"/>`);
    arr.push(`<circle cx="208" cy="151" r="8" fill="${dark}"/>`);
    arr.push(`<circle cx="149" cy="148" r="3" fill="#fff"/>`);
    arr.push(`<circle cx="205" cy="148" r="3" fill="#fff"/>`);
  } else if (expr.eye === 'squint') {
    arr.push(`<ellipse cx="152" cy="150" rx="11" ry="7" fill="#fff"/>`);
    arr.push(`<ellipse cx="208" cy="150" rx="11" ry="7" fill="#fff"/>`);
    arr.push(`<circle cx="152" cy="151" r="5.5" fill="${dark}"/>`);
    arr.push(`<circle cx="208" cy="151" r="5.5" fill="${dark}"/>`);
    arr.push(`<path d="M140 146 Q152 141 164 146" stroke="${dark}" stroke-width="2.8" fill="none" stroke-linecap="round"/>`);
    arr.push(`<path d="M196 146 Q208 141 220 146" stroke="${dark}" stroke-width="2.8" fill="none" stroke-linecap="round"/>`);
  } else if (expr.eye === 'tired') {
    arr.push(`<ellipse cx="152" cy="151" rx="10" ry="7" fill="#fff"/>`);
    arr.push(`<ellipse cx="208" cy="151" rx="10" ry="7" fill="#fff"/>`);
    arr.push(`<circle cx="152" cy="152" r="5" fill="${dark}"/>`);
    arr.push(`<circle cx="208" cy="152" r="5" fill="${dark}"/>`);

/* ----- 完整场景 ----- */
function buildSceneSVG({ isPulseStage, hotspots, actionClass }) {
  let s = `<svg viewBox="0 0 360 500" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">`;
  s += `
    <defs>
      <linearGradient id="wallGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#e8d0a0"/>
        <stop offset="50%" stop-color="#d4b880"/>
        <stop offset="100%" stop-color="#b89868"/>
      </linearGradient>
      <linearGradient id="tableGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#9a5a2a"/>
        <stop offset="40%" stop-color="#7a3e18"/>
        <stop offset="100%" stop-color="#3a1a08"/>
      </linearGradient>
      <linearGradient id="robeShade" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="rgba(0,0,0,0)"/>
        <stop offset="100%" stop-color="rgba(0,0,0,0.35)"/>
      </linearGradient>
      <radialGradient id="vignette" cx="0.5" cy="0.4" r="0.75">
        <stop offset="55%" stop-color="rgba(0,0,0,0)"/>
        <stop offset="100%" stop-color="rgba(0,0,0,0.45)"/>
      </radialGradient>
      <radialGradient id="lampGlow" cx="0.5" cy="0.15" r="0.5">
        <stop offset="0%" stop-color="rgba(255,230,160,0.35)"/>
        <stop offset="100%" stop-color="rgba(255,230,160,0)"/>
      </radialGradient>
    </defs>
  `;
  // 墙
  s += `<rect x="0" y="0" width="360" height="500" fill="url(#wallGrad)"/>`;
  // 灯晕
  s += `<rect x="0" y="0" width="360" height="500" fill="url(#lampGlow)"/>`;
  // 药柜
  s += buildCabinetSVG();
  // 匾额
  s += buildPlaqueSVG();
  // 艾草
  s += buildHangingHerbSVG();
  // 暗角
  s += `<rect x="0" y="0" width="360" height="500" fill="url(#vignette)"/>`;

  // 患者
  s += `<g class="patient-group ${actionClass || ''}">${buildPatientSVG(curPatient, isPulseStage)}</g>`;

  // 桌面器物（含桌）
  s += buildTableObjectsSVG();

  // 医生的手（切脉阶段）
  if (isPulseStage) s += buildDoctorHandSVG();

  // 热区
  if (hotspots && hotspots.length) {
    hotspots.forEach(h => {
      s += `
        <g class="hotspot" data-id="${h.id}" data-correct="${!!h.correct}">
          <circle class="hotspot-ring" cx="${h.cx}" cy="${h.cy}" r="${h.r}" fill="none" stroke="rgba(255,215,80,0.95)" stroke-width="3"/>
          <circle class="hotspot-ring" cx="${h.cx}" cy="${h.cy}" r="${h.r}" fill="rgba(255,215,80,0.15)" stroke="rgba(255,215,80,0.65)" stroke-width="1.5"/>
          <circle class="hotspot-dot" cx="${h.cx}" cy="${h.cy}" r="6" fill="rgba(255,215,80,0.95)" stroke="#a06000" stroke-width="1"/>
        </g>
      `;
    });
  }
  s += `</svg>`;
  return s;
}

      robe:'#8b5a3a', robeDark:'#5a3a1a',
      sweat:true, blush:false, redFace:true, wrinkles:false, beard:'short'
    },
    observe: {
      hint: '【望诊】观察病人的异常表现，点击关键部位',
      hotspots: [
        { id:'face',  cx:180, cy:160, r:50, correct:true },
        { id:'chest', cx:180, cy:280, r:44, msg:'胸部无特殊。' },
        { id:'belly', cx:180, cy:360, r:40, msg:'腹部无异常。' },
        { id:'legs',  cx:180, cy:420, r:30, msg:'双腿无异常。' }
      ],
      correctMsg: '你注意到他面红目赤，大汗淋漓，烦躁不安。'
    },
    inquiry: {
      symptoms: [
        '热！热得受不了，像火烧一样。',
        '汗出得像水一样，止都止不住。',
        '口渴得要命，特别想喝凉水。',
        '心里烦躁，坐立不安。'
      ],
      doneMsg: '（病人不停擦汗，扇风）'
    },
    pulse: { text: '脉洪大而数，来势汹涌，如波涛拍岸。' },
    diagnose: {
      options: ['阳明经证', '太阳中风', '少阳病'],
      answer: '阳明经证',
      formula: '白虎汤',
      desc: '清热生津，除烦止渴'
    }
  },
  {
    name: '孙氏',
    intro: '一位老人双手捂着肚子，面色萎黄地走进来……',
    pose: 'belly',
    expression: { eyebrow: 'sad', eye: 'tired', mouth: 'pain' },
    look: {
      skin:'#e8d0a0', skinShade:'#b8a070',
      hair:'#e8e8e0', hairDark:'#a8a8a0', hairStyle:'old-bun',
      robe:'#7a7a5a', robeDark:'#4a4a35',
      sweat:false, blush:false, redFace:false, wrinkles:true, beard:'long-white'
    },
    observe: {
      hint: '【望诊】观察病人异常姿态，点击异常部位',
      hotspots: [
        { id:'belly', cx:180, cy:330, r:46, correct:true },
        { id:'head',  cx:180, cy:146, r:44, msg:'面色萎黄，但非直接病位。' },
        { id:'chest', cx:180, cy:270, r:44, msg:'胸部无异常。' },
        { id:'legs',  cx:180, cy:420, r:30, msg:'双腿无异常。' }
      ],
      correctMsg: '你注意到他双手捂着肚子，面色萎黄无华。'
    },
    inquiry: {
      symptoms: [
        '肚子胀得难受，还老想吐。',
        '吃不下东西，一吃就胀。',
        '拉肚子，越拉越厉害。',
        '肚子时不时地疼，喜欢用手按着。'
      ],
      doneMsg: '（病人捂着肚子，面露痛苦）'
    },
    pulse: { text: '脉缓而弱，沉取无力。' },
    diagnose: {
      options: ['太阴病', '阳明经证', '少阳病'],
      answer: '太阴病',
      formula: '理中汤',
      desc: '温中散寒，健脾止泻'
    }
  }
];

/* ================================================================
 *  状态 & 逻辑（保持原有）
 * ================================================================ */
const ST = { INTRO:'intro', OBSERVE:'observe', INQUIRY:'inquiry', PULSE:'pulse', DIAGNOSE:'diagnose' };
let curIndex = 0;
let curPatient = null;
let state = ST.INTRO;
let wrongCount = 0;
let observeWrong = 0;
let symptomsShown = [];
let pulseShown = '';
let timers = [];

const $ = id => document.getElementById(id);
const sceneWrap    = $('sceneWrap');
const bubbleEl     = $('bubble');
const caseContent  = $('caseContent');
const actionArea   = $('actionArea');
const progressEl   = $('progress');
const coinTag      = $('coinTag');
const modalOverlay = $('modalOverlay');
const modalTitle   = $('modalTitle');
const modalText    = $('modalText');
const modalBtn     = $('modalBtn');

function clearTimers() { timers.forEach(t => clearTimeout(t)); timers = []; }
function later(fn, ms) { timers.push(setTimeout(fn, ms)); }
function shuffle(a) { return [...a].sort(() => Math.random() - 0.5); }

function showBubble(text, keep) {
  bubbleEl.textContent = text;
  bubbleEl.classList.add('show');
  if (!keep) later(() => bubbleEl.classList.remove('show'), 2200);
}
function hideBubble() { bubbleEl.classList.remove('show'); }

function updateCoin() { coinTag.textContent = `💰 ${Player.getCoins()}`; }
function updateProgress() { progressEl.textContent = `病人 ${curIndex + 1} / ${PATIENTS.length}`; }

function renderCase() {
  if (symptomsShown.length === 0 && !pulseShown) {
    caseContent.textContent = '尚未开始诊治'; return;
  }
  let html = '';
  if (symptomsShown.length) {
    html += '<div><b>症状：</b>' + symptomsShown.map(s => `<span class="sym">${s}</span>`).join('、') + '</div>';
  }
  if (pulseShown) {
    html += `<div><b>脉象：</b><span class="pulse">${pulseShown}</span></div>`;
  }
  caseContent.innerHTML = html;
}

function showModal(title, text, btnText, cb) {
  modalTitle.textContent = title;
  modalText.textContent = text;
  modalBtn.textContent = btnText;
  modalOverlay.classList.add('active');
  modalBtn.onclick = () => {
    modalOverlay.classList.remove('active');
    cb && cb();
  };
}

function renderScene(opts) {
  const svg = buildSceneSVG(opts);
  sceneWrap.innerHTML = svg;
  sceneWrap.querySelectorAll('.hotspot').forEach(el => {
    el.addEventListener('click', () => onHotspotClick(el));
  });
  if (opts.isPulseStage && opts.hotspots && opts.hotspots.length) {
    const el = sceneWrap.querySelector('.hotspot[data-id="pulse"]');
    if (el) el.addEventListener('click', onPulseClick);
  }
}

function setState(s) { state = s; render(); }

function render() {
  clearTimers();
  if (state === ST.INTRO)         renderIntro();
  else if (state === ST.OBSERVE)  renderObserve();
  else if (state === ST.INQUIRY)  renderInquiry();
  else if (state === ST.PULSE)    renderPulse();
  else if (state === ST.DIAGNOSE) renderDiagnose();
}

function renderIntro() {
  const actionClass = curPatient.pose === 'hug' ? 'shiver' : 'breathe';
  renderScene({ isPulseStage: false, hotspots: [], actionClass });
  actionArea.innerHTML = `<div class="action-tip">👀 ${curPatient.intro}</div>
    <button class="action-btn" id="btnObserve">开始望诊</button>`;
  $('btnObserve').onclick = () => { sfx.click(); setState(ST.OBSERVE); };
}

function renderObserve() {
  observeWrong = 0;
  const actionClass = curPatient.pose === 'hug' ? 'shiver' : 'breathe';
  renderScene({ isPulseStage: false, hotspots: curPatient.observe.hotspots, actionClass });
  actionArea.innerHTML = `<div class="action-tip">${curPatient.observe.hint}</div>`;
}

function onHotspotClick(el) {
  const isCorrect = el.dataset.correct === 'true';
  if (isCorrect) {
    sfx.correct();
    showBubble('✅ ' + curPatient.observe.correctMsg, true);
    const dot = el.querySelector('.hotspot-dot');
    if (dot) dot.setAttribute('fill', 'rgba(120,220,120,0.95)');
    const rings = el.querySelectorAll('.hotspot-ring');
    rings.forEach(r => { r.setAttribute('stroke', 'rgba(120,220,120,0.95)'); r.style.animation = 'none'; });
    later(() => setState(ST.INQUIRY), 1600);
    return;
  }
  sfx.wrong();
  observeWrong++;
  const h = curPatient.observe.hotspots.find(x => x.id === el.dataset.id);
  const baseMsg = h ? h.msg : '这里没有异常。';
  const rings = el.querySelectorAll('.hotspot-ring');
  rings.forEach(r => r.setAttribute('stroke', 'rgba(255,80,80,0.95)'));
  later(() => rings.forEach(r => r.setAttribute('stroke', 'rgba(255,215,80,0.95)')), 350);

  if (observeWrong >= 3) {
    sceneWrap.querySelectorAll('.hotspot').forEach(x => x.style.pointerEvents = 'none');
    showBubble('❌ ' + baseMsg, true);
    actionArea.innerHTML = `<div class="action-tip" style="color:#c62828;">❌ 望诊失误三次，病人对你失去信任……</div>`;
    later(() => {
      showModal('😵 望诊失败',
        `你连续三次没有找准病位，${curPatient.name} 摇头坐了回去。`,
        '重新接诊',
        () => {
          observeWrong = 0; symptomsShown = []; pulseShown = ''; wrongCount = 0;
          loadPatient(curIndex);
        });
    }, 800);
  } else {
    showBubble('❌ ' + baseMsg + `（${observeWrong}/3）`, true);
    actionArea.innerHTML = `<div class="action-tip">${curPatient.observe.hint}（错误 ${observeWrong}/3）</div>`;
    later(hideBubble, 1200);
  }
}

function renderInquiry() {
  hideBubble();
  renderScene({ isPulseStage: false, hotspots: [], actionClass: 'breathe' });
  actionArea.innerHTML = `<div class="action-tip">💬 病人正在诉说症状……</div>`;
  const syms = curPatient.inquiry.symptoms;
  syms.forEach((s, i) => {
    later(() => {
      showBubble('「' + s + '」', true);
      if (!symptomsShown.includes(s)) symptomsShown.push(s);
      renderCase();
      sfx.click();
      const g = sceneWrap.querySelector('.patient-group');
      if (g) { g.classList.remove('breathe'); g.classList.add('shiver'); later(() => { g.classList.remove('shiver'); g.classList.add('breathe'); }, 420); }
    }, 700 + i * 700);
  });
  later(() => {
    showBubble(curPatient.inquiry.doneMsg || '（病人沉默）', true);
    actionArea.innerHTML = `<div class="action-tip">问诊完毕，接下来请为病人切脉。</div>
      <button class="action-btn" id="btnPulse">切脉</button>`;
    $('btnPulse').onclick = () => { sfx.click(); setState(ST.PULSE); };
  }, 700 + syms.length * 700);
}

function renderPulse() {
  hideBubble();
  const pulseHotspot = [{ id:'pulse', cx:256, cy:382, r:28, correct:true }];
  renderScene({ isPulseStage: true, hotspots: pulseHotspot, actionClass: 'breathe' });
  actionArea.innerHTML = `<div class="action-tip">🩺 伸出右手，点击病人手腕为其把脉</div>`;
}

function onPulseClick() {
  sfx.correct();
  pulseShown = curPatient.pulse.text;
  renderCase();
  showBubble('脉象：' + pulseShown, true);
  const el = sceneWrap.querySelector('.hotspot[data-id="pulse"]');
  if (el) el.style.display = 'none';
  later(() => {
    actionArea.innerHTML = `<div class="action-tip">四诊已毕，请判断病人的方证。</div>
      <button class="action-btn" id="btnDiagnose">开始辨证</button>`;
    $('btnDiagnose').onclick = () => { sfx.click(); setState(ST.DIAGNOSE); };
  }, 1800);
}

function renderDiagnose() {
  hideBubble();
  renderScene({ isPulseStage: true, hotspots: [], actionClass: 'breathe' });
  const opts = shuffle(curPatient.diagnose.options);
  actionArea.innerHTML =
    `<div class="action-tip">🧠 根据四诊所得，判断病人属于哪一证（剩余机会 ${2 - wrongCount}）</div>` +
    opts.map(o => `<button class="option-btn" data-opt="${o}">${o}</button>`).join('');
  actionArea.querySelectorAll('.option-btn').forEach(btn => {
    btn.onclick = () => onDiagnoseClick(btn);
  });
}

function onDiagnoseClick(btn) {
  const picked = btn.dataset.opt;
  const correct = curPatient.diagnose.answer;

  if (picked === correct) {
    sfx.win();
    btn.classList.add('correct');
    actionArea.querySelectorAll('.option-btn').forEach(b => b.disabled = true);
    const reward = 10 + curIndex * 5;
    Player.addCoins(reward);
    updateCoin();
    later(() => {
      showModal('✅ 辨证正确',
        `${curPatient.name} 患的是「${correct}」，当用「${curPatient.diagnose.formula}」。\n` +
        `${curPatient.diagnose.desc}。\n\n💰 获得 ${reward} 铜币`,
        '继续',
        () => {
          curIndex++;
          if (curIndex >= PATIENTS.length) {
            showModal('🎉 今日行医完毕', `你已诊治完所有病人，共获得铜币 ${Player.getCoins()}。`, '返回主页', () => location.href = 'index.html');
          } else {
            loadPatient(curIndex);
          }
        });
    }, 900);
  } else {
    sfx.lose();
    wrongCount++;
    btn.classList.add('wrong');
    btn.disabled = true;
    if (wrongCount >= 2) {
      actionArea.innerHTML = `<div class="action-tip" style="color:#c62828;">❌ 两次辨证皆错，病人生气地离开了……</div>`;
      const g = sceneWrap.querySelector('.patient-group');
      if (g) g.style.opacity = '0.4';
      later(() => {
        showModal('😠 辨证失败',
          `${curPatient.name} 摇头离去了。你决定重新整理思路，请他再来一次。`,
          '重新接诊',
          () => {
            wrongCount = 0; observeWrong = 0; symptomsShown = []; pulseShown = '';
            loadPatient(curIndex);
          });
      }, 500);
    } else {
      actionArea.querySelector('.action-tip').textContent =
        `❌ 错了，「${picked}」不对。再想想（剩余机会 1）`;
      const g = sceneWrap.querySelector('.patient-group');
      if (g) { g.classList.remove('breathe'); g.classList.add('shiver'); later(() => { g.classList.remove('shiver'); g.classList.add('breathe'); }, 500); }
    }
  }
}

function loadPatient(index) {
  curPatient = PATIENTS[index];
  wrongCount = 0; observeWrong = 0;
  symptomsShown = []; pulseShown = '';
  updateProgress(); renderCase(); hideBubble();
  later(() => setState(ST.INTRO), 200);
}

updateCoin();
loadPatient(0);
$('btnHome').onclick = () => location.href = 'index.html';
</script>
</body>
