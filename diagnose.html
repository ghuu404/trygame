<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>行医</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box;
    font-family: "KaiTi", "STKaiti", "楷体", "Kaiti SC", serif; }
html, body { height: 100%; overflow: hidden; }
body {
    background: linear-gradient(180deg, #e8f5e9 0%, #dcedc8 50%, #c5e1a5 100%);
    display: flex; flex-direction: column;
    user-select: none; color: #3a2a1a;
}

#backBtn {
    position: absolute; top: 10px; left: 10px;
    width: 34px; height: 34px;
    border-radius: 50%;
    background: rgba(255,255,255,0.9);
    border: 2px solid #8b5e3c;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 18px; color: #3a2a1a;
    z-index: 20;
}

#topBar {
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 10px 12px 10px 54px;
    background: rgba(255,255,255,0.75);
    border-bottom: 2px solid #a5d6a7;
    flex-shrink: 0; position: relative;
}
#playerBox { display: flex; align-items: center; gap: 8px; }
#avatar {
    width: 44px; height: 44px;
    border-radius: 6px;
    border: 2px solid #558b2f;
    background: #f1f8e9;
    overflow: hidden; flex-shrink: 0;
}
#avatar img { width: 100%; height: 100%; object-fit: cover; }
#playerName { font-size: 14px; font-weight: bold; color: #33691e; }
#playerPower { font-size: 12px; color: #666; margin-top: 2px; }
#coinBox {
    display: flex; align-items: center; gap: 4px;
    font-size: 17px; font-weight: bold; color: #b85c00;
}
#coinGain {
    position: absolute; right: 20px; top: 40px;
    font-size: 14px; font-weight: bold; color: #558b2f;
    opacity: 0; transition: all 0.6s; pointer-events: none;
}
#coinGain.show { opacity: 1; transform: translateY(-20px); }

/* 病人区 */
#patientArea {
    flex: 1; position: relative;
    display: flex; flex-direction: column;
    align-items: center; justify-content: flex-start;
    padding: 8px 10px 4px; overflow: hidden;
}
#queueInfo {
    position: absolute; top: 10px; right: 14px;
    font-size: 13px; font-weight: bold;
    background: rgba(255,255,255,0.85);
    padding: 3px 10px;
    border-radius: 12px;
    border: 2px solid #a5d6a7;
    color: #558b2f;
}
#patientStage {
    position: relative;
    width: 130px; height: 150px;
    margin-top: 12px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
}
#patientFigure {
    position: absolute; inset: 0;
    transition: transform 0.55s ease, opacity 0.55s ease;
}
#patientFigure.enter { animation: walkIn 0.55s ease-out forwards; }
#patientFigure.exit { animation: walkOut 0.55s ease-in forwards; }
@keyframes walkIn {
    from { transform: translateX(180px); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
}
@keyframes walkOut {
    from { transform: translateX(0); opacity: 1; }
    to { transform: translateX(-180px); opacity: 0; }
}

.p-head {
    position: absolute; left: 50%; top: 0;
    transform: translateX(-50%);
    width: 46px; height: 46px; border-radius: 50%;
    background: #f5e6d3; border: 3px solid #3a2a1a;
    cursor: pointer; transition: all 0.2s;
    display: flex; align-items: center; justify-content: center;
}
.p-head.checked { background: #d4c4a8; cursor: default; }
.p-head .face { font-size: 20px; line-height: 1; }
.p-body {
    position: absolute; left: 50%; top: 48px;
    transform: translateX(-50%);
    width: 62px; height: 68px;
    border-radius: 30px 30px 16px 16px;
    background: #a0785a; border: 3px solid #3a2a1a;
    cursor: pointer; transition: all 0.2s;
}
.p-body.checked { background: #806040; cursor: default; }
.p-wrist {
    position: absolute; right: 2px; top: 76px;
    width: 26px; height: 26px; border-radius: 50%;
    background: #f5e6d3; border: 3px solid #3a2a1a;
    cursor: pointer; transition: all 0.2s;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: bold;
}
.p-wrist.checked { background: #d4c4a8; cursor: default; }
.p-legs {
    position: absolute; left: 50%; top: 116px;
    transform: translateX(-50%);
    width: 50px; height: 34px;
    border-radius: 0 0 22px 22px;
    background: #6b4a30; border: 3px solid #3a2a1a;
    cursor: pointer; transition: all 0.2s;
}
.p-legs.checked { background: #503620; cursor: default; }

/* 病人部位上的贴图 */
.p-head img, .p-body img, .p-wrist img, .p-legs img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: contain;
    pointer-events: none;
    border-radius: inherit;
}

.hint {
    position: absolute; background: #fff;
    border: 2px solid #558b2f; border-radius: 10px;
    padding: 3px 8px; font-size: 12px; font-weight: bold;
    color: #33691e; box-shadow: 0 3px 8px rgba(0,0,0,0.15);
    white-space: nowrap; animation: floatUp 0.4s ease-out; z-index: 5;
}
.hint.pulse-hint { right: -85px; top: 76px; }
.hint.head-hint { left: -70px; top: 6px; }
.hint.body-hint { left: -70px; top: 60px; }
.hint.limbs-hint { left: -60px; top: 118px; }
@keyframes floatUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
}

#symptomPanel {
    width: 90%; max-width: 380px;
    background: rgba(255,255,255,0.95);
    border: 2px solid #a5d6a7; border-radius: 12px;
    padding: 6px 12px; min-height: 42px; max-height: 80px;
    overflow-y: auto; font-size: 13px; line-height: 1.7;
    box-shadow: 0 3px 10px rgba(0,0,0,0.08); margin-top: 8px;
}
#symptomPanel .placeholder { color: #999; font-style: italic; font-size: 12px; }
#symptomPanel .sym-item {
    display: inline-block; background: #fff3e0;
    border: 1px solid #d4a574; border-radius: 6px;
    padding: 1px 8px; margin: 2px 3px 2px 0;
    font-weight: bold; color: #8b5e3c; font-size: 12px;
}

#bottomArea { flex-shrink: 0; }
#optionsBar {
    display: flex; gap: 8px; padding: 8px 12px;
    background: #fdf7ec;
    border-top: 2px solid #a5d6a7;
    border-bottom: 2px solid #d4c4a8;
}
.option-btn {
    flex: 1; padding: 11px 6px;
    background: #fff8e1;
    border: 3px solid #8b5e3c; border-radius: 10px;
    font-size: 17px; font-weight: bold; color: #3a2a1a;
    cursor: pointer; transition: all 0.15s;
    box-shadow: 0 3px 6px rgba(0,0,0,0.08);
    font-family: inherit;
}
.option-btn:active { transform: scale(0.96); background: #dcedc8; }
.option-btn.correct { background: #c8e6c9; border-color: #2e7d32; color: #2e7d32; }
.option-btn.wrong { background: #ffcdd2; border-color: #c62828; color: #c62828; }
.option-btn:disabled { cursor: default; opacity: 0.85; }

/* 桌面（加大） */
#tableArea {
    height: 110px;
    background: linear-gradient(180deg, #f5ede1 0%, #e8d9c2 55%, #d4b896 100%);
    display: flex; align-items: flex-end; justify-content: space-between;
    padding: 0 24px 8px; position: relative;
    box-shadow: inset 0 4px 10px rgba(0,0,0,0.08);
}
#tableArea::before {
    content: ''; position: absolute;
    top: 0; left: 0; right: 0; height: 4px;
    background: #8b5e3c;
}

/* 医生形象 */
.deco-doctor {
    width: 78px; height: 96px;
    position: relative;
    display: flex; align-items: flex-end; justify-content: center;
}
.deco-doctor img { width: 100%; height: 100%; object-fit: contain; }
.deco-doctor.fallback::before {
    content: ''; position: absolute;
    width: 40px; height: 40px; border-radius: 50%;
    background: #f5e6d3; border: 3px solid #3a2a1a;
    top: 0; left: 50%; transform: translateX(-50%);
}
.deco-doctor.fallback::after {
    content: ''; position: absolute;
    width: 62px; height: 50px;
    border-radius: 32px 32px 0 0;
    background: #d4a574; border: 3px solid #3a2a1a;
    bottom: 0; left: 50%; transform: translateX(-50%);
}

/* 葫芦（用 CSS 画） */
.deco-gourd {
    width: 60px; height: 94px;
    position: relative;
    display: flex; align-items: flex-end; justify-content: center;
}
.deco-gourd img { width: 100%; height: 100%; object-fit: contain; }
.deco-gourd .gourd-string {
    position: absolute;
    top: -2px; left: 50%;
    width: 3px; height: 18px;
    background: #5a3e2b;
    transform: translateX(-50%);
    border-radius: 2px;
}
.deco-gourd .gourd-top {
    position: absolute;
    top: 16px; left: 50%;
    transform: translateX(-50%);
    width: 30px; height: 30px;
    border-radius: 50%;
    background: #c9a56a;
    border: 3px solid #5a3e2b;
    box-shadow: inset -3px -3px 6px rgba(0,0,0,0.15);
}
.deco-gourd .gourd-bottom {
    position: absolute;
    bottom: 0; left: 50%;
    transform: translateX(-50%);
    width: 58px; height: 52px;
    border-radius: 50% 50% 46% 46%;
    background: #c9a56a;
    border: 3px solid #5a3e2b;
    box-shadow: inset -4px -4px 8px rgba(0,0,0,0.15);
}
.deco-gourd .gourd-cap {
    position: absolute;
    top: 10px; left: 50%;
    transform: translateX(-50%);
    width: 14px; height: 8px;
    border-radius: 4px;
    background: #8b5e3c;
    border: 2px solid #5a3e2b;
    z-index: 2;
}

#modalOverlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.6);
    display: none; align-items: center; justify-content: center;
    z-index: 999;
}
#modalOverlay.active { display: flex; }
.modal-box {
    background: #f5f0e8; border-radius: 18px;
    padding: 22px 26px; text-align: center;
    border: 3px solid #558b2f;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    max-width: 320px; width: 85%;
}
.modal-title { font-size: 20px; font-weight: bold; color: #33691e; margin-bottom: 12px; }
.modal-text { font-size: 15px; color: #555; margin-bottom: 16px; line-height: 1.6; }
.modal-btn {
    display: block; width: 100%; padding: 10px; margin: 6px 0;
    font-family: inherit; font-size: 15px; font-weight: bold;
    background: #aed581; color: #33691e;
    border: 2px solid #558b2f; border-radius: 10px;
    cursor: pointer;
}
.modal-btn:active { transform: scale(0.97); }
</style>
</head>
<body>

<div id="backBtn" onclick="location.href='index.html'">←</div>

<div id="topBar">
    <div id="playerBox">
        <div id="avatar"><img src="images/avatar.jpg" alt="头像" onerror="this.style.display='none'"></div>
        <div>
            <div id="playerName">赤脚医生</div>
            <div id="playerPower">医力 <span id="powerText">1.00</span>/100</div>
        </div>
    </div>
    <div id="coinBox">
        💰 <span id="coinText">0</span>
    </div>
</div>
<div id="coinGain"></div>

<div id="patientArea">
    <div id="queueInfo">👥 排队：<span id="queueCount">3</span></div>
    <div id="patientStage"></div>
    <div id="symptomPanel">
        <span class="placeholder">点击病人的头、身、手腕、足部来查看症状...</span>
    </div>
</div>

<div id="bottomArea">
    <div id="optionsBar">
        <button class="option-btn" data-idx="0">—</button>
        <button class="option-btn" data-idx="1">—</button>
        <button class="option-btn" data-idx="2">—</button>
    </div>
    <div id="tableArea">
        <div class="deco-doctor">
            <img src="images/doctor.png" alt="" onerror="this.parentNode.classList.add('fallback');this.remove();">
        </div>
        <div class="deco-gourd">
            <img src="images/gourd.png" alt="" onerror="this.classList.add('gourd-img-fail');this.style.display='none';">
            <div class="gourd-string"></div>
            <div class="gourd-cap"></div>
            <div class="gourd-top"></div>
            <div class="gourd-bottom"></div>
        </div>
    </div>
</div>

<div id="modalOverlay">
    <div class="modal-box" id="modalBox"></div>
</div>

<script>
(function() {
    'use strict';

    var FORMULAS = [
        { name: '桂枝汤', s: { head: ['头痛'], body: ['发热','汗出','恶风'], pulse: ['脉浮缓'], limbs: [] } },
        { name: '麻黄汤', s: { head: ['头痛'], body: ['发热','无汗','恶风'], pulse: ['脉浮紧'], limbs: ['身疼','腰痛','骨节疼痛'] } },
        { name: '葛根汤', s: { head: ['项背强几几'], body: ['发热','无汗','恶风'], pulse: ['脉浮'], limbs: [] } },
        { name: '小青龙汤', s: { head: [], body: ['发热','恶寒','心下有水气','咳'], pulse: [], limbs: ['干呕'] } },
        { name: '大青龙汤', s: { head: ['烦躁'], body: ['发热','恶寒','身疼痛','不汗出'], pulse: [], limbs: [] } },
        { name: '小柴胡汤', s: { head: ['心烦'], body: ['往来寒热','胸胁苦满','不欲饮食'], pulse: ['脉弦'], limbs: ['喜呕'] } },
        { name: '大柴胡汤', s: { head: [], body: ['往来寒热','心下痞硬','呕吐','下利'], pulse: ['脉弦'], limbs: [] } },
        { name: '白虎汤', s: { head: [], body: ['身大热','汗大出','口大渴'], pulse: ['脉洪大'], limbs: [] } },
        { name: '大承气汤', s: { head: ['潮热'], body: ['腹满痛','大便不通'], pulse: [], limbs: ['手足汗出'] } },
        { name: '小承气汤', s: { head: ['微烦'], body: ['腹大满','大便硬'], pulse: [], limbs: [] } },
        { name: '调胃承气汤', s: { head: [], body: ['蒸蒸发热','腹胀满'], pulse: [], limbs: [] } },
        { name: '理中汤', s: { head: [], body: ['腹满','吐利','不欲食','时腹自痛'], pulse: [], limbs: [] } },
        { name: '四逆汤', s: { head: [], body: ['下利清谷'], pulse: ['脉微欲绝'], limbs: ['四肢厥逆'] } },
        { name: '真武汤', s: { head: ['头眩'], body: ['心下悸','身瞤动','小便不利'], pulse: [], limbs: [] } },
        { name: '五苓散', s: { head: [], body: ['渴欲饮水','水入则吐','小便不利'], pulse: [], limbs: [] } },
        { name: '半夏泻心汤', s: { head: [], body: ['心下痞满','呕而肠鸣','下利'], pulse: [], limbs: [] } },
        { name: '栀子豉汤', s: { head: ['虚烦不得眠','心中懊憹'], body: [], pulse: [], limbs: [] } },
        { name: '茵陈蒿汤', s: { head: [], body: ['身黄如橘子色','小便不利','腹微满'], pulse: [], limbs: [] } },
        { name: '当归四逆汤', s: { head: [], body: [], pulse: ['脉细欲绝'], limbs: ['手足厥寒'] } },
        { name: '小建中汤', s: { head: ['心中悸而烦'], body: ['腹中急痛'], pulse: [], limbs: [] } }
    ];

    var INITIAL_POWER = 1;
    var POWER_PER_CORRECT = 0.01;
    var POWER_UP_PER = 100;

    function getCorrectCount() {
        var v = localStorage.getItem('diagnoseCorrect');
        return v ? parseInt(v) : 0;
    }
    function addCorrectCount() {
        var n = getCorrectCount() + 1;
        localStorage.setItem('diagnoseCorrect', String(n));
        return n;
    }
    function getPower() { return INITIAL_POWER + getCorrectCount() * POWER_PER_CORRECT; }
    function getDiagnoseFee() {
        var p = Math.floor(getPower());
        return 1 + (p - 1) * 2;
    }
    function getCoins() {
        var v = localStorage.getItem('coins');
        return v ? parseInt(v) : 0;
    }
    function addCoins(n) {
        var t = getCoins() + n;
        localStorage.setItem('coins', String(t));
    }

    var patientStage = document.getElementById('patientStage');
    var symptomPanel = document.getElementById('symptomPanel');
    var queueCountEl = document.getElementById('queueCount');
    var optionBtns = document.querySelectorAll('.option-btn');
    var powerText = document.getElementById('powerText');
    var coinText = document.getElementById('coinText');
    var coinGain = document.getElementById('coinGain');
    var modalOverlay = document.getElementById('modalOverlay');
    var modalBox = document.getElementById('modalBox');

    var state = null;
    var queueCount = 3;
    var waiting = false;

    function renderTop() {
        powerText.textContent = getPower().toFixed(2);
        coinText.textContent = getCoins();
    }
    renderTop();

    function createPatientFigure() {
        var fig = document.createElement('div');
        fig.id = 'patientFigure';
        fig.innerHTML =
            '<div class="p-head" data-part="head">' +
                '<span class="face">😣</span>' +
                '<img src="images/patient-head.png" alt="" onerror="this.remove()">' +
            '</div>' +
            '<div class="p-body" data-part="body">' +
                '<img src="images/patient-body.png" alt="" onerror="this.remove()">' +
            '</div>' +
            '<div class="p-wrist" data-part="pulse">' +
                '<span class="pulse-label">脉</span>' +
                '<img src="images/patient-pulse.png" alt="" onerror="this.remove()">' +
            '</div>' +
            '<div class="p-legs" data-part="limbs">' +
                '<img src="images/patient-legs.png" alt="" onerror="this.remove()">' +
            '</div>';
        return fig;
    }

    function spawnPatient() {
        patientStage.innerHTML = '';

        var idx = Math.floor(Math.random() * FORMULAS.length);
        var formula = FORMULAS[idx];

        var pool = [];
        for (var i = 0; i < FORMULAS.length; i++) {
            if (i !== idx) pool.push(FORMULAS[i].name);
        }
        for (var j = pool.length - 1; j > 0; j--) {
            var k = Math.floor(Math.random() * (j + 1));
            var t1 = pool[j]; pool[j] = pool[k]; pool[k] = t1;
        }
        var options = [formula.name, pool[0], pool[1]];
        for (var m = options.length - 1; m > 0; m--) {
            var n = Math.floor(Math.random() * (m + 1));
            var t2 = options[m]; options[m] = options[n]; options[n] = t2;
        }

        state = {
            formula: formula,
            checked: { head: false, body: false, pulse: false, limbs: false },
            attempts: 0
        };

        symptomPanel.innerHTML = '<span class="placeholder">点击病人的头、身、手腕、足部来查看症状...</span>';

        for (var p = 0; p < optionBtns.length; p++) {
            optionBtns[p].textContent = options[p];
            optionBtns[p].disabled = false;
            optionBtns[p].className = 'option-btn';
        }

        var fig = createPatientFigure();
        patientStage.appendChild(fig);
        fig.classList.add('enter');
        waiting = false;

        // 图片加载后隐藏简笔画
        fig.querySelectorAll('[data-part] img').forEach(function(img) {
            img.addEventListener('load', function() {
                var face = img.parentNode.querySelector('.face, .pulse-label');
                if (face) face.style.display = 'none';
            });
        });
    }

    patientStage.addEventListener('click', function(e) {
        if (!state) return;
        var el = e.target;
        while (el && el !== patientStage) {
            if (el.getAttribute && el.getAttribute('data-part')) break;
            el = el.parentNode;
        }
        if (!el || el === patientStage) return;

        var part = el.getAttribute('data-part');
        if (state.checked[part]) return;
        state.checked[part] = true;
        el.classList.add('checked');

        var symptoms = state.formula.s[part] || [];

        var oldHints = patientStage.querySelectorAll('.hint');
        for (var i = 0; i < oldHints.length; i++) {
            if (oldHints[i].getAttribute('data-part') === part) oldHints[i].remove();
        }
        var hint = document.createElement('div');
        hint.className = 'hint ' + part + '-hint';
        hint.setAttribute('data-part', part);
        if (symptoms.length === 0) {
            hint.textContent = '（无异常）';
            hint.style.color = '#999';
            hint.style.borderColor = '#ccc';
        } else {
            hint.textContent = symptoms.join('、');
        }
        patientStage.appendChild(hint);

        if (symptoms.length > 0) {
            var ph = symptomPanel.querySelector('.placeholder');
            if (ph) symptomPanel.innerHTML = '';
            for (var j = 0; j < symptoms.length; j++) {
                var span = document.createElement('span');
                span.className = 'sym-item';
                span.textContent = symptoms[j];
                symptomPanel.appendChild(span);
            }
        }
    });

    function showModal(title, html, btnText, callback) {
        modalBox.innerHTML =
            '<div class="modal-title">' + title + '</div>' +
            '<div class="modal-text">' + html + '</div>' +
            '<button class="modal-btn" id="modalActionBtn">' + btnText + '</button>';
        modalOverlay.classList.add('active');
        document.getElementById('modalActionBtn').onclick = callback;
    }
    function closeModal() { modalOverlay.classList.remove('active'); }

    function showCoinGain(n) {
        coinGain.textContent = '+' + n;
        coinGain.classList.remove('show');
        void coinGain.offsetWidth;
        coinGain.classList.add('show');
        setTimeout(function() { coinGain.classList.remove('show'); }, 1200);
    }

    function patientLeave(callback) {
        var fig = document.getElementById('patientFigure');
        if (!fig) { callback(); return; }
        fig.classList.remove('enter');
        fig.classList.add('exit');
        setTimeout(callback, 550);
    }

    function nextPatient() {
        queueCount = Math.max(0, queueCount - 1);
        queueCount += 1;
        queueCountEl.textContent = queueCount;
        patientLeave(function() { spawnPatient(); });
    }

    for (var b = 0; b < optionBtns.length; b++) {
        (function(btn) {
            btn.addEventListener('click', function() {
                if (btn.disabled) return;
                if (!state) return;
                if (waiting) return;
                if (state.attempts >= 2) return;

                var chosen = btn.textContent;
                var correct = state.formula.name;

                if (chosen === correct) {
                    btn.classList.add('correct');
                    for (var i = 0; i < optionBtns.length; i++) optionBtns[i].disabled = true;

                    var fee = getDiagnoseFee();
                    addCoins(fee);
                    var newCount = addCorrectCount();
                    renderTop();
                    showCoinGain(fee);
                    waiting = true;

                    if (newCount % POWER_UP_PER === 0) {
                        var newPowerInt = Math.floor(getPower());
                        setTimeout(function() {
                            showModal('🎉 恭喜！',
                                '您的医力提升至 ' + newPowerInt + '/100<br>诊费已提升至 ' + getDiagnoseFee() + ' 铜币',
                                '继续行医',
                                function() { closeModal(); nextPatient(); });
                        }, 700);
                    } else {
                        setTimeout(function() { nextPatient(); }, 900);
                    }
                } else {
                    state.attempts++;
                    btn.classList.add('wrong');
                    btn.disabled = true;

                    if (state.attempts >= 2) {
                        for (var j = 0; j < optionBtns.length; j++) {
                            optionBtns[j].disabled = true;
                            if (optionBtns[j].textContent === correct) optionBtns[j].classList.add('correct');
                        }
                        waiting = true;
                        setTimeout(function() {
                            showModal('病人生气了！',
                                '两次都诊断错误，病人生气离开。<br>正确方证是：<b>' + correct + '</b>',
                                '下一位病人',
                                function() { closeModal(); nextPatient(); });
                        }, 700);
                    } else {
                        showModal('诊断有误',
                            '您还有 <b>1 次</b> 机会，请再仔细看症状，选择正确的方证。',
                            '再试一次',
                            function() { closeModal(); });
                    }
                }
            });
        })(optionBtns[b]);
    }

    queueCountEl.textContent = queueCount;
    spawnPatient();
})();
</script>
</body>
</html>
