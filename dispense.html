<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>抓药 · 重生之我是赤脚医生</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box;
        font-family: "KaiTi", "STKaiti", "楷体", "Kaiti SC", serif; }
    html, body { height: 100%; overflow: hidden; }
    body {
        display: flex; flex-direction: column;
        user-select: none; -webkit-tap-highlight-color: transparent;
        background: #dcedc8 url('images/main-bg.jpg') no-repeat center center;
        background-size: cover;
    }

    /* ===== 顶栏 ===== */
    #topBar {
        flex: 0 0 auto;
        display: flex; align-items: center; justify-content: space-between;
        gap: 8px; padding: 8px 12px;
        background: rgba(51, 105, 30, 0.92);
        box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }
    .top-btn {
        width: 34px; height: 34px; flex-shrink: 0;
        display: flex; align-items: center; justify-content: center;
        border-radius: 50%; background: rgba(255,255,255,0.18);
        color: #fff; font-size: 20px; font-weight: bold;
        text-decoration: none; transition: transform 0.15s;
    }
    .top-btn:active { transform: scale(0.9); }
    .top-title { font-size: 17px; font-weight: bold; color: #fff; letter-spacing: 2px; }
    .top-right { display: flex; gap: 6px; }
    .resource {
        font-size: 13px; font-weight: bold;
        background: rgba(255,255,255,0.9); color: #33691e;
        padding: 3px 10px; border-radius: 12px;
        white-space: nowrap;
    }

    /* ===== 病人区 ===== */
    #stage { flex: 0 0 auto; padding: 10px 12px; }
    #patientBox {
        display: flex; align-items: center; gap: 10px;
        background: rgba(255,255,255,0.9);
        border: 3px solid #558b2f; border-radius: 16px;
        padding: 8px 12px;
        box-shadow: 0 3px 10px rgba(0,0,0,0.12);
        transition: opacity 0.25s;
    }
    #patientBox.gone { opacity: 0; }
    #patientEmoji {
        font-size: 46px; line-height: 1; flex-shrink: 0;
        animation: bob 2.2s ease-in-out infinite;
    }
    @keyframes bob {
        0%, 100% { transform: translateY(0); }
        50%      { transform: translateY(-5px); }
    }
    #patientBox.happy #patientEmoji { animation: happyPop 0.5s ease; }
    @keyframes happyPop {
        0%   { transform: scale(1); }
        50%  { transform: scale(1.45) rotate(-10deg); }
        100% { transform: scale(1); }
    }
    #patientBox.angry #patientEmoji { animation: angryShake 0.4s ease 2; }
    @keyframes angryShake {
        0%, 100% { transform: translateX(0); }
        25%      { transform: translateX(-6px) rotate(-6deg); }
        75%      { transform: translateX(6px) rotate(6deg); }
    }
    #bubble { flex: 1; min-width: 0; }
    .bubble-head { font-size: 12px; font-weight: bold; color: #33691e; margin-bottom: 5px; }
    #prescriptionList { display: flex; flex-wrap: wrap; gap: 5px; }
    .rx-chip {
        background: #f1f8e9; border: 1.5px solid #aed581;
        border-radius: 10px; padding: 2px 9px;
        font-size: 13px; font-weight: bold; color: #33691e;
        transition: all 0.15s;
    }
    .rx-chip.done {
        background: #aed581; border-color: #558b2f;
        color: #fff; text-decoration: line-through;
    }
    .bubble-foot { margin-top: 6px; font-size: 12px; font-weight: bold; color: #b85c00; }

    /* ===== 药柜 ===== */
    #cabinetWrap {
        flex: 1 1 auto; overflow-y: auto; -webkit-overflow-scrolling: touch;
        padding: 8px 12px 12px;
        background: rgba(255,255,255,0.78);
        border-top: 3px solid #558b2f;
    }
    #cabinet {
        display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px;
    }
    .herb-cell {
        background: #fff; border: 2px solid #c5e1a5; border-radius: 10px;
        padding: 8px 3px; text-align: center; cursor: pointer;
        display: flex; flex-direction: column; gap: 2px;
        transition: transform 0.12s, background 0.12s;
    }
    .herb-cell:active { transform: scale(0.92); background: #dcedc8; }
    .herb-cell .hname { font-size: 14px; font-weight: bold; color: #33691e; }
    .herb-cell .hcount { font-size: 10px; color: #999; }
    .herb-cell.empty { opacity: 0.3; pointer-events: none; }
    .herb-cell.hint-pulse {
        animation: hintPulse 0.5s ease-in-out 4;
        border-color: #ff9800; box-shadow: 0 0 12px #ffb74d;
    }
    @keyframes hintPulse {
        0%, 100% { transform: scale(1); }
        50%      { transform: scale(1.12); }
    }
    .cabinet-empty {
        grid-column: 1 / -1; text-align: center;
        color: #999; font-size: 13px; padding: 28px 0;
    }

    /* ===== 药盘 ===== */
    #trayWrap {
        flex: 0 0 auto; min-height: 66px;
        padding: 6px 12px 8px;
        background: rgba(51,105,30,0.12);
        border-top: 3px solid #558b2f;
    }
    #trayTitle { font-size: 11px; font-weight: bold; color: #558b2f; margin-bottom: 4px; }
    #tray { display: flex; flex-wrap: wrap; gap: 5px; }
    .tray-chip {
        background: #fff; border: 2px solid #558b2f; border-radius: 14px;
        padding: 3px 10px; font-size: 13px; font-weight: bold; color: #33691e;
        cursor: pointer; animation: popIn 0.18s ease-out;
    }
    .tray-chip:active { transform: scale(0.9); background: #ffcdd2; }
    @keyframes popIn {
        from { transform: scale(0.5); opacity: 0; }
        to   { transform: scale(1);   opacity: 1; }
    }
    #trayEmpty { font-size: 12px; color: #999; padding: 6px 0; }

    /* ===== 底部按钮 ===== */
    #actionRow {
        flex: 0 0 auto;
        display: flex; gap: 8px; padding: 8px 12px 14px;
        background: rgba(51,105,30,0.92);
    }
    .act-btn {
        flex: 1; padding: 11px 4px;
        font-family: inherit; font-size: 15px; font-weight: bold;
        border-radius: 12px; border: 2px solid #aed581;
        background: #f1f8e9; color: #33691e;
        cursor: pointer; transition: transform 0.12s, background 0.12s;
    }
    .act-btn:active { transform: scale(0.95); }
    .act-btn.primary { background: #aed581; border-color: #33691e; color: #1b5e20; }
    .act-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ===== 飘字提示 ===== */
    .toast {
        position: fixed; left: 50%; top: 38%;
        transform: translate(-50%, -50%) scale(0.85);
        background: rgba(20, 40, 10, 0.86);
        color: #fff; font-size: 14px; font-weight: bold;
        padding: 10px 22px; border-radius: 20px;
        z-index: 9999; opacity: 0; pointer-events: none;
        transition: all 0.2s ease-out; white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }

    /* 金币飘字 */
    .coin-float {
        position: fixed; font-size: 20px; font-weight: bold;
        color: #ffb300; text-shadow: 0 0 6px #fff, 0 2px 4px rgba(0,0,0,0.4);
        pointer-events: none; z-index: 9999;
        animation: coinUp 0.9s ease-out forwards;
    }
    @keyframes coinUp {
        0%   { opacity: 0; transform: translateY(0) scale(0.6); }
        25%  { opacity: 1; transform: translateY(-14px) scale(1.2); }
        100% { opacity: 0; transform: translateY(-56px) scale(1); }
    }
</style>
</head>
<body>

<!-- 顶栏 -->
<header id="topBar">
    <a class="top-btn" href="index.html">←</a>
    <div class="top-title">抓 药</div>
    <div class="top-right">
        <span class="resource">💰 <span id="coinText">0</span></span>
        <span class="resource">💡 <span id="hintText">3</span></span>
    </div>
</header>

<!-- 病人 -->
<main id="stage">
    <div id="patientBox">
        <div id="patientEmoji">🧑</div>
        <div id="bubble">
            <div class="bubble-head">📋 <span id="patientName">病人</span> 的药方</div>
            <div id="prescriptionList"></div>
            <div class="bubble-foot">诊金：💰 <span id="rewardText">0</span></div>
        </div>
    </div>
</main>

<!-- 药柜 -->
<section id="cabinetWrap">
    <div id="cabinet"></div>
</section>

<!-- 药盘 -->
<section id="trayWrap">
    <div id="trayTitle">药盘（点击已抓的药可退回）</div>
    <div id="tray"></div>
</section>

<!-- 操作 -->
<footer id="actionRow">
    <button class="act-btn" id="btnClear">清空</button>
    <button class="act-btn" id="btnHint">💡 提示 <span id="hintCount">3</span></button>
    <button class="act-btn primary" id="btnSubmit">抓 药</button>
</footer>

<script>
/* =========================================================
   常量
========================================================= */
const MAX_HINTS   = 3;
const WAREHOUSE_KEY = 'warehouse';

const PATIENT_EMOJIS = ['🧑','👨','👩','🧓','👴','👵','🧒','👦','👧','🧔'];
const PATIENT_NAMES  = ['王大爷','李大婶','张大叔','刘奶奶','陈小哥','赵姑娘','孙婆婆','周先生'];

// 仓库为空时的演示药材（方便调试，正常游戏中不会用到）
const DEMO_HERBS = ['桂枝','芍药','甘草','生姜','大枣','麻黄','杏仁','柴胡','黄芩','半夏','茯苓','白术'];

/* =========================================================
   与 index.html 共用的仓库 / 铜币
========================================================= */
function getWarehouse() {
    try {
        return JSON.parse(localStorage.getItem(WAREHOUSE_KEY)) ||
            { herbs: {}, seeds: {}, materials: {}, processed: {} };
    } catch (e) {
        return { herbs: {}, seeds: {}, materials: {}, processed: {} };
    }
}
function saveWarehouse(w) {
    localStorage.setItem(WAREHOUSE_KEY, JSON.stringify(w));
}
function getCoins() { return parseInt(localStorage.getItem('coins') || 0); }
function addCoins(n) {
    const t = getCoins() + n;
    localStorage.setItem('coins', t);
    return t;
}

/* =========================================================
   游戏状态
========================================================= */
const state = {
    cabinet: {},          // 药柜 { 药材名: 数量 }
    tray: [],             // 药盘 [药材名, ...]
    patient: null,        // { name, emoji, herbs:[], reward }
    hintsLeft: MAX_HINTS, // 剩余提示次数
    busy: false,          // 动画中锁定操作
    usingDemo: false,     // 是否使用演示药材
};

/* =========================================================
   仓库 ↔ 药柜
=============
