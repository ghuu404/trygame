<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>抓药 - 重生之我是赤脚医生</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; }
body {
    font-family: "KaiTi", "STKaiti", "楷体", "Kaiti SC", serif;
    user-select: none;
    background: #f5f0e8;
    display: flex;
    flex-direction: column;
}
/* ===== 顶部栏 ===== */
#topBar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px 10px;
    background: #33691e;
    color: #fff;
    font-size: 13px; font-weight: bold;
    flex-shrink: 0; gap: 6px;
}
.top-btn {
    background: #aed581; border: 2px solid #fff;
    border-radius: 14px; padding: 4px 10px;
    font-size: 12px; font-weight: bold;
    color: #33691e; cursor: pointer; text-decoration: none;
    white-space: nowrap;
}
.top-btn:active { transform: scale(0.95); }
#coinDisplay {
    display: flex; align-items: center; gap: 3px;
    background: rgba(255,255,255,0.9);
    padding: 4px 12px; border-radius: 14px;
    color: #33691e; font-weight: bold;
}
/* ===== 主体 ===== */
#main {
    flex: 1; display: flex;
    padding: 6px; gap: 6px;
    overflow: hidden;
}
/* 左侧处方单 */
#orderPanel {
    flex: 0 0 30%;
    background: #fff9e6;
    border: 3px solid #b89a72;
    border-radius: 14px;
    padding: 8px;
    display: flex; flex-direction: column;
    overflow: hidden;
}
#orderNav {
    display: flex; gap: 4px; margin-bottom: 8px;
}
#orderNav button {
    flex: 1;
    padding: 5px 0;
    font-size: 12px; font-weight: bold;
    border: 2px solid #8b5e3c;
    border-radius: 10px;
    background: #fff3d6;
    color: #5a3e2b;
    cursor: pointer;
    font-family: inherit;
}
#orderNav button:active { transform: scale(0.95); }
#orderTitle {
    font-size: 17px; font-weight: bold; color: #33691e;
    text-align: center; margin-bottom: 8px;
    border-bottom: 2px dashed #b89a72; padding-bottom: 6px;
}
#orderList {
    flex: 1; overflow-y: auto;
}
.order-item {
    display: flex; justify-content: space-between;
    font-size: 13px; color: #5a3e2b;
    padding: 5px 6px; border-bottom: 1px dotted #ddd;
}
.order-item.done { color: #2e7d32; font-weight: bold; }
.order-item .cnt { color: #c62828; }
/* 中间药盘 */
#platePanel {
    flex: 1;
    background: #f0e6d8;
    border: 3px solid #b89a72;
    border-radius: 14px;
    padding: 8px;
    display: flex; flex-direction: column;
    align-items: center;
}
#plateTitle {
    font-size: 14px; font-weight: bold; color: #5a3e2b;
    margin-bottom: 6px; text-align: center;
}
#plateGrid {
    flex: 1; width: 100%;
    display: flex; flex-wrap: wrap;
    align-content: flex-start; gap: 6px;
    overflow-y: auto; padding: 4px;
    background: #e8d5c0;
    border-radius: 10px;
    border: 2px dashed #8b5e3c;
}
.plate-herb {
    width: 60px; height: 68px;
    background: #fff; border: 2px solid #8b5e3c;
    border-radius: 8px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    cursor: pointer; font-size: 9px;
    font-weight: bold; color: #3a2a1a;
    position: relative;
    padding: 2px;
    transition: transform 0.15s;
}
.plate-herb:active { transform: scale(0.92); }
.plate-herb img {
    width: 34px; height: 34px;
    object-fit: contain;
}
.plate-herb .pemoji { font-size: 22px; }
.plate-herb .pcount {
    position: absolute; top: 2px; right: 4px;
    font-size: 10px; color: #c62828;
    background: rgba(255,255,255,0.85);
    border-radius: 6px; padding: 0 4px;
}
.plate-herb .pname {
    font-size: 8px; line-height: 1;
    text-align: center;
    max-width: 54px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
#btnPack {
    margin-top: 8px;
    padding: 8px 24px;
    font-size: 14px; font-weight: bold;
    background: #aed581; border: 2px solid #33691e;
    border-radius: 20px; color: #33691e;
    cursor: pointer;
    font-family: inherit;
}
#btnPack:active { transform: scale(0.95); }
#btnPack:disabled { opacity: 0.5; cursor: not-allowed; }
/* 右侧库存 */
#stockPanel {
    flex: 0 0 30%;
    background: #fff;
    border: 3px solid #b89a72;
    border-radius: 14px;
    padding: 8px;
    display: flex; flex-direction: column;
    overflow: hidden;
}
#stockTitle {
    font-size: 13px; font-weight: bold; color: #33691e;
    text-align: center; margin-bottom: 6px;
}
#stockList {
    flex: 1; overflow-y: auto;
}
.stock-item {
    display: flex; align-items: center;
    gap: 4px; padding: 4px 4px;
    border-bottom: 1px solid #eee;
    cursor: pointer; border-radius: 8px;
    transition: background 0.15s;
}
.stock-item:hover { background: #f1f8e9; }
.stock-item img {
    width: 32px; height: 32px;
    object-fit: contain;
}
.stock-item .semoji { font-size: 22px; }
.stock-item .sinfo { flex: 1; min-width: 0; }
.stock-item .sname {
    font-size: 11px; font-weight: bold; color: #3a2a1a;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.stock-item .scount { font-size: 10px; color: #777; }
.stock-item.out { opacity: 0.4; cursor: not-allowed; }

/* ===== 药包弹窗 ===== */
#bagModal {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.7);
    display: none; align-items: center; justify-content: center;
    z-index: 1000;
}
#bagModal.active { display: flex; }
.bag-box {
    background: #f5f0e8; border-radius: 20px;
    padding: 20px; text-align: center;
    width: 80%; max-width: 320px;
    border: 3px solid #558b2f;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}
.bag-box img { width: 160px; height: 160px; object-fit: contain; }
.bag-emoji { font-size: 100px; }
.bag-name { font-size: 22px; font-weight: bold; color: #33691e; margin: 10px 0; }
.bag-herbs { font-size: 12px; color: #666; margin-bottom: 14px; line-height: 1.6; }
.modal-btn {
    display: block; width: 100%; font-size: 16px; font-weight: bold;
    padding: 10px; margin: 6px 0; border: 2px solid #558b2f;
    border-radius: 12px; background: #aed581; color: #33691e;
    cursor: pointer; font-family: inherit;
}
</style>
</head>
<body>

<div id="topBar">
    <div style="display:flex;gap:6px;">
        <a class="top-btn" href="index.html">← 返回</a>
        <a class="top-btn" href="process.html">⚗️ 去炮制</a>
    </div>
    <div style="font-size:14px;">📋 抓药台</div>
    <div id="coinDisplay">
        <img src="images/icon-coin.webp" style="width:16px;height:16px;" onerror="this.style.display='none'">
        <span id="coinText">0</span>
    </div>
</div>

<div id="main">
    <!-- 左：处方单 -->
    <div id="orderPanel">
        <div id="orderNav">
            <button id="btnPrevOrder">◀ 上一张</button>
            <button id="btnNextOrder">下一张 ▶</button>
        </div>
        <div id="orderTitle">处方</div>
        <div id="orderList"></div>
    </div>

    <!-- 中：药盘 -->
    <div id="platePanel">
        <div id="plateTitle">🫙 药盘（点击可移除）</div>
        <div id="plateGrid"></div>
        <button id="btnPack">打包药包</button>
    </div>

    <!-- 右：库存 -->
    <div id="stockPanel">
        <div id="stockTitle">📦 库存（点击加药）</div>
        <div id="stockList"></div>
    </div>
</div>

<!-- 药包弹窗 -->
<div id="bagModal">
    <div class="bag-box">
        <img id="bagImg" src="images/medicine-bag.png"
             onerror="this.style.display='none';this.nextElementSibling.style.display='block';">
        <div class="bag-emoji" style="display:none;">🎁</div>
        <div class="bag-name" id="bagName">麻黄汤</div>
        <div class="bag-herbs" id="bagHerbs"></div>
        <button class="modal-btn" id="bagConfirm">交给病人</button>
    </div>
</div>

<script>
/* ============================================================
   抓药模块
   ============================================================ */

// 处方数据（每味药 + 剂量）
const PRESCRIPTIONS = [
    { name: '麻黄汤', herbs: [
        { name: '麻黄(去节)', amount: 3 },
        { name: '桂枝(去皮)', amount: 2 },

    ]},
    { name: '桂枝汤', herbs: [
        { name: '桂枝(去皮)', amount: 3 },
        { name: '芍药(切片)', amount: 3 },
        { name: '甘草(蜜炙)', amount: 2 },
        { name: '生姜(切片)', amount: 3 },
        { name: '大枣(擘)', amount: 3 }
    ]},
    { name: '葛根汤', herbs: [
        { name: '葛根(切片)', amount: 3 },
        { name: '麻黄(去节)', amount: 3 },
        { name: '桂枝(去皮)', amount: 2 },
        { name: '芍药(切片)', amount: 2 },
        { name: '甘草(蜜炙)', amount: 2 },
        { name: '生姜(切片)', amount: 3 },
        { name: '大枣(擘)', amount: 3 }
    ]},
    { name: '小青龙汤', herbs: [
        { name: '麻黄(去节)', amount: 3 },
        { name: '芍药(切片)', amount: 3 },
        { name: '细辛', amount: 3 },
        { name: '干姜(切片)', amount: 3 },
        { name: '甘草(蜜炙)', amount: 3 },
        { name: '桂枝(去皮)', amount: 3 },
        { name: '五味子', amount: 3 },
        { name: '汤洗半夏', amount: 3 }
    ]},
    { name: '大青龙汤', herbs: [
        { name: '麻黄(去节)', amount: 4 },
        { name: '桂枝(去皮)', amount: 2 },
        { name: '甘草(蜜炙)', amount: 2 },
        { name: '杏仁(去皮尖)', amount: 3 },
        { name: '生姜(切片)', amount: 3 },
        { name: '大枣(擘)', amount: 3 },
        { name: '碎石膏', amount: 3 }
    ]},
    { name: '小柴胡汤', herbs: [
        { name: '柴胡', amount: 4 },
        { name: '黄芩', amount: 3 },
        { name: '人参', amount: 3 },
        { name: '汤洗半夏', amount: 3 },
        { name: '甘草(蜜炙)', amount: 3 },
        { name: '生姜(切片)', amount: 3 },
        { name: '大枣(擘)', amount: 3 }
    ]},
    { name: '大柴胡汤', herbs: [
        { name: '柴胡', amount: 4 },
        { name: '黄芩', amount: 3 },
        { name: '芍药(切片)', amount: 3 },
        { name: '汤洗半夏', amount: 3 },
        { name: '生姜(切片)', amount: 3 },
        { name: '炒枳实', amount: 3 },
        { name: '大枣(擘)', amount: 3 },
        { name: '酒洗大黄', amount: 2 }
    ]},
    { name: '白虎汤', herbs: [
        { name: '知母(去毛)', amount: 3 },
        { name: '碎石膏', amount: 4 },
        { name: '甘草(蜜炙)', amount: 1 },
        { name: '粳米', amount: 3 }
    ]},
    { name: '小承气汤', herbs: [
        { name: '酒洗大黄', amount: 3 },
        { name: '炒枳实', amount: 3 },
        { name: '姜炙厚朴', amount: 2 }
    ]},
    { name: '大承气汤', herbs: [
        { name: '酒洗大黄', amount: 3 },
        { name: '姜炙厚朴', amount: 3 },
        { name: '炒枳实', amount: 3 },
        { name: '芒硝', amount: 2 }
    ]},
    { name: '调味承气汤', herbs: [
        { name: '酒洗大黄', amount: 3 },
        { name: '芒硝', amount: 2 },
        { name: '甘草(蜜炙)', amount: 2 }
    ]},
    { name: '理中汤', herbs: [
        { name: '人参', amount: 3 },
        { name: '干姜(切片)', amount: 3 },
        { name: '甘草(蜜炙)', amount: 3 },
        { name: '炒白术', amount: 3 }
    ]},
    { name: '四逆汤', herbs: [
        { name: '炮附子', amount: 1 },
        { name: '干姜(切片)', amount: 2 },
        { name: '甘草(蜜炙)', amount: 2 }
    ]},
    { name: '真武汤', herbs: [
        { name: '茯苓', amount: 3 },
        { name: '芍药(切片)', amount: 3 },
        { name: '生姜(切片)', amount: 3 },
        { name: '炒白术', amount: 2 },
        { name: '炮附子', amount: 1 }
    ]},
    { name: '五苓散', herbs: [
        { name: '猪苓(去皮)', amount: 2 },
        { name: '盐炙泽泻', amount: 3 },
        { name: '炒白术', amount: 2 },
        { name: '茯苓', amount: 2 },
        { name: '桂枝(去皮)', amount: 2 }
    ]},
    { name: '半夏泻心汤', herbs: [
        { name: '汤洗半夏', amount: 3 },
        { name: '黄芩', amount: 3 },
        { name: '干姜(切片)', amount: 3 },
        { name: '人参', amount: 3 },
        { name: '甘草(蜜炙)', amount: 3 },
        { name: '黄连', amount: 1 },
        { name: '大枣(擘)', amount: 3 }
    ]},
    { name: '栀子豉汤', herbs: [
        { name: '栀子(擘)', amount: 2 },
        { name: '淡豆豉', amount: 3 }
    ]},
    { name: '茵陈蒿汤', herbs: [
        { name: '茵陈', amount: 3 },
        { name: '栀子(擘)', amount: 2 },
        { name: '酒洗大黄', amount: 2 }
    ]},
    { name: '当归四逆汤', herbs: [
        { name: '酒洗当归', amount: 3 },
        { name: '桂枝(去皮)', amount: 3 },
        { name: '芍药(切片)', amount: 3 },
        { name: '细辛', amount: 3 },
        { name: '甘草(蜜炙)', amount: 2 },
        { name: '通草', amount: 2 },
        { name: '大枣(擘)', amount: 3 }
    ]},
    { name: '小建中汤', herbs: [
        { name: '桂枝(去皮)', amount: 3 },
        { name: '芍药(切片)', amount: 3 },
        { name: '甘草(蜜炙)', amount: 2 },
        { name: '生姜(切片)', amount: 3 },
        { name: '大枣(擘)', amount: 3 },
        { name: '饴糖', amount: 2 }
    ]}
];

/* ===== 读取炮制仓库（与 process.html 共用 warehouse.processed）===== */
function getProcessedInventory() {
    try {
        const w = JSON.parse(localStorage.getItem('warehouse') || '{}');
        return w.processed || {};
    } catch(e) { return {}; }
}
function saveProcessedInventory(inv) {
    let w = {};
    try { w = JSON.parse(localStorage.getItem('warehouse') || '{}'); } catch(e) {}
    if (!w.processed) w.processed = {};
    w.processed = inv;
    localStorage.setItem('warehouse', JSON.stringify(w));
}

/* ===== 铜币（与主页面一致，读 coins）===== */
function getCoins() { return parseInt(localStorage.getItem('coins') || 0); }
function addCoins(n) {
    const t = getCoins() + n;
    localStorage.setItem('coins', String(t));
    document.getElementById('coinText').textContent = t;
    return t;
}

/* ===== 状态 ===== */
let processedInventory = getProcessedInventory();
let plate = {};
let currentOrderIndex = parseInt(localStorage.getItem('currentPrescriptionIndex'));
if (isNaN(currentOrderIndex) || currentOrderIndex < 0 || currentOrderIndex >= PRESCRIPTIONS.length) {
    currentOrderIndex = 0;
}
let currentOrder = null;

/* ===== 渲染 ===== */
function renderAll() {
    renderOrder();
    renderPlate();
    renderStock();
    checkReady();
}
function renderOrder() {
    currentOrder = JSON.parse(JSON.stringify(PRESCRIPTIONS[currentOrderIndex]));
    document.getElementById('orderTitle').textContent = '📜 ' + currentOrder.name;
    const list = document.getElementById('orderList');
    list.innerHTML = '';
    currentOrder.herbs.forEach(h => {
        const got = plate[h.name] || 0;
        const div = document.createElement('div');
        div.className = 'order-item' + (got === h.amount ? ' done' : '');
        div.innerHTML = `<span>${h.name}</span><span class="cnt">${got} / ${h.amount} 两</span>`;
        list.appendChild(div);
    });
}
function renderPlate() {
    const grid = document.getElementById('plateGrid');
    grid.innerHTML = '';
    let has = false;
    for (let [name, count] of Object.entries(plate)) {
        if (count <= 0) continue;
        has = true;
        const div = document.createElement('div');
        div.className = 'plate-herb';
        div.innerHTML = `
            <img src="images/herbs/processed/${name}.png"
                 onerror="this.style.display='none';this.nextElementSibling.style.display='block';">
            <span class="pemoji" style="display:none;">🌿</span>
            <span class="pname">${name}</span>
            <span class="pcount">×${count}</span>
        `;
        div.addEventListener('click', () => removeFromPlate(name));
        grid.appendChild(div);
    }
    if (!has) {
        grid.innerHTML = '<div style="width:100%;text-align:center;color:#b89a72;font-size:12px;padding:20px;">点击右侧库存加药</div>';
    }
}
function renderStock() {
    const list = document.getElementById('stockList');
    list.innerHTML = '';
    const keys = Object.keys(processedInventory).filter(k => processedInventory[k] > 0);
    if (keys.length === 0) {
        list.innerHTML = '<div style="text-align:center;color:#999;padding:20px;font-size:12px;">库存为空<br>去炮制药材吧</div>';
        return;
    }
    keys.sort();
    keys.forEach(name => {
        const count = processedInventory[name];
        const div = document.createElement('div');
        div.className = 'stock-item';
        div.innerHTML = `
            <img src="images/herbs/processed/${name}.png"
                 onerror="this.style.display='none';this.nextElementSibling.style.display='block';">
            <span class="semoji" style="display:none;">🌿</span>
            <div class="sinfo">
                <div class="sname">${name}</div>
                <div class="scount">剩余 ${count} 份</div>
            </div>
        `;
        div.addEventListener('click', () => addToPlate(name));
        list.appendChild(div);
    });
}
function addToPlate(name) {
    if (!currentOrder) return;
    const need = currentOrder.herbs.find(h => h.name === name);
    if (!need) { return; } // 不是处方里的药，忽略
    const current = plate[name] || 0;
    if (current >= need.amount) { return; } // 已够量
    if ((processedInventory[name] || 0) <= 0) { return; }
    processedInventory[name] -= 1;
    plate[name] = current + 1;
    saveProcessedInventory(processedInventory);
    renderAll();
}
function removeFromPlate(name) {
    if ((plate[name] || 0) <= 0) return;
    plate[name] -= 1;
    processedInventory[name] = (processedInventory[name] || 0) + 1;
    if (plate[name] === 0) delete plate[name];
    saveProcessedInventory(processedInventory);
    renderAll();
}
function checkReady() {
    if (!currentOrder) return;
    let ok = true;
    for (let h of currentOrder.herbs) {
        if ((plate[h.name] || 0) !== h.amount) { ok = false; break; }
    }
    document.getElementById('btnPack').disabled = !ok;
}

/* ===== 按钮事件 ===== */
document.getElementById('btnPrevOrder').addEventListener('click', () => {
    currentOrderIndex = (currentOrderIndex - 1 + PRESCRIPTIONS.length) % PRESCRIPTIONS.length;
    localStorage.setItem('currentPrescriptionIndex', currentOrderIndex);
    plate = {};
    renderAll();
});
document.getElementById('btnNextOrder').addEventListener('click', () => {
    currentOrderIndex = (currentOrderIndex + 1) % PRESCRIPTIONS.length;
    localStorage.setItem('currentPrescriptionIndex', currentOrderIndex);
    plate = {};
    renderAll();
});

document.getElementById('btnPack').addEventListener('click', () => {
    if (!currentOrder) return;
    for (let h of currentOrder.herbs) {
        if ((plate[h.name] || 0) !== h.amount) return;
    }
    const bag = {
        id: 'bag_' + Date.now(),
        name: currentOrder.name,
        herbs: currentOrder.herbs.map(h => `${h.name} ×${h.amount}两`),
        createdAt: Date.now()
    };
    const bags = JSON.parse(localStorage.getItem('medicineBags') || '[]');
    bags.push(bag);
    localStorage.setItem('medicineBags', JSON.stringify(bags));

    addCoins(50);

    document.getElementById('bagName').textContent = bag.name;
    document.getElementById('bagHerbs').innerHTML = bag.herbs.join('<br>') + '<br><br>💰 +50';
    document.getElementById('bagModal').classList.add('active');
});

document.getElementById('bagConfirm').addEventListener('click', () => {
    document.getElementById('bagModal').classList.remove('active');
    plate = {};
    renderAll();
});

/* ===== 初始化 ===== */
document.getElementById('coinText').textContent = getCoins();
renderAll();
</script>
</body>
</html>
