<title>抓药 - 百草奇遇记</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: "KaiTi", "STKaiti", "楷体", "Kaiti SC", serif;
    user-select: none;
    overflow: hidden;
    height: 100vh;

#topBar {
    display: flex; align-items: center; justify-content: space-between;

.top-btn {
    background: #aed581; border: 2px solid #fff;
    border-radius: 14px; padding: 3px 10px;
    font-size: 12px; font-weight: bold;
    color: #33691e; cursor: pointer; text-decoration: none;
    white-space: nowrap;
}
.top-btn:active { transform: scale(0.95); }
#main {
    flex: 1; display: flex; padding: 6px; gap: 6px; overflow: hidden;
}
#orderPanel {
    flex: 0 0 30%;
    background: #fff9e6;
    border: 3px solid #b89a72;
    border-radius: 14px;
    padding: 8px;
    display: flex; flex-direction: column;
    overflow: hidden;
}
#orderNav {
    display: flex; gap: 4px; margin-bottom: 8px;
}
#orderNav button {
    flex: 1;
    padding: 5px 0;
    font-size: 12px; font-weight: bold;
    border: 2px solid #8b5e3c;
    border-radius: 10px;
    background: #fff3d6;
    color: #5a3e2b;
    cursor: pointer;
    font-family: inherit;
}
#orderNav button:active { transform: scale(0.95); }
#orderTitle {
    font-size: 17px; font-weight: bold; color: #33691e;
    text-align: center; margin-bottom: 8px;
    border-bottom: 2px dashed #b89a72; padding-bottom: 6px;
}
#orderList { flex: 1; overflow-y: auto; }
.order-item {
    display: flex; justify-content: space-between;
    font-size: 13px; color: #5a3e2b;
    padding: 5px 6px; border-bottom: 1px dotted #ddd;
}
.order-item.done { color: #2e7d32; font-weight: bold; }
.order-item .cnt { color: #c62828; }
#platePanel {
    flex: 1;
    background: #f0e6d8;
    border: 3px solid #b89a72;
    border-radius: 14px;
    padding: 8px;
    display: flex; flex-direction: column;
    align-items: center;
}
#plateTitle {
    font-size: 14px; font-weight: bold; color: #5a3e2b;
    margin-bottom: 6px;
}
#plateGrid {
    flex: 1; width: 100%;
    display: flex; flex-wrap: wrap;
    align-content: flex-start; gap: 6px;
    overflow-y: auto; padding: 4px;
    background: #e8d5c0;
    border-radius: 10px;
    border: 2px dashed #8b5e3c;
}
.plate-herb {
    width: 60px; height: 68px;
    background: #fff; border: 2px solid #8b5e3c;
    border-radius: 8px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    cursor: pointer; font-size: 9px;
    font-weight: bold; color: #3a2a1a;
    position: relative;
    transition: transform 0.15s;
    padding: 2px;
}
.plate-herb:active { transform: scale(0.92); }
.plate-herb img {
    width: 34px; height: 34px;
    object-fit: contain;
}
.plate-herb .pcount {
    position: absolute; top: 2px; right: 4px;
    font-size: 10px; color: #c62828;
    background: rgba(255,255,255,0.85);
    border-radius: 6px; padding: 0 4px;
}
.plate-herb .pname {
    font-size: 8px; line-height: 1;
    text-align: center;
    max-width: 54px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
#btnPack {
    margin-top: 8px;
    padding: 8px 24px;
    font-size: 14px; font-weight: bold;
    background: #aed581; border: 2px solid #33691e;
    border-radius: 20px; color: #33691e;
    cursor: pointer;
    font-family: inherit;
}
#btnPack:active { transform: scale(0.95); }
#btnPack:disabled { opacity: 0.5; cursor: not-allowed; }
#stockPanel {
    flex: 0 0 30%;
    background: #fff;
    border: 3px solid #b89a72;
    border-radius: 14px;
    padding: 8px;
    display: flex; flex-direction: column;
    overflow: hidden;

#stockTitle {
    font-size: 13px; font-weight: bold; color: #33691e;
    text-align: center; margin-bottom: 6px;
}
#stockList { flex: 1; overflow-y: auto; }
.stock-item {
    display: flex; align-items: center;

.stock-item:hover { background: #f1f8e9; }

.stock-item .sinfo { flex: 1; min-width: 0; }
.stock-item .sname {

.stock-item .scount { font-size: 10px; color: #777; }
.stock-item.out { opacity: 0.4; cursor: not-allowed; }

#bagModal {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.7);
    display: none; align-items: center; justify-content: center;
    z-index: 1000;

.bag-box {

/* ===== 统一仓库 ===== */
var WAREHOUSE_KEY = 'warehouse';
function getWarehouse() {
    try {
        return JSON.parse(localStorage.getItem(WAREHOUSE_KEY)) ||
            { herbs: {}, seeds: {}, materials: {}, processed: {} };
    } catch(e) {
        return { herbs: {}, seeds: {}, materials: {}, processed: {} };
    }
}
function saveWarehouse(w) {
    localStorage.setItem(WAREHOUSE_KEY, JSON.stringify(w));
}
var warehouse = getWarehouse();
var processedInventory = warehouse.processed;
function saveProcessed() {
    warehouse.processed = processedInventory;
    saveWarehouse(warehouse);
}
function getCoins() { return parseInt(localStorage.getItem('coins') || 0, 10) || 0; }
function setCoins(n) { localStorage.setItem('coins', String(n)); }
function updateCoinDisplay() {
    document.getElementById('coinDisplay').textContent = '💰 ' + getCoins();
}
updateCoinDisplay();

/* ===== 药盘持久化 =====
   由于处方 key 结构变更过，用版本号清理旧数据。 */
var PLATES_KEY = 'dispensePlates';
var PLATES_VERSION_KEY = 'dispensePlatesVersion';
var PLATES_VERSION = 2;
(function migratePlatesIfNeeded() {
    var v = parseInt(localStorage.getItem(PLATES_VERSION_KEY) || 0, 10);
    if (v !== PLATES_VERSION) {
        localStorage.removeItem(PLATES_KEY);
        localStorage.setItem(PLATES_VERSION_KEY, String(PLATES_VERSION));
    }
})();
function getPlates() {
    try {
        return JSON.parse(localStorage.getItem(PLATES_KEY)) || {};
    } catch(e) { return {}; }
}
function savePlates(p) {
    localStorage.setItem(PLATES_KEY, JSON.stringify(p));
}

/* ===== 当前状态 ===== */
var currentOrderIndex = parseInt(localStorage.getItem('currentPrescriptionIndex') || 0, 10);
if (isNaN(currentOrderIndex) || currentOrderIndex < 0 || currentOrderIndex >= PRESCRIPTIONS.length) {
    currentOrderIndex = 0;
}
var currentOrder = null;
var plate = {};
var allPlates = getPlates();

/* ===== 处方切换 ===== */
function loadOrder(index) {
    allPlates[currentOrderIndex] = plate;
    savePlates(allPlates);

    currentOrderIndex = index;
    localStorage.setItem('currentPrescriptionIndex', String(currentOrderIndex));
    currentOrder = JSON.parse(JSON.stringify(PRESCRIPTIONS[index]));
    plate = allPlates[currentOrderIndex] || {};
    renderAll();
}
function prevOrder() {
    var idx = currentOrderIndex - 1;
    if (idx < 0) idx = PRESCRIPTIONS.length - 1;
    loadOrder(idx);
}
function nextOrder() {
    var idx = currentOrderIndex + 1;
    if (idx >= PRESCRIPTIONS.length) idx = 0;
    loadOrder(idx);
}

/* ===== 渲染 ===== */
function renderAll() {
    renderOrder();
    renderPlate();
    renderStock();
    checkReady();
}

/* 左侧处方：只显示纯药材名 */
function renderOrder() {
    document.getElementById('orderTitle').textContent = '📜 ' + currentOrder.name;
    var list = document.getElementById('orderList');
    list.innerHTML = '';
    currentOrder.herbs.forEach(function(h) {
        var got = plate[h.name] || 0;
        var div = document.createElement('div');
        div.className = 'order-item' + (got === h.amount ? ' done' : '');
        div.innerHTML =
            '<span>' + plainName(h.name) + '</span>' +
            '<span class="cnt">' + got + ' / ' + h.amount + ' 两</span>';
        list.appendChild(div);
    });
}

/* 药盘：显示饮片名 + images/processed 图 */
function renderPlate() {
    var grid = document.getElementById('plateGrid');
    grid.innerHTML = '';
    Object.keys(plate).forEach(function(name) {
        var count = plate[name];
        if (count <= 0) return;
        var div = document.createElement('div');
        div.className = 'plate-herb';
        div.innerHTML =
            '<img src="' + processedImg(name) + '" ' +
                'onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'block\';">' +
            '<span style="display:none;font-size:20px;">🌿</span>' +
            '<span class="pname">' + name + '</span>' +
            '<span class="pcount">×' + count + '</span>';
        div.title = '点击退回库存';
        div.addEventListener('click', function() { removeFromPlate(name); });
        grid.appendChild(div);
    });
}

/* 右栏库存：显示饮片名 + images/processed 图 */
function renderStock() {
    var list = document.getElementById('stockList');
    list.innerHTML = '';
    var keys = Object.keys(processedInventory).filter(function(k) {
        return processedInventory[k] > 0;
    });
    if (keys.length === 0) {
        list.innerHTML = '<div style="text-align:center;color:#999;padding:20px;">库存为空，去炮制药材吧</div>';
        return;
    }
    keys.sort();
    keys.forEach(function(name) {
        var count = processedInventory[name];
        var div = document.createElement('div');
        div.className = 'stock-item';
        div.innerHTML =
            '<img src="' + processedImg(name) + '" ' +
                'onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'block\';">' +
            '<span style="display:none;font-size:20px;">🌿</span>' +
            '<div class="sinfo">' +
                '<div class="sname">' + name + '</div>' +
                '<div class="scount">剩余 ' + count + ' 份</div>' +
            '</div>';
        div.addEventListener('click', function() { addToPlate(name); });
        list.appendChild(div);
    });
}

/* ===== 药盘操作 ===== */
function addToPlate(name) {
    if (!currentOrder) return;
    var need = null;
    for (var i = 0; i < currentOrder.herbs.length; i++) {
        if (currentOrder.herbs[i].name === name) { need = currentOrder.herbs[i]; break; }
    }
    if (!need) return;                                     // 处方里不需要这味
    var current = plate[name] || 0;
    if (current >= need.amount) return;                    // 已经够了
    if ((processedInventory[name] || 0) <= 0) return;      // 库存不足

    processedInventory[name] -= 1;
    plate[name] = current + 1;
    saveProcessed();
    savePlate();
    renderAll();
}

function removeFromPlate(name) {
    if ((plate[name] || 0) <= 0) return;
    plate[name] -= 1;
    processedInventory[name] = (processedInventory[name] || 0) + 1;
    if (plate[name] === 0) delete plate[name];
    saveProcessed();
    savePlate();
    renderAll();
}

function savePlate() {
    allPlates[currentOrderIndex] = plate;
    Object.keys(allPlates).forEach(function(k) {
        if (!allPlates[k] || Object.keys(allPlates[k]).length === 0) {
            delete allPlates[k];
        }
    });
    savePlates(allPlates);
}

function checkReady() {
    if (!currentOrder) return;
    var ok = true;
    for (var i = 0; i < currentOrder.herbs.length; i++) {
        var h = currentOrder.herbs[i];
        if ((plate[h.name] || 0) !== h.amount) { ok = false; break; }
    }
    document.getElementById('btnPack').disabled = !ok;
}

/* ===== 打包 ===== */
document.getElementById('btnPack').addEventListener('click', function() {
    if (!currentOrder) return;
    for (var i = 0; i < currentOrder.herbs.length; i++) {
        var h = currentOrder.herbs[i];
        if ((plate[h.name] || 0) !== h.amount) return;
    }
    var bag = {
        id: 'bag_' + Date.now(),
        name: currentOrder.name,
        herbs: currentOrder.herbs.map(function(h) {
            return plainName(h.name) + ' ×' + h.amount + '两';
        }),
        createdAt: Date.now()
    };
    var bags = JSON.parse(localStorage.getItem('medicineBags') || '[]');
    bags.push(bag);
    localStorage.setItem('medicineBags', JSON.stringify(bags));

    setCoins(getCoins() + 50);
    updateCoinDisplay();

    showBag(bag);
});

function showBag(bag) {
    document.getElementById('bagName').textContent = bag.name;
    document.getElementById('bagHerbs').innerHTML =
        bag.herbs.join('<br>') + '<br><br>💰 +50';
    document.getElementById('bagModal').classList.add('active');
}

document.getElementById('bagConfirm').addEventListener('click', function() {
    document.getElementById('bagModal').classList.remove('active');
    plate = {};
    savePlate();
    renderAll();
});

/* ===== 初始化 ===== */
document.getElementById('btnPrevOrder').addEventListener('click', prevOrder);
document.getElementById('btnNextOrder').addEventListener('click', nextOrder);

currentOrder = JSON.parse(JSON.stringify(PRESCRIPTIONS[currentOrderIndex]));
plate = allPlates[currentOrderIndex] || {};
renderAll();
</script>
</body>
</html>
