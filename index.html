<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>百草奇遇记</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>

<!-- ==================== 主页面 ==================== -->
<div id="page-main" class="page active">

  <div id="mainTopBar">
    <div id="mainLeftPanel">
      <div id="mainPlayerRow">
        <div id="mainAvatar"><img class="auto-hide" src="images/avatar.webp" alt="头像"></div>
        <div id="mainPlayerDetails">
          <div id="mainPlayerName">小药童</div>
          <div id="mainPlayerPower">医力 <span id="mainPowerText">1</span></div>
        </div>
      </div>
      <div id="mainSubButtons">
        <div class="sub-btn" id="btnSign">
          <img class="auto-hide" src="images/btn-sign.webp" alt="签到">
          <span class="text">签到</span>
        </div>
        <div class="sub-btn" id="btnMedBook">
          <img class="auto-hide" src="images/btn-medbook.webp" alt="医书">
          <span class="text">医书</span>
        </div>
        <div class="sub-btn" id="btnHerbBook">
          <img class="auto-hide" src="images/btn-herbbook.webp" alt="药书">
          <span class="text">药书</span>
        </div>
        <div class="sub-btn" id="btnShop">
          <img class="auto-hide" src="images/btn-shop.webp" alt="商店">
          <span class="text">商店</span>
        </div>
      </div>
    </div>
       <div id="mainRightPanel">
      <div class="resource"><img class="auto-hide coin-icon" src="images/icon-coin.webp"> <span id="mainCoinText">0</span></div>
      <div class="resource">⚡ <span id="mainStaminaText">5/5</span></div>
      <div class="right-btn" id="btnWarehouse" style="display:flex;align-items:center;">
  <img class="auto-hide" src="images/btn-warehouse.webp" style="width:16px;height:16px;margin-right:4px;">
  仓库
</div>
    </div>
  </div>
  <div class="spot" id="spot-collect" data-module="collect">
    <img class="auto-hide" src="images/spot-collect.webp" alt="采药">
    <div class="label">采药</div>
  </div>
  <div class="spot" id="spot-plant" data-module="plant">
    <img class="auto-hide" src="images/spot-plant.webp" alt="种植">
    <div class="label">种植</div>
  </div>
  <div class="spot" id="spot-process" data-module="process">
    <img class="auto-hide" src="images/spot-process.webp" alt="炮制">
    <div class="label">炮制</div>
  </div>
  <div class="spot" id="spot-dispense" data-module="dispense">
    <img class="auto-hide" src="images/spot-dispense.webp" alt="抓药">
    <div class="label">抓药</div>
  </div>
  <div class="spot" id="spot-diagnose" data-module="diagnose">
    <img class="auto-hide" src="images/spot-diagnose.webp" alt="行医">
    <div class="label">行医</div>
  </div>
  <div id="mainDisclaimer">本游戏内容仅供科普参考，不作为医疗建议。用药请遵医嘱。</div>

  <div class="modal-overlay" id="mainModalOverlay">
    <div class="modal-box" id="mainModalContent"></div>
  </div>
</div>

<!-- ==================== 行医页面 ==================== -->
<div id="page-diagnose" class="page">

  <div id="diagTopBar">
  <div id="diagLeftCol">
    <div id="diagPlayerBox">
      <div id="diagAvatar"><img class="auto-hide" src="images/avatar.webp" alt="头像"></div>
      <div id="diagPlayerText">
        <div id="diagPlayerName">赤脚医生</div>
        <div id="diagPlayerStatus">行医中...</div>
        <div id="diagPlayerPower">医力 <span id="diagPowerText">1</span></div>
      </div>
    </div>
    <div class="diag-back-left" id="btnDiagBack">← 返回</div>
  </div>
  <div id="diagRightArea">
    <div id="diagCoinBox">
  <img class="auto-hide coin-icon" src="images/icon-coin.webp"> <span id="diagCoinText">0</span>
</div>
  </div>
</div>

  <div id="diagCoinGain"></div>
  <div id="diagQueueInfo">👥 排队：<span id="diagQueueCount">0</span></div>

  <!-- 病人队列区（队列系统锚点） -->
  <div id="diagPatientArea">
    <div id="diagQueueStage"></div>
  </div>

  <!-- 底部固定医生人像，不超出症状框（z-index 由 CSS 控制） -->
  <img id="diagDoctorFigure" class="auto-hide" src="images/doctor-figure.webp" alt="">

  <div id="diagNoPatient">
    <div class="np-icon">🍵</div>
    <div class="np-title">暂无病人</div>
    <div class="np-text">请您休息一下～<br>过一会儿病人会陆续前来</div>
    <button class="np-btn" id="btnNoPatientBack">返回主页</button>
  </div>

  <div id="diagSymptomPanel">
    <span class="placeholder">先点击病人的头、胸、腹、腿进行望诊...</span>
  </div>

  <div id="diagOptionsBar">
    <button class="option-btn" data-idx="0">—</button>
    <button class="option-btn" data-idx="1">—</button>
    <button class="option-btn" data-idx="2">—</button>
  </div>

  <div class="modal-overlay" id="diagModalOverlay">
    <div class="modal-box" id="diagModalBox"></div>
  </div>
</div>

<!-- ==================== 采药页面 ==================== -->
<div id="page-collect" class="page">
  <div id="collectTopBar">
  <div id="collectLeftCol">
    <div class="diag-back-left" id="collectBack">← 返回</div>
    <div id="collectInfo">
      <span class="info-chip">⚡ <span id="collectStaminaText">5</span></span>
      <span class="info-chip" style="display:flex;align-items:center;gap:3px;">
    <img class="auto-hide" src="images/icon-coin.webp" style="width:14px;height:14px;object-fit:contain;">
    <span id="collectCoinText">0</span>
</span>
      <span class="info-chip">🌿 <span id="collectGroupText">0</span>/6</span>
    </div>
  </div>
</div>
  <div id="collectAreaBar">
    <button class="area-btn active" data-area="forest">🌲 丛林</button>
    <button class="area-btn" data-area="mountain">⛰️ 山地</button>
    <button class="area-btn" data-area="field">🌾 田野</button>
  </div>
  <div id="collectCardArea"></div>
  <div id="collectSlotBar"></div>
  <div id="collectBottomBar">
    <button class="bottom-btn secondary" id="btnCollectBook">📖 药书</button>
    <button class="bottom-btn secondary" id="btnCollectHint">💡 提示</button>
    <button class="bottom-btn" id="btnCollectShuffle">🔄 转换</button>
  </div>
  <div id="collectStartModal">
    <div class="csm-title">🌿 采药</div>
    <div class="csm-text">每次采药消耗 1 点体力</div>
    <div class="csm-stamina">⚡ 体力：<span id="collectStartStamina">5</span> / 5</div>
    <button class="csm-btn" id="btnCollectStart">开始采药</button>
    <button class="csm-btn secondary" id="btnCollectBackStart">返回主页</button>
  </div>
  <div class="modal-overlay" id="collectModalOverlay">
    <div class="modal-box" id="collectModalBox"></div>
  </div>
</div>

<!-- ==================== 炮制页面 ==================== -->
<div id="page-process" class="page">
  <div id="processTopBar">
  <div id="processTopLeft">
    <div class="diag-back-left" id="btnProcBack">← 返回</div>
    <button class="proc-top-btn" id="btnProcManual">📖 说明书</button>
    <button class="proc-top-btn" id="btnProcShop">🛒 购买辅料</button>
  </div>
  <div id="processTopRight">
    <div id="procCoinDisplay">
      <img class="auto-hide" src="images/icon-coin.webp" style="width:16px;height:16px;margin-right:3px;">
      <span id="procCoinText">0</span>
    </div>
  </div>
</div>

  <div id="processMain">
    <div class="herb-row" id="procHerbRowTop"></div>
    <div id="procWorkArea">
      <div id="procLeftTools" data-label="工具"></div>
      <div id="procCounter">
        <div id="procStage">
          <img id="procStageHerbImg" style="display:none;">
          <span id="procStageEmoji" style="display:none;">🌿</span>
        </div>
        <div id="procCounterHerb">请选择药材</div>
        <div id="procStepList"></div>
        <div id="procCounterButtons">
          <button id="btnProcFinish" disabled>收好（×10）</button>
          <button id="btnProcCancel" disabled>放弃</button>
        </div>
      </div>
      <div id="procRightTools"></div>
    </div>
    <div class="herb-row" id="procHerbRowBottom"></div>
  </div>

  <div class="modal-overlay" id="procModalOverlay">
    <div class="modal-box" id="procModalBox"></div>
  </div>
</div>

<!-- ==================== 抓药页面 ==================== -->
<div id="page-dispense" class="page">     
  <div id="dispTopBar">
    <div id="dispTopLeft">
      <div class="diag-back-left" id="btnDispBack">← 返回</div>
      <div style="font-size:14px;font-weight:bold;">📋 抓药台</div>
    </div>
    <div id="dispTopRight">
      <div class="resource" style="background:rgba(255,255,255,0.9);color:#b85c00;">
        <img class="auto-hide coin-icon" src="images/icon-coin.webp"> <span id="dispCoinText">0</span>
      </div>
    </div>
  </div>

  <div id="dispMain">
    <div id="dispOrderPanel">
      <div id="dispOrderNav">
        <button id="btnDispPrevOrder">◀ 上一张</button>
        <button id="btnDispNextOrder">下一张 ▶</button>
      </div>
      <div id="dispOrderTitle">处方</div>
      <div id="dispOrderList"></div>
    </div>

    <div id="dispPlatePanel">
      <div id="dispPlateTitle">🫙 药盘（点击可退回库存）</div>
      <div id="dispPlateGrid"></div>
      <button id="btnDispPack">打包药包</button>
    </div>

    <div id="dispStockPanel">
      <div id="dispStockTitle">📦 库存（点击加药）</div>
      <div id="dispStockList"></div>
    </div>
  </div>

  <div class="modal-overlay" id="dispBagModal">
    <div class="modal-box">
        <img id="dispBagImg" class="auto-hide" src="images/medicine-bag.webp" alt=""
             style="width:140px;height:140px;object-fit:contain;display:block;margin:0 auto 10px auto;">
        <div id="dispBagEmoji" style="font-size:80px;text-align:center;display:none;">🎁</div>
        <div class="modal-title" id="dispBagName"></div>
        <button class="modal-btn" id="dispBagConfirm">交给病人</button>
    </div>
 </div>
</div>                                   
<script src="./game.js"></script>
<script src="./main.js"></script>
<script src="./collect.js"></script>
<script src="./process.js"></script>
<script src="./dispense.js"></script>
<script src="./diagnose.js"></script>
</body>
</html>
