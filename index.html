<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>赤脚医生</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #e8f5e9; /* 黄绿色调 */
            font-family: sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            user-select: none;
        }
        h1 {
            font-size: 28px;
            color: #33691e;
            margin-bottom: 10px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }
        #mainMenu {
            position: relative;
            width: 90%;
            max-width: 360px;
            height: 500px;
            background: #cddc39;
            border-radius: 30px;
            border: 4px solid #558b2f;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }
        .btn {
            position: absolute;
            width: 100px;
            height: 100px;
            background: #f0f4c3;
            border: 3px solid #33691e;
            border-radius: 20px;
            font-size: 18px;
            font-weight: bold;
            color: #33691e;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
            transition: all 0.2s;
        }
        .btn:active {
            transform: scale(0.95);
            background: #dce775;
        }
        /* 五个按钮的位置 */
        #btn-collect { top: 20px; left: 20px; }
        #btn-process { top: 120px; left: 130px; }
        #btn-diagnose { top: 240px; left: 80px; }
        #btn-plant { top: 140px; right: 20px; }
        #btn-dispense { bottom: 20px; left: 130px; }
    </style>
</head>
<body>
    <h1>🌿 重生之我是赤脚医生</h1>
    <div id="mainMenu">
        <a class="btn" id="btn-collect" href="collect.html">采药</a>
        <a class="btn" id="btn-process" href="process.html">炮制</a>
        <a class="btn" id="btn-diagnose" href="diagnose.html">行医</a>
        <a class="btn" id="btn-plant" href="plant.html">种植</a>
        <a class="btn" id="btn-dispense" href="dispense.html">抓药</a>
    </div>
</body>
</html>
