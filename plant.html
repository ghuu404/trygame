<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>种植 - 重生之我是赤脚医生</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; }
body {
    font-family: "KaiTi", "STKaiti", "楷体", "Kaiti SC", serif;
    user-select: none;
    background: #f0ede4;
    display: flex;
    flex-direction: column;
}
/* ===== 顶部栏 ===== */
#topBar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px 10px;
    background: rgba(58, 42, 26, 0.92);
    color: #fff;
    font-size: 13px; font-weight: bold;
    flex-shrink: 0; gap: 6px;
    z-index: 10;
}
.top-btn {
    background: #d4a574; border: 2px solid #8b5e3c;
    border-radius: 14px; padding: 4px 12px;
    font-size: 12px; font-weight: bold;
    color: #fff; cursor: pointer; text-decoration: none;
    white-space: nowrap; transition: all 0.15s;
}
.top-btn:active { transform: scale(0.95); }
#coinDisplay {
    display: flex; align-items: center; gap: 3px;
    background: rgba(255,255,255,0.9);
    padding: 4px 12px; border-radius: 14px;
    color: #8b5e3c;
}
/* ===== 主区域：水墨背景 ===== */
#main {
    flex: 1;
    position: relative;
    overflow-y: auto;
    padding: 4px 10px 10px;
    background:
        /* 远山 - 水墨晕染 */
        radial-gradient(ellipse 120% 18% at 20% 15%, rgba(80,95,90,0.42) 0%, rgba(80,95,90,0.15) 40%, transparent 70%),
        radial-gradient(ellipse 140% 22% at 75% 20%, rgba(70,85,80,0.38) 0%, rgba(70,85,80,0.12) 45%, transparent 72%),
        radial-gradient(ellipse 100% 14% at 45% 25%, rgba(90,105,95,0.3) 0%, transparent 65%),
        /* 近处水墨草坡 */
        radial-gradient(ellipse 80% 12% at 15% 45%, rgba(120,140,110,0.4) 0%, transparent 65%),
        radial-gradient(ellipse 90% 14% at 85% 42%, rgba(110,130,105,0.35) 0%, transparent 65%),
        /* 宣纸底色 */
        linear-gradient(180deg, #f5f2e8 0%, #eef0e4 30%, #e6ebdc 60%, #dce3d0 100%);
}
/* 远山轮廓线（水墨勾线感） */
#main::before {
    content: '';
    position: absolute;
    top: 12%; left: 0; right: 0; height: 60px;
    background:
        radial-gradient(ellipse 30% 60% at 20% 100%, rgba(60,80,70,0.4) 0%, transparent 70%),
        radial-gradient(ellipse 40% 80% at 50% 100%, rgba(50,70,60,0.35) 0%, transparent 70%),
        radial-gradient(ellipse 35% 70% at 80% 100%, rgba(70,90,80,0.4) 0%, transparent 70%);
    filter: blur(2px);
    pointer-events: none;
    opacity: 0.7;
}
/* ===== 农场场景（树木、茅草屋、池塘装饰）===== */
.scene-decor {
    position: absolute;
    pointer-events: none;
    z-index: 1;
    opacity: 0.85;
    font-size: 38px;
    filter: drop-shadow(1px 2px 2px rgba(0,0,0,0.15));
}
.decor-tree1 { top: 16%; left: 4%; font-size: 42px; }
.decor-tree2 { top: 20%; left: 14%; font-size: 34px; }
.decor-tree3 { top: 14%; right: 6%; font-size: 44px; }
.decor-house { top: 22%; right: 14%; font-size: 46px; }
.decor-pond  { top: 26%; left: 3%; font-size: 34px; }
.decor-shed  { top: 26%; left: 50%; font-size: 30px; }

/* ===== 田地区域（透视等距）===== */
.field-wrapper {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 90px 10px 40px;
    position: relative;
    z-index: 2;
    min-height: 460px;
    /* 让内容不被 3D 变换裁掉 */
    perspective: 900px;
    perspective-origin: 50% 30%;
}
.plot-3d {
    transform: rotateX(48deg);
    transform-style: preserve-3d;
    transform-origin: center center;
    position: relative;
}
.grid-3d {
    display: grid;
    grid-template-columns: repeat(4, 66px);
    grid-template-rows: repeat(4, 66px);
    gap: 7px;
    transform-style: preserve-3d;
}

/* 单个格子 */
.cell-3d {
    width: 66px;
    height: 66px;
    background: #cfc5a8;
    border: 2px solid #6d4a2a;
    border-radius: 5px;
    position: relative;
    cursor: pointer;
    transform-style: preserve-3d;
    box-shadow:
        inset 2px 2px 3px rgba(255,255,255,0.5),
        inset -2px -2px 3px rgba(0,0,0,0.15),
        0 3px 6px rgba(0,0,0,0.25);
    transition: all 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
}
.cell-3d.empty {
    background: #cfc5a8;
    background-image:
        radial-gradient(circle, #b8ad8a 1px, transparent 1px);
    background-size: 9px 9px;
}
.cell-3d.growing {
    background: #a9c98d;
    background-image:
        radial-gradient(circle, #90b478 1px, transparent 1px);
    background-size: 9px 9px;
}
.cell-3d:active { transform: scale(0.95); }

/* 格子内容反向旋转，保持正立 */
.cell-inner {
    transform: rotateX(-48deg);
    transform-origin: center center;
    transform-style: preserve-3d;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    pointer-events: none;
}
.cell-inner .plant-emoji { font-size: 26px; line-height: 1; }
.cell-inner .plus { font-size: 24px; color: #7a5a3a; font-weight: bold; }
.cell-inner .cell-timer {
    font-size: 10px;
    color: #c62828;
    font-weight: bold;
    background: rgba(255,255,255,0.8);
    border-radius: 4px;
    padding: 0 4px;
    margin-top: 2px;
}
.cell-inner .mature-label {
    font-size: 11px;
    color: #2e7d32;
    font-weight: bold;
    background: rgba(255,255,255,0.9);
    border-radius: 4px;
    padding: 1px 6px;
    border: 1px solid #2e7d32;
}

/* 田地的木栅栏底座 */
.plot-base {
    position: absolute;
    inset: -14px;
    background: #b28a5c;
    border-radius: 10px;
    box-shadow:
        0 10px 18px rgba(0,0,0,0.28),
        inset 0 0 0 4px #8b6b47;
    z-index: -1;
    border: 3px solid #5a3e2b;
    background-image:
        repeating-linear-gradient(90deg, transparent 0, transparent 14px, rgba(90,62,43,0.35) 14px, rgba(90,62,43,0.35) 16px);
}

/* ===== 成熟浮框图层 ===== */
#bubbleLayer {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 100;
}
.harvest-bubble {
    position: absolute;
    width: 74px;
    height: 74px;
    background: #fffbe6;
    border: 3px solid #d4872c;
    border-radius: 14px;
    padding: 4px;
    box-shadow: 0 6px 14px rgba(0,0,0,0.3);
    cursor: pointer;
    pointer-events: auto;
    display: flex;
    align-items: center;
    justify-content: center;
    animation: bubblePop 0.35s ease-out, bubbleFloat 1.2s ease-in-out infinite alternate;
}
.harvest-bubble::after {
    content: '';
    position: absolute;
    bottom: -10px; left: 50%;
    transform: translateX(-50%);
    border-left: 8px solid transparent;
    border-right: 8px solid transparent;
    border-top: 10px solid #d4872c;
}
.harvest-bubble img {
    width: 100%; height: 100%;
    object-fit: contain;
    border-radius: 10px;
    pointer-events: none;
}
.harvest-bubble .fallback { font-size: 36px; }
@keyframes bubblePop {
    0% { transform: scale(0.3); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
}
@keyframes bubbleFloat {
    from { margin-top: 0; }
    to { margin-top: -6px; }
}

/* ===== 田地标题 ===== */
.plot-title {
    text-align: center;
    font-size: 16px;
    font-weight: bold;
    color: #3a2a1a;
    margin-bottom: 8px;
    text-shadow: 1px 1px 2px rgba(255,255,255,0.9);
    position: relative;
    z-index: 3;
}

/* ===== 锁定的田地 ===== */
.plot-locked {
    background: rgba(255,250,240,0.85);
    border: 3px dashed #8b5e3c;
    border-radius: 14px;
    padding: 30px 20px;
    text-align: center;
    margin: 10px 0;
    cursor: pointer;
    transition: all 0.15s;
    position: relative;
    z-index: 2;
}
.plot-locked:active { transform: scale(0.98); }
.plot-locked .lock-icon { font-size: 36px; }
.plot-locked .lock-text { font-size: 14px; font-weight: bold; color: #666; margin-top: 6px; }
.plot-locked .lock-cost { font-size: 13px; color: #b85c00; margin-top: 4px; }

/* ===== 底部按钮 ===== */
#bottomBar {
    display: flex;
    background: rgba(58, 42, 26, 0.92);
    padding: 6px;
    gap: 6px;
    flex-shrink: 0;
    z-index: 10;
}
.bottom-btn {
    flex: 1;
    padding: 10px;
    font-size: 14px;
    font-weight: bold;
    border-radius: 10px;
    border: 2px solid #8b5e3c;
    background: #d4a574;
    color: #fff;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s;
}
.bottom-btn:active { transform: scale(0.96); }
.bottom-btn.secondary { background: #e0e0e0; border-color: #999; color: #555; }

/* ===== 弹窗 ===== */
#modalOverlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.6);
    display: none;
    align-items: center; justify-content: center;
    z-index: 999;
}
#modalOverlay.active { display: flex; }
.modal-box {
    background: #f5f0e8;
    border-radius: 18px;
    padding: 20px 22px;
    text-align: center;
    border: 3px solid #8b5e3c;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    max-width: 360px;
    width: 88%;
    max-height: 85vh;
    overflow-y: auto;
}
.modal-title { font-size: 18px; font-weight: bold; color: #3a2a1a; margin-bottom: 12px; }
.modal-text { font-size: 14px; color: #555; margin-bottom: 14px; line-height: 1.6; text-align: left; }
.modal-btn {
    display: block; width: 100%;
    padding: 10px; margin: 5px 0;
    font-family: inherit; font-size: 15px; font-weight: bold;
    background: #d4a574; color: #fff;
    border: 2px solid #8b5e3c;
    border-radius: 10px;
    cursor: pointer;
}
.modal-btn:active { transform: scale(0.97); }
.modal-btn.secondary { background: #e0e0e0; border-color: #999; color: #555; }

.seed-grid {
    display: grid; grid-template-columns: repeat(2, 1fr);
    gap: 8px; margin: 10px 0;
}
.seed-card {
    background: #fff; border: 2px solid #d4c4a8;
    border-radius: 10px; padding: 8px 6px;
    display: flex; flex-direction: column;
    align-items: center; gap: 4px;
}
.seed-card .seed-icon { font-size: 32px; line-height: 1; }
.seed-card .seed-name { font-size: 13px; font-weight: bold; color: #3a2a1a; }
.seed-card .seed-price { font-size: 12px; color: #b85c00; font-weight: bold; }
.seed-card .seed-stock { font-size: 11px; color: #777; }
.seed-card .seed-buy {
    padding: 4px 14px; border-radius: 12px;
    border: 2px solid #8b5e3c; background: #d4a574;
    color: #fff; font-weight: bold; font-size: 12px;
    cursor: pointer; font-family: inherit;
}
.seed-card .seed-buy:disabled { background: #ccc; border-color: #999; cursor: not-allowed; }

/* ===== 底部收获提示条 ===== */
#harvestToast {
    position: fixed;
    left: 50%; bottom: -100px;
    transform: translateX(-50%);
    background: rgba(51, 105, 30, 0.95);
    color: #fff;
    padding: 12px 24px;
    border-radius: 14px;
    font-size: 15px; font-weight: bold;
    border: 2px solid #aed581;
    box-shadow: 0 6px 20px rgba(0,0,0,0.3);
    z-index: 2000;
    transition: bottom 0.35s ease-out;
    white-space: nowrap;
}
#harvestToast.show { bottom: 90px; }
</style>
</head>
<body>

<div id="topBar">
    <div style="display:flex;gap:6px;">
        <a class="top-btn" href="index.html">← 返回</a>
        <button class="top-btn" id="btnSeedShop">🌱 种子商店</button>
    </div>
    <div id="coinDisplay">
        <img src="images/icon-coin.webp" style="width:16px;height:16px;" onerror="this.style.display='none'">
        <span id="coinText">0</span>
    </div>
</div>

<div id="main">
    <!-- 场景装饰 -->
    <div class="scene-decor decor-tree1">🌲</div>
    <div class="scene-decor decor-tree2">🌳</div>
    <div class="scene-decor decor-tree3">🌲</div>
    <div class="scene-decor decor-house">🏡</div>
    <div class="scene-decor decor-pond">🪷</div>
    <div class="scene-decor decor-shed">🏚</div>

    <div id="plotsContainer"></div>
</div>

<div id="bottomBar">
    <button class="bottom-btn" id="btnUnlock">🔓 解锁新田地</button>
    <button class="bottom-btn secondary" id="btnHarvestAll">🌾 一键收获</button>
</div>

<div id="bubbleLayer"></div>
<div id="modalOverlay"><div class="modal-box" id="modalContent"></div></div>
<div id="harvestToast"></div>

<script>
/* ============================================================
   种植板块（透视田地 + 水墨风背景）
   ============================================================ */

const GROW_TIME = 15;

const PLANT_COINS_KEY = 'plantCoins';
const PLANT_SEEDS_KEY = 'plantSeeds';
const PLANT_HERBS_KEY = 'plantHerbs';
const PLANT_PLOTS_KEY = 'plantPlots';

const SEEDS = [
    { name: '生姜', icon: '🫚', price: 2, yield: 2 },
    { name: '大枣', icon: '🍇', price: 2, yield: 2 },
    { name: '粳米', icon: '🌾', price: 2, yield: 2 },
    { name: '甘草', icon: '🌿', price: 3, yield: 2 },
    { name: '芍药', icon: '🌸', price: 3, yield: 2 },
    { name: '半夏', icon: '🌱', price: 4, yield: 2 },
    { name: '泽泻', icon: '💧', price: 4, yield: 2 },
    { name: '栀子', icon: '🌼', price: 3, yield: 2 }
];

/* ===== 独立金币 ===== */
function getCoins() {
    let v = parseInt(localStorage.getItem(PLANT_COINS_KEY));
    if (isNaN(v)) { v = 100; localStorage.setItem(PLANT_COINS_KEY, v); }
    return v;
}
function setCoins(n) {
    localStorage.setItem(PLANT_COINS_KEY, String(n));
    document.getElementById('coinText').textContent = n;
}
function spendCoins(n) {
    const cur = getCoins();
    if (cur < n) return false;
    setCoins(cur - n);
    return true;
}
/* ===== 独立种子 / 仓库 ===== */
function getSeedBag() {
    try { return JSON.parse(localStorage.getItem(PLANT_SEEDS_KEY)) || {}; }
    catch(e) { return {}; }
}
function saveSeedBag(bag) { localStorage.setItem(PLANT_SEEDS_KEY, JSON.stringify(bag)); }
function addSeed(name, count) {
    const bag = getSeedBag();
    bag[name] = (bag[name] || 0) + count;
    saveSeedBag(bag);
}
function getHerbBag() {
    try { return JSON.parse(localStorage.getItem(PLANT_HERBS_KEY)) || {}; }
    catch(e) { return {}; }
}
function saveHerbBag(bag) { localStorage.setItem(PLANT_HERBS_KEY, JSON.stringify(bag)); }
function addHerb(name, count) {
    const bag = getHerbBag();
    bag[name] = (bag[name] || 0) + count;
    saveHerbBag(bag);
}

/* ===== 田地数据 ===== */
const GRID_SIZE = 16;
const UNLOCK_COSTS = [500, 1500, 3000, 6000];

function createPlot(unlocked) {
    return {
        unlocked: unlocked,
        cells: Array(GRID_SIZE).fill(null).map(() => ({ seed: null, plantedAt: 0 }))
    };
}
function getPlots() {
    try {
        const p = JSON.parse(localStorage.getItem(PLANT_PLOTS_KEY));
        if (p && Array.isArray(p) && p.length > 0) return p;
    } catch(e) {}
    return [createPlot(true)];
}
function savePlots(p) { localStorage.setItem(PLANT_PLOTS_KEY, JSON.stringify(p)); }

let plots = getPlots();

/* ===== 渲染 ===== */
const plotsContainer = document.getElementById('plotsContainer');

function render() {
    plotsContainer.innerHTML = '';
    plots.forEach((plot, plotIndex) => {
        if (!plot.unlocked) {
            const cost = UNLOCK_COSTS[plotIndex - 1] || 9999;
            const div = document.createElement('div');
            div.className = 'plot-locked';
            div.innerHTML = `
                <div class="lock-icon">🔒</div>
                <div class="lock-text">田地 ${plotIndex + 1}（未解锁）</div>
                <div class="lock-cost">点击解锁：💰 ${cost}</div>
            `;
            div.addEventListener('click', () => tryUnlock(plotIndex));
            plotsContainer.appendChild(div);
        } else {
            const block = document.createElement('div');

            const plotTitle = document.createElement('div');
            plotTitle.className = 'plot-title';
            const readyCount = plot.cells.filter(c => c.seed && isReady(c)).length;
            plotTitle.textContent = `🌾 田地 ${plotIndex + 1}` + (readyCount > 0 ? `（${readyCount} 格成熟）` : '');
            block.appendChild(plotTitle);

            const wrapper = document.createElement('div');
            wrapper.className = 'field-wrapper';

            const plot3d = document.createElement('div');
            plot3d.className = 'plot-3d';

            const base = document.createElement('div');
            base.className = 'plot-base';
            plot3d.appendChild(base);

            const grid = document.createElement('div');
            grid.className = 'grid-3d';

            plot.cells.forEach((cell, cellIndex) => {
                grid.appendChild(renderCell(cell, plotIndex, cellIndex));
            });

            plot3d.appendChild(grid);
            wrapper.appendChild(plot3d);
            block.appendChild(wrapper);
            plotsContainer.appendChild(block);
        }
    });

    renderBubbles();
}

function renderCell(cell, plotIndex, cellIndex) {
    const cellDiv = document.createElement('div');
    cellDiv.className = 'cell-3d';
    cellDiv.dataset.plot = plotIndex;
    cellDiv.dataset.cell = cellIndex;

    const inner = document.createElement('div');
    inner.className = 'cell-inner';

    if (!cell.seed) {
        cellDiv.classList.add('empty');
        inner.innerHTML = '<span class="plus">＋</span>';
        cellDiv.addEventListener('click', () => openSeedPicker(plotIndex, cellIndex));
    } else {
        const seedInfo = SEEDS.find(s => s.name === cell.seed);
        if (!seedInfo) return cellDiv;
        cellDiv.classList.add('growing');

        if (isReady(cell)) {
            inner.innerHTML = `<span class="mature-label">成熟</span>`;
        } else {
            const remain = getRemainSeconds(cell);
            inner.innerHTML = `
                <div class="plant-emoji">${seedInfo.icon}</div>
                <div class="cell-timer">${remain}s</div>
            `;
        }
    }
    cellDiv.appendChild(inner);
    return cellDiv;
}

function isReady(cell) {
    if (!cell.seed) return false;
    return (Date.now() - cell.plantedAt) >= GROW_TIME * 1000;
}
function getRemainSeconds(cell) {
    if (!cell.seed) return 0;
    const elapsed = (Date.now() - cell.plantedAt) / 1000;
    return Math.max(0, Math.ceil(GROW_TIME - elapsed));
}

/* ===== 浮框图层 ===== */
const bubbleLayer = document.getElementById('bubbleLayer');
let bubbleMap = new Map();

function renderBubbles() {
    const readyKeys = new Set();
    plots.forEach((plot, plotIndex) => {
        if (!plot.unlocked) return;
        plot.cells.forEach((cell, cellIndex) => {
            if (cell.seed && isReady(cell)) {
                readyKeys.add(plotIndex + '-' + cellIndex);
            }
        });
    });

    for (const [key, bubble] of bubbleMap.entries()) {
        if (!readyKeys.has(key)) {
            bubble.el.remove();
            bubbleMap.delete(key);
        }
    }

    readyKeys.forEach(key => {
        if (bubbleMap.has(key)) {
            positionBubble(key, bubbleMap.get(key));
            return;
        }
        const [pi, ci] = key.split('-').map(Number);
        const seedName = plots[pi].cells[ci].seed;
        const seedInfo = SEEDS.find(s => s.name === seedName);
        if (!seedInfo) return;

        const bubble = document.createElement('div');
        bubble.className = 'harvest-bubble';
        const imgPath = `images/herbs/${seedName}.png`;
        bubble.innerHTML = `
            <img src="${imgPath}" onerror="this.style.display='none';this.nextElementSibling.style.display='block';">
            <span class="fallback" style="display:none;">${seedInfo.icon}</span>
        `;
        bubble.addEventListener('click', (e) => {
            e.stopPropagation();
            harvest(pi, ci);
        });
        bubbleLayer.appendChild(bubble);
        const obj = { el: bubble, seed: seedName };
        bubbleMap.set(key, obj);
        positionBubble(key, obj);
    });
}

function positionBubble(key, bubble) {
    const [pi, ci] = key.split('-').map(Number);
    const cellEl = document.querySelector(`.cell-3d[data-plot="${pi}"][data-cell="${ci}"]`);
    if (!cellEl) return;
    const rect = cellEl.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    bubble.el.style.left = cx + 'px';
    bubble.el.style.top = (cy - 58) + 'px';
    bubble.el.style.transform = 'translate(-50%, -50%)';
}

/* ===== 选择种子 / 种植 ===== */
function openSeedPicker(plotIndex, cellIndex) {
    const bag = getSeedBag();
    const owned = Object.keys(bag).filter(k => bag[k] > 0);

    let html = '<div class="modal-title">🌱 选择种子</div>';
    if (owned.length === 0) {
        html += '<div class="modal-text">你还没有种子，先去种子商店购买吧～</div>';
        html += '<button class="modal-btn" onclick="closeModal();openSeedShop();">🛒 去种子商店</button>';
        html += '<button class="modal-btn secondary" onclick="closeModal()">取消</button>';
        showModal(html);
        return;
    }
    html += '<div class="seed-grid">';
    owned.forEach(name => {
        const info = SEEDS.find(s => s.name === name);
        if (!info) return;
        html += `
            <div class="seed-card">
                <div class="seed-icon">${info.icon}</div>
                <div class="seed-name">${name}</div>
                <div class="seed-stock">库存 x${bag[name]}</div>
                <button class="seed-buy" onclick="plantSeed(${plotIndex},${cellIndex},'${name}')">种植</button>
            </div>
        `;
    });
    html += '</div><button class="modal-btn secondary" onclick="closeModal()">取消</button>';
    showModal(html);
}

function plantSeed(plotIndex, cellIndex, seedName) {
    const bag = getSeedBag();
    if (!bag[seedName] || bag[seedName] <= 0) { alert('种子不足！'); return; }
    bag[seedName] -= 1;
    saveSeedBag(bag);
    plots[plotIndex].cells[cellIndex] = { seed: seedName, plantedAt: Date.now() };
    savePlots(plots);
    closeModal();
    render();
}

/* ===== 收获 ===== */
function harvest(plotIndex, cellIndex) {
    const cell = plots[plotIndex].cells[cellIndex];
    if (!cell.seed || !isReady(cell)) return;
    const info = SEEDS.find(s => s.name === cell.seed);
    if (!info) return;
    addHerb(cell.seed, info.yield);
    plots[plotIndex].cells[cellIndex] = { seed: null, plantedAt: 0 };
    savePlots(plots);
    showHarvestToast(`🌿 收获了一份${cell.seed} x${info.yield}`);
    render();
}

function showHarvestToast(text) {
    const toast = document.getElementById('harvestToast');
    toast.textContent = text;
    toast.classList.add('show');
    clearTimeout(toast._timer);
    toast._timer = setTimeout(() => toast.classList.remove('show'), 2000);
}

document.getElementById('btnHarvestAll').addEventListener('click', () => {
    let total = 0, names = [];
    plots.forEach(plot => {
        if (!plot.unlocked) return;
        plot.cells.forEach((cell, ci) => {
            if (cell.seed && isReady(cell)) {
                const info = SEEDS.find(s => s.name === cell.seed);
                if (info) { addHerb(cell.seed, info.yield); total += info.yield; names.push(cell.seed); }
                plot.cells[ci] = { seed: null, plantedAt: 0 };
            }
        });
    });
    savePlots(plots);
    if (total > 0) showHarvestToast(`🌿 一键收获 ${names.length} 种，共 ${total} 份`);
    else alert('暂无成熟的药材可以收获～');
    render();
});

/* ===== 解锁 ===== */
function tryUnlock(plotIndex) {
    const cost = UNLOCK_COSTS[plotIndex - 1] || 9999;
    if (getCoins() < cost) {
        showModal(`
            <div class="modal-title">💰 铜币不足</div>
            <div class="modal-text">解锁田地 ${plotIndex + 1} 需要 ${cost} 铜币。<br>当前铜币：${getCoins()}</div>
            <button class="modal-btn secondary" onclick="closeModal()">知道了</button>
        `);
        return;
    }
    showModal(`
        <div class="modal-title">🔓 解锁田地 ${plotIndex + 1}</div>
        <div class="modal-text">花费 ${cost} 铜币，解锁一块新的 4×4 田地。</div>
        <button class="modal-btn" onclick="doUnlock(${plotIndex})">确认解锁</button>
        <button class="modal-btn secondary" onclick="closeModal()">取消</button>
    `);
}
function doUnlock(plotIndex) {
    const cost = UNLOCK_COSTS[plotIndex - 1] || 9999;
    if (!spendCoins(cost)) { alert('铜币不足！'); return; }
    plots[plotIndex] = createPlot(true);
    savePlots(plots);
    closeModal();
    render();
}
document.getElementById('btnUnlock').addEventListener('click', () => {
    const idx = plots.findIndex(p => !p.unlocked);
    if (idx === -1) {
        showModal(`
            <div class="modal-title">🎉 全部解锁</div>
            <div class="modal-text">你已经解锁了所有田地！</div>
            <button class="modal-btn secondary" onclick="closeModal()">知道了</button>
        `);
        return;
    }
    tryUnlock(idx);
});

/* ===== 种子商店 ===== */
function openSeedShop() {
    let html = '<div class="modal-title">🌱 种子商店</div>';
    html += `<div style="text-align:right;font-size:13px;color:#b85c00;font-weight:bold;margin-bottom:8px;">💰 当前铜币：${getCoins()}</div>`;
    html += '<div class="seed-grid">';
    const bag = getSeedBag();
    SEEDS.forEach(info => {
        const canBuy = getCoins() >= info.price;
        const stock = bag[info.name] || 0;
        html += `
            <div class="seed-card">
                <div class="seed-icon">${info.icon}</div>
                <div class="seed-name">${info.name}</div>
                <div class="seed-price">💰 ${info.price}</div>
                <div class="seed-stock">库存 x${stock}</div>
                <button class="seed-buy" onclick="buySeed('${info.name}')" ${canBuy ? '' : 'disabled'}>购买</button>
            </div>
        `;
    });
    html += '</div><button class="modal-btn secondary" onclick="closeModal()">关闭</button>';
    showModal(html);
}
function buySeed(name) {
    const info = SEEDS.find(s => s.name === name);
    if (!info) return;
    if (getCoins() < info.price) { alert('铜币不足！'); return; }
    spendCoins(info.price);
    addSeed(name, 1);
    openSeedShop();
}
document.getElementById('btnSeedShop').addEventListener('click', openSeedShop);

/* ===== 弹窗 ===== */
function showModal(html) {
    document.getElementById('modalContent').innerHTML = html;
    document.getElementById('modalOverlay').classList.add('active');
}
function closeModal() {
    document.getElementById('modalOverlay').classList.remove('active');
}

/* ===== 定时刷新 ===== */
setInterval(() => {
    const hasGrowing = plots.some(p => p.unlocked && p.cells.some(c => c.seed && !isReady(c)));
    const hasReady = plots.some(p => p.unlocked && p.cells.some(c => c.seed && isReady(c)));
    if (hasGrowing || hasReady) render();
}, 1000);

window.addEventListener('resize', () => {
    bubbleMap.forEach((bubble, key) => positionBubble(key, bubble));
});

setCoins(getCoins());
render();
</script>
</body>
</html>
