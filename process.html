<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>炮制药材 - 重生之我是赤脚医生</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: sans-serif;
    user-select: none;
    overflow: hidden;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: #f5f0e8;
}
/* ===== 顶部栏 ===== */
#topBar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 4px 8px; background: #33691e; color: #fff;
    font-size: 12px; font-weight: bold; flex-shrink: 0; gap: 4px;
}
.top-btn {
    background: #aed581; border: 2px solid #fff;
    border-radius: 12px; padding: 2px 8px;
    font-size: 11px; font-weight: bold;
    color: #33691e; cursor: pointer; text-decoration: none;
    white-space: nowrap;
}
.top-btn:active { transform: scale(0.95); }
#processedCount, #coinDisplay {
    background: #aed581; border: 2px solid #fff; border-radius: 12px;
    padding: 2px 8px; font-size: 11px; color: #33691e;
}
/* ===== 主体 ===== */
#main {
    flex: 1; display: flex; flex-direction: column;
    padding: 2px; gap: 2px; overflow: hidden;
}
/* 药材栏 */
.herb-row {
    display: flex; gap: 4px; padding: 2px;
    flex-shrink: 0; justify-content: center; overflow-x: auto;
}
.herb-slot {
    width: 62px; height: 70px;
    background: #e8d5c0; border: 2px solid #8b5e3c;
    border-radius: 8px; display: flex; flex-direction: column;
    align-items: flex-end; justify-content: flex-end;
    cursor: pointer; font-size: 10px; font-weight: bold;
    color: #3a2a1a; flex-shrink: 0; position: relative;
    overflow: hidden; transition: all 0.15s; padding-bottom: 2px;
}
.herb-slot:active { transform: scale(0.94); }
.herb-slot img {
    width: 32px; height: 32px; object-fit: contain;
    position: absolute; top: 4px; left: 50%;
    transform: translateX(-50%); pointer-events: none;
}
.herb-slot .hname { font-size: 10px; text-align: center; width: 100%; }
.herb-slot .hcount {
    position: absolute; top: 1px; right: 2px; font-size: 9px; color: #c62828;
    background: rgba(255,255,255,0.85); border-radius: 5px; padding: 0 3px;
}
.herb-slot.empty { background: #d0c0b0; border-style: dashed; color: #999; cursor: default; }
.herb-slot.selected { border-color: #ff8c00; box-shadow: 0 0 6px #ff8c00; }

/* 操作区 */
#workArea {
    flex: 1; display: flex; background: rgba(255,255,255,0.5);
    border-radius: 10px; border: 2px solid #b89a72;
    padding: 4px; gap: 4px; min-height: 0; overflow: hidden;
}
/* 左右工具和辅料栏：压缩宽度 */
#leftTools, #rightTools {
    display: flex; flex-direction: column; gap: 4px;
    width: 62px; overflow-y: auto; flex-shrink: 0; padding-right: 1px;
}
#leftTools::-webkit-scrollbar, #rightTools::-webkit-scrollbar { width: 3px; }
#leftTools::-webkit-scrollbar-thumb, #rightTools::-webkit-scrollbar-thumb {
    background: #b89a72; border-radius: 2px;
}
/* 工具/辅料按钮 */
.tool-btn, .material-btn {
    width: 56px; min-height: 44px;
    background: #fff; border: 2px solid #8b5e3c;
    border-radius: 8px; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    cursor: pointer; font-size: 10px; font-weight: bold;
    color: #5a3e2b; flex-shrink: 0; padding: 2px;
    transition: all 0.15s; line-height: 1.1;
    text-align: center; position: relative;
}
.tool-btn:active, .material-btn:active { transform: scale(0.94); }
.tool-btn img, .material-btn img {
    width: 22px; height: 22px; object-fit: contain;
    pointer-events: none;
}
.tool-btn .ticon, .material-btn .ticon { font-size: 18px; line-height: 1; }
.material-btn .mcount {
    position: absolute; top: 1px; right: 2px; font-size: 9px; color: #c62828;
    background: rgba(255,255,255,0.85); border-radius: 5px; padding: 0 3px;
}
.material-btn.out { opacity: 0.4; cursor: not-allowed; }

/* 中间操作台：自适应 */
#counter {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: #f0e6d8; border-radius: 10px;
    border: 2px dashed #b89a72;
    padding: 4px; min-width: 0; overflow: hidden;
}
#stage {
    position: relative; width: 80px; height: 80px;
    display: flex; align-items: center; justify-content: center;
}
#stageHerbImg { max-width: 72px; max-height: 72px; object-fit: contain; transition: all 0.3s; z-index: 2; }
#stageEmoji { font-size: 48px; z-index: 2; }
.stage-anim {
    position: absolute; z-index: 5; pointer-events: none;
    font-size: 28px; transition: all 0.4s ease-in-out;
}
#counterHerb {
    font-size: 13px; font-weight: bold; color: #5a3e2b;
    text-align: center; margin-top: 2px;
    max-width: 100%; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap;
}
#counterStatus { font-size: 11px; color: #888; text-align: center; min-height: 14px; }
#fryBarContainer {
    width: 90%; height: 12px; background: #ddd; border-radius: 6px;
    margin-top: 4px; overflow: hidden; display: none; position: relative;
}
#fryBar { height: 100%; width: 0%; background: #ffeb3b; transition: width 0.1s linear; }
#counterButtons { display: flex; gap: 4px; margin-top: 6px; }
#btnFinish, #btnCancel {
    padding: 4px 10px; font-size: 12px; font-weight: bold;
    border-radius: 10px; cursor: pointer;
    border: 2px solid #558b2f;
    background: #aed581; color: #33691e;
}
#btnCancel { background: #e0e0e0; border-color: #999; color: #555; }
#btnFinish:disabled, #btnCancel:disabled { opacity: 0.4; cursor: not-allowed; }

@keyframes herbShake {
    0%, 100% { transform: translateX(0) rotate(0); }
    20% { transform: translateX(-5px) rotate(-4deg); }
    40% { transform: translateX(5px) rotate(4deg); }
    60% { transform: translateX(-4px) rotate(-3deg); }
    80% { transform: translateX(4px) rotate(3deg); }
}
.shake { animation: herbShake 0.4s; }

#modalOverlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.65);
    display: none; align-items: center; justify-content: center; z-index: 999;
}
#modalOverlay.active { display: flex; }
.modal-box {
    background: #f5f0e8; border-radius: 20px;
    padding: 16px; text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    width: 85%; max-width: 360px;
    max-height: 80vh; overflow-y: auto;
    border: 3px solid #558b2f;
}
.modal-title { font-size: 18px; font-weight: bold; color: #33691e; margin-bottom: 8px; }
.modal-text { font-size: 13px; color: #666; margin-bottom: 12px; text-align: left; white-space: pre-wrap; line-height: 1.5; }
.modal-btn {
    display: block; width: 100%; font-size: 15px; font-weight: bold;
    padding: 8px; margin: 4px 0; border: 2px solid #558b2f;
    border-radius: 10px; background: #aed581; color: #33691e; cursor: pointer;
}
#manualContent { text-align: left; font-size: 12px; line-height: 1.6; max-height: 50vh; overflow-y: auto; }
#manualContent h4 { color: #33691e; margin: 6px 0 4px; border-bottom: 1px solid #ccc; padding-bottom: 2px; }
</style>
</head>
<body>

<div id="topBar">
    <div style="display:flex;gap:4px;">
        <a class="top-btn" href="index.html">← 返回</a>
        <button class="top-btn" id="btnManual">📖 说明书</button>
    </div>
    <div style="display:flex;gap:4px;align-items:center;">
        <div id="processedCount">已炮制：0 份</div>
        <div id="coinDisplay">💰 0</div>
    </div>
</div>

<div id="main">
    <div class="herb-row" id="herbRowTop"></div>

    <div id="workArea">
        <div id="leftTools"></div>

        <div id="counter">
            <div id="stage">
                <img id="stageHerbImg" style="display:none;">
                <span id="stageEmoji" style="display:none;">🌿</span>
            </div>
            <div id="counterHerb">请选择药材</div>
            <div id="counterStatus"></div>
            <div id="fryBarContainer"><div id="fryBar"></div></div>
            <div id="counterButtons">
                <button id="btnFinish" disabled>收好（×10）</button>
                <button id="btnCancel" disabled>放弃</button>
            </div>
        </div>

        <div id="rightTools"></div>
    </div>

    <div class="herb-row" id="herbRowBottom"></div>
</div>

<div id="modalOverlay">
    <div class="modal-box">
        <div class="modal-title" id="modalTitle">提示</div>
        <div class="modal-text" id="modalText"></div>
        <div id="manualContent" style="display:none;"></div>
        <button class="modal-btn" id="modalConfirm">确定</button>
    </div>
</div>

<script>
/* 图片路径：
   生药：images/herbs/药材名.png
   炮制品：images/herbs/processed/炮制品名.png
   工具：images/tools/工具key.png

*/

const TOOLS_LEFT = {

};

    ],

    '附子': [
        { type: 'tool', tool: 'fire', result: '炮附子', desc: '火烤后去皮切片' },
        { type: 'tool', tool: 'cut',  result: '附子(破八片)', desc: '切成8片' }
    ],
    '白术': [
        { type: 'tool', tool: 'fry', result: '炒白术', desc: '干锅炒至微黄' },

    ],

        { type: 'tool', tool: 'remove', result: '乌梅(去核)', desc: '去核取肉' }
    ],
    '蜀椒': [{ type: 'tool', tool: 'fry', result: '炒蜀椒', desc: '文火炒至出汗' }],
    '牡蛎': [{ type: 'tool', tool: 'fire', result: '煅牡蛎', desc: '煅烧' }],
    '水蛭': [{ type: 'tool', tool: 'fry', result: '炒水蛭', desc: '文火炒' }],
    '虻虫': [
        { type: 'tool', tool: 'fry', result: '炒虻虫', desc: '文火炒' },
        { type: 'tool', tool: 'peel', result: '虻虫(去翅足)', desc: '摘除翅足' }
    ],
    '芫花': [{ type: 'tool', tool: 'fry', result: '炒芫花', desc: '文火炒' }],
    '葶苈子': [{ type: 'tool', tool: 'fry', result: '炒葶苈子', desc: '文火炒' }],
    '巴豆': [{ type: 'tool', tool: 'fry', result: '巴豆霜', desc: '炒至焦黑' }],
    '桃仁': [{ type: 'tool', tool: 'peel', result: '桃仁(去皮尖)', desc: '剥皮去尖' }],
    '麦冬': [{ type: 'tool', tool: 'remove', result: '麦冬(去心)', desc: '抽去心部' }],
    '吴茱萸': [{ type: 'material', material: '清水', result: '洗吴茱萸', desc: '清水冲洗' }]

/* ===== 状态 ===== */
// 生药库存：初始每种 1 份
let inventory = JSON.parse(localStorage.getItem('herbInventory'));
if (!inventory || Object.keys(inventory).length === 0) {
    inventory = {
        '桂枝': 1, '麻黄': 1, '杏仁': 1, '甘草': 1, '芍药': 1,
        '生姜': 1, '大枣': 1, '葛根': 1, '细辛': 1, '干姜': 1,
        '五味子': 1, '半夏': 1, '柴胡': 1, '黄芩': 1, '人参': 1,
        '枳实': 1, '大黄': 1, '厚朴': 1, '茯苓': 1, '猪苓': 1,
        '泽泻': 1, '白术': 1, '知母': 1, '石膏': 1, '芒硝': 1,
        '附子': 1, '栀子': 1, '淡豆豉': 1, '饴糖': 1, '当归': 1,
        '通草': 1, '茵陈': 1, '黄连': 1, '粳米': 1
    };
    localStorage.setItem('herbInventory', JSON.stringify(inventory));
}
// 炮制品库存
let processedInventory = JSON.parse(localStorage.getItem('processedInventory') || '{}');
// 辅料库存
let materialInventory = JSON.parse(localStorage.getItem('materialInventory'));
if (!materialInventory || Object.keys(materialInventory).length === 0) {
    materialInventory = {};
    Object.keys(MATERIALS).forEach(k => { materialInventory[k] = 1; });
    localStorage.setItem('materialInventory', JSON.stringify(materialInventory));
}
let coins = parseInt(localStorage.getItem('playerCoins')) || 0;

function saveInventory() { localStorage.setItem('herbInventory', JSON.stringify(inventory)); }
function saveProcessed() { localStorage.setItem('processedInventory', JSON.stringify(processedInventory)); }
function saveMaterial() { localStorage.setItem('materialInventory', JSON.stringify(materialInventory)); }
function updateCoinDisplay() { document.getElementById('coinDisplay').textContent = '💰 ' + coins; }
function updateProcessedCount() {
    let total = 0;
    for (let v of Object.values(processedInventory)) total += v;
    document.getElementById('processedCount').textContent = '已炮制：' + total + ' 份';
}

const herbRowTop = document.getElementById('herbRowTop');
const herbRowBottom = document.getElementById('herbRowBottom');
const leftTools = document.getElementById('leftTools');
const rightTools = document.getElementById('rightTools');
const stageHerbImg = document.getElementById('stageHerbImg');
const stageEmoji = document.getElementById('stageEmoji');
const stage = document.getElementById('stage');
const counterHerb = document.getElementById('counterHerb');
const counterStatus = document.getElementById('counterStatus');
const fryBarContainer = document.getElementById('fryBarContainer');
const fryBar = document.getElementById('fryBar');
const btnFinish = document.getElementById('btnFinish');
const btnCancel = document.getElementById('btnCancel');
const modalOverlay = document.getElementById('modalOverlay');

let currentHerb = null;
let currentProcessed = null;
let isFrying = false;
let fryInterval = null;
let fryProgress = 0;
let fryRule = null;

function renderHerbRows() {
    const allHerbs = Object.keys(inventory).filter(n => inventory[n] > 0);
    const mid = Math.ceil(allHerbs.length / 2);
    const top = allHerbs.slice(0, mid);
    const bottom = allHerbs.slice(mid);
    renderRow(herbRowTop, top);
    renderRow(herbRowBottom, bottom);
}
function renderRow(rowEl, herbs) {
    rowEl.innerHTML = '';
    herbs.forEach(name => {
        const slot = document.createElement('div');
        slot.className = 'herb-slot';
        if (currentHerb === name) slot.classList.add('selected');
        slot.innerHTML = `
            <img src="images/herbs/${name}.png" onerror="this.style.display='none';">
            <span class="hname">${name}</span>
            <span class="hcount">x${inventory[name]}</span>
        `;
        slot.addEventListener('click', () => selectHerb(name));
        rowEl.appendChild(slot);
    });
    // 如果数量不足5个，补空位
    for (let i = herbs.length; i < 5; i++) {
        const slot = document.createElement('div');
        slot.className = 'herb-slot empty';
        slot.textContent = '空';
        rowEl.appendChild(slot);
    }
}

function renderTools() {
    leftTools.innerHTML = '';
    for (let key of Object.keys(TOOLS_LEFT)) {
        const tool = TOOLS_LEFT[key];
        const btn = document.createElement('div');
        btn.className = 'tool-btn';
        btn.innerHTML = `
            <img src="images/tools/${key}.png" onerror="this.style.display='none';this.nextElementSibling.style.display='block';">
            <span class="ticon" style="display:none;">${tool.icon}</span>
            <span>${tool.name}</span>
        `;
        btn.addEventListener('click', () => useTool(key));
        leftTools.appendChild(btn);
    }
    rightTools.innerHTML = '';
    for (let key of Object.keys(TOOLS_RIGHT)) {
        const tool = TOOLS_RIGHT[key];
        const btn = document.createElement('div');
        btn.className = 'tool-btn';
        btn.innerHTML = `
            <img src="images/tools/${key}.png" onerror="this.style.display='none';this.nextElementSibling.style.display='block';">
            <span class="ticon" style="display:none;">${tool.icon}</span>
            <span>${tool.name}</span>
        `;
        btn.addEventListener('click', () => useTool(key));
        rightTools.appendChild(btn);
    }
    for (let [name, info] of Object.entries(MATERIALS)) {
        const count = materialInventory[name] || 0;
        const btn = document.createElement('div');
        btn.className = 'material-btn' + (count <= 0 ? ' out' : '');
        btn.innerHTML = `
            <img src="images/materials/${name}.png" onerror="this.style.display='none';this.nextElementSibling.style.display='block';">
            <span class="ticon" style="display:none;">${info.icon}</span>
            <span>${name}</span>
            <span class="mcount">x${count}</span>
        `;
        btn.addEventListener('click', () => useMaterial(name));
        rightTools.appendChild(btn);
    }
}

function setStageHerb(name, isProcessed = false) {
    stageHerbImg.style.display = 'none';
    stageEmoji.style.display = 'none';
    stageHerbImg.src = '';
    if (!name) return;
    const p = isProcessed
        ? `images/herbs/processed/${name}.png`
        : `images/herbs/${name}.png`;
    stageHerbImg.src = p;
    stageHerbImg.style.display = 'block';
    stageHerbImg.onerror = function () {
        this.style.display = 'none';
        stageEmoji.style.display = 'block';
        stageEmoji.textContent = '🌿';
    };
    stageHerbImg.onload = function () {
        this.style.display = 'block';
        stageEmoji.style.display = 'none';
    };
}

function selectHerb(name) {
    if (isFrying) { showModal('提示', '正在炒制中，请先取出！'); return; }
    if (currentHerb) { showModal('提示', '操作台上已有药材。'); return; }
    if (inventory[name] <= 0) { showModal('提示', '库存不足！'); return; }

    inventory[name] -= 1;
    saveInventory();
    currentHerb = name;
    currentProcessed = null;
    setStageHerb(name, false);
    counterHerb.textContent = `生药：${name}`;

    // 检查是否无需炮制
    const rules = HERB_RULES[name] || [];
    const noneRule = rules.find(r => r.type === 'none');
    if (noneRule) {
        counterStatus.textContent = '无需炮制，直接点“收好”';
        btnFinish.disabled = false;
        btnCancel.disabled = false;
    } else {
        counterStatus.textContent = '请点击工具或辅料进行炮制';
        btnFinish.disabled = true;
        btnCancel.disabled = false;
    }
    renderHerbRows();
}

function useTool(key) {
    if (isFrying) { showModal('提示', '正在炒制中！'); return; }
    if (!currentHerb) { showModal('提示', '请先选择药材。'); return; }
    if (currentProcessed) { showModal('提示', '已经炮制过了，点“收好”。'); return; }

    const rules = HERB_RULES[currentHerb] || [];
    const rule = rules.find(r => r.type === 'tool' && r.tool === key);

    if (!rule) {
        const toolName = TOOLS_LEFT[key]?.name || TOOLS_RIGHT[key]?.name || key;
        showModal('提示', `【${currentHerb}】不能用【${toolName}】。`);
        return;
    }

    if (key === 'fry') { startFrying(rule); return; }

    playToolAnim(key, () => {
        currentProcessed = rule.result;
        setStageHerb(rule.result, true);
        counterHerb.textContent = `炮制品：${rule.result}`;
        counterStatus.textContent = rule.desc + ' ✅';
        btnFinish.disabled = false;
    });
}

function useMaterial(name) {
    if (isFrying) { showModal('提示', '正在炒制中！'); return; }
    if (!currentHerb) { showModal('提示', '请先选择药材。'); return; }
    if (currentProcessed) { showModal('提示', '已经炮制过了，点“收好”。'); return; }

    const rules = HERB_RULES[currentHerb] || [];
    const rule = rules.find(r => r.type === 'material' && r.material === name);

    if (!rule) { showModal('提示', `【${currentHerb}】不能用【${name}】。`); return; }
    if (!materialInventory[name] || materialInventory[name] <= 0) {
        showModal('辅料不足', `【${name}】已用完。`);
        return;
    }

    materialInventory[name] -= 1;
    saveMaterial();
    renderTools();

    playMaterialAnim(name, () => {
        currentProcessed = rule.result;
        setStageHerb(rule.result, true);
        counterHerb.textContent = `炮制品：${rule.result}`;
        counterStatus.textContent = rule.desc + ' ✅';
        btnFinish.disabled = false;
    });
}

function playToolAnim(key, callback) {
    const tool = TOOLS_LEFT[key] || TOOLS_RIGHT[key];
    const toolEl = document.createElement('div');
    toolEl.className = 'stage-anim';
    toolEl.textContent = tool.icon;
    toolEl.style.top = '-50px';
    toolEl.style.left = '50%';
    toolEl.style.transform = 'translateX(-50%)';
    toolEl.style.opacity = '0';
    stage.appendChild(toolEl);

    requestAnimationFrame(() => {
        toolEl.style.top = '8px'; toolEl.style.opacity = '1';
    });

    setTimeout(() => { stageHerbImg.classList.add('shake'); stageEmoji.classList.add('shake'); }, 350);
    setTimeout(() => {
        stageHerbImg.classList.remove('shake'); stageEmoji.classList.remove('shake');
        toolEl.style.top = '-50px'; toolEl.style.opacity = '0';
    }, 700);
    setTimeout(() => { toolEl.remove(); if (callback) callback(); }, 1100);
}

function playMaterialAnim(name, callback) {
    const info = MATERIALS[name];
    const matEl = document.createElement('div');
    matEl.className = 'stage-anim';
    matEl.textContent = info.icon;
    matEl.style.right = '-50px';
    matEl.style.top = '50%';
    matEl.style.opacity = '0';
    stage.appendChild(matEl);

    requestAnimationFrame(() => {
        matEl.style.right = '15px'; matEl.style.top = '30%'; matEl.style.opacity = '1';
    });

    setTimeout(() => { matEl.style.opacity = '0'; stageHerbImg.classList.add('shake'); stageEmoji.classList.add('shake'); }, 600);
    setTimeout(() => { stageHerbImg.classList.remove('shake'); stageEmoji.classList.remove('shake'); }, 1000);
    setTimeout(() => { matEl.remove(); if (callback) callback(); }, 1200);
}

function startFrying(rule) {
    isFrying = true; fryProgress = 0; fryRule = rule;
    fryBarContainer.style.display = 'block';
    counterHerb.textContent = `炒制中：${currentHerb}`;
    counterStatus.textContent = '火候：冷锅';
    fryBar.style.width = '0%';
    fryBar.style.background = '#ffeb3b';
    stageHerbImg.classList.add('shake');

    if (fryInterval) clearInterval(fryInterval);
    fryInterval = setInterval(() => {
        fryProgress += 1;
        if (fryProgress >= 100) {
            fryProgress = 100; fryBar.style.width = '100%';
            clearInterval(fryInterval);
            return;
        }
        fryBar.style.width = fryProgress + '%';
        if (fryProgress < 30) { fryBar.style.background = '#ffeb3b'; counterStatus.textContent = '火候：冷锅'; }
        else if (fryProgress < 60) { fryBar.style.background = '#ff9800'; counterStatus.textContent = '火候：炒黄 ✅'; }
        else if (fryProgress < 90) { fryBar.style.background = '#f44336'; counterStatus.textContent = '火候：炒焦 ⚠️'; }
        else { fryBar.style.background = '#333'; counterStatus.textContent = '火候：焦黑 ❌'; }
    }, 80);
}

function finishFry() {
    if (!isFrying) return;
    clearInterval(fryInterval);
    isFrying = false;
    stageHerbImg.classList.remove('shake');
    fryBarContainer.style.display = 'none';

    let result;
    if (fryProgress < 30) {
        result = null;
        counterHerb.textContent = `生药：${currentHerb}`;
        counterStatus.textContent = '火候不足，再炒一次。';
    } else if (fryProgress < 60) {
        result = fryRule.result;
        counterHerb.textContent = `炮制品：${result}`;
        counterStatus.textContent = '炒黄 ✅';
    } else if (fryProgress < 90) {
        result = '炒焦' + currentHerb;
        counterHerb.textContent = `炮制品：${result}`;
        counterStatus.textContent = '炒焦 ⚠️';
    } else {
        currentHerb = null; currentProcessed = null;
        setStageHerb(null);
        counterHerb.textContent = '药材已废弃';
        counterStatus.textContent = '❌ 焦黑，报废';
        btnFinish.disabled = true; btnCancel.disabled = true;
        fryProgress = 0;
        renderHerbRows();
        return;
    }

    if (result) {
        currentProcessed = result;
        setStageHerb(result, true);
        btnFinish.disabled = false;
    } else {
        currentProcessed = null;
        setStageHerb(currentHerb, false);
        btnFinish.disabled = true;
    }
    fryProgress = 0;
}

btnFinish.addEventListener('click', () => {
    // 如果正在炒制：先判断火候
    if (isFrying) {
        if (fryProgress < 30) {
            counterStatus.textContent = '火候不足，继续炒到炒黄再取出～';
            return;
        }
        finishFry();               // 停止炒制
        if (!currentHerb) return;  // 焦黑报废了，直接返回
    }

    if (!currentHerb) return;

    const resultName = currentProcessed || currentHerb;
    processedInventory[resultName] = (processedInventory[resultName] || 0) + 10;
    saveProcessed();
    updateProcessedCount();

    currentHerb = null; currentProcessed = null;
    setStageHerb(null);
    counterHerb.textContent = '请选择药材';
    counterStatus.textContent = '';
    btnFinish.disabled = true;
    btnCancel.disabled = true;
    renderHerbRows();
});

btnCancel.addEventListener('click', () => {
    if (isFrying) {
        clearInterval(fryInterval); isFrying = false;
        stageHerbImg.classList.remove('shake');
        fryBarContainer.style.display = 'none';
    }
    if (currentHerb) {
        inventory[currentHerb] = (inventory[currentHerb] || 0) + 1;
        saveInventory();
    }
    currentHerb = null; currentProcessed = null;
    setStageHerb(null);
    counterHerb.textContent = '请选择药材';
    counterStatus.textContent = '';
    btnFinish.disabled = true;
    btnCancel.disabled = true;
    renderHerbRows();
});

document.getElementById('btnManual').addEventListener('click', () => {
    let html = '<h4>🌿 药材炮制指南</h4>';
    for (let [herb, rules] of Object.entries(HERB_RULES)) {
        let parts = rules.map(r => {
            if (r.type === 'none') return `${r.result}（无需炮制）`;
            if (r.type === 'tool') { const t = TOOLS_LEFT[r.tool] || TOOLS_RIGHT[r.tool]; return `${t.icon}${t.name}→${r.result}（${r.desc}）`; }
            if (r.type === 'material') return `${MATERIALS[r.material].icon}${r.material}→${r.result}（${r.desc}）`;
            return r.result;
        });
        html += `<div><b>${herb}</b>：${parts.join('；')}</div>`;
    }
    showModal('炮制说明书', html, true);
});

function showModal(title, text, isManual = false) {
    document.getElementById('modalTitle').textContent = title;
    const mt = document.getElementById('modalText');
    const mc = document.getElementById('manualContent');
    if (isManual) { mt.style.display = 'none'; mc.style.display = 'block'; mc.innerHTML = text; }
    else { mt.style.display = 'block'; mc.style.display = 'none'; mt.textContent = text; }
    modalOverlay.classList.add('active');
}
document.getElementById('modalConfirm').addEventListener('click', () => modalOverlay.classList.remove('active'));

function init() {
    renderHerbRows();
    renderTools();
    updateProcessedCount();
    updateCoinDisplay();
    setStageHerb(null);
}
init();
</script>
</body>
</html>
