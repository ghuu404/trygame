<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>炮制饮片 - 重生之我是赤脚医生</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: sans-serif;
    user-select: none;
    overflow: hidden;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: #f5f0e8;
}
/* ===== 顶部栏 ===== */
#topBar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 10px;
    background: #33691e;
    color: #fff;
    font-size: 13px;
    font-weight: bold;
    flex-shrink: 0;
    gap: 6px;
}
#topBar .left, #topBar .right { display: flex; gap: 6px; align-items: center; }
.top-btn {
    background: #aed581;
    border: 2px solid #fff;
    border-radius: 14px;
    padding: 3px 10px;
    font-size: 12px;
    font-weight: bold;
    color: #33691e;
    cursor: pointer;
    text-decoration: none;
    white-space: nowrap;
}
.top-btn:active { transform: scale(0.95); }
#orderInfo {
    font-size: 12px;
    background: rgba(255,255,255,0.2);
    padding: 3px 10px;
    border-radius: 10px;
    cursor: pointer;
    max-width: 170px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}
/* ===== 主体 ===== */
#main {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 4px;
    gap: 4px;
    overflow: hidden;
}
/* 药材栏（上/下各5个框，加大） */
.herb-row {
    display: flex;
    gap: 6px;
    padding: 4px;
    flex-shrink: 0;
    justify-content: center;
    overflow-x: auto;
}
.herb-slot {
    width: 74px;
    height: 82px;
    background: #e8d5c0;
    border: 2px solid #8b5e3c;
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 11px;
    font-weight: bold;
    color: #3a2a1a;
    flex-shrink: 0;
    position: relative;
    overflow: hidden;
    transition: all 0.15s;
}
.herb-slot:active { transform: scale(0.94); }
.herb-slot img {
    width: 42px;
    height: 42px;
    object-fit: contain;
    pointer-events: none;
}
.herb-slot .hname {
    font-size: 11px;
    margin-top: 2px;
    text-align: center;
    line-height: 1;
    pointer-events: none;
    white-space: nowrap;
}
.herb-slot .hcount {
    position: absolute;
    top: 2px;
    right: 4px;
    font-size: 10px;
    color: #c62828;
    background: rgba(255,255,255,0.85);
    border-radius: 6px;
    padding: 0 4px;
    pointer-events: none;
}
.herb-slot.empty {
    background: #d0c0b0;
    border-style: dashed;
    color: #999;
    cursor: default;
}
.herb-slot.selected {
    border-color: #ff8c00;
    box-shadow: 0 0 8px #ff8c00;
}
/* ===== 操作区：左工具 - 中操作台 - 右炒制+辅料 ===== */
#workArea {
    flex: 1;
    display: flex;
    background: rgba(255,255,255,0.5);
    border-radius: 12px;
    border: 2px solid #b89a72;
    padding: 6px;
    gap: 6px;
    min-height: 0;
    overflow: hidden;
    justify-content: center;
}
/* 左侧切制工具（加大） */
#leftTools {
    display: flex;
    flex-direction: column;
    gap: 5px;
    width: 84px;
    overflow-y: auto;
    flex-shrink: 0;
    padding-right: 2px;
}
/* 右侧炒制工具 + 辅料（加大） */
#rightTools {
    display: flex;
    flex-direction: column;
    gap: 5px;
    width: 84px;
    overflow-y: auto;
    flex-shrink: 0;
    padding-right: 2px;
}
#leftTools::-webkit-scrollbar, #rightTools::-webkit-scrollbar { width: 4px; }
#leftTools::-webkit-scrollbar-thumb, #rightTools::-webkit-scrollbar-thumb {
    background: #b89a72; border-radius: 2px;
}
.tool-btn, .material-btn {
    width: 78px;
    min-height: 56px;
    background: #fff;
    border: 2px solid #8b5e3c;
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 11px;
    font-weight: bold;
    color: #5a3e2b;
    flex-shrink: 0;
    padding: 2px;
    transition: all 0.15s;
    line-height: 1.1;
    text-align: center;
}
.tool-btn:active, .material-btn:active { transform: scale(0.94); }
.tool-btn img, .material-btn img {
    width: 30px;
    height: 30px;
    object-fit: contain;
    pointer-events: none;
}
.tool-btn .ticon, .material-btn .ticon {
    font-size: 24px;
    line-height: 1;
    pointer-events: none;
}
/* 操作台（大桌子，缩小尺寸） */
#counter {
    flex: 0 0 320px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #f0e6d8;
    border-radius: 10px;
    border: 2px dashed #b89a72;
    position: relative;
    padding: 6px;
    min-width: 0;
    overflow: hidden;
}
#stage {
    position: relative;
    width: 100px;
    height: 100px;
    display: flex;
    align-items: center;
    justify-content: center;
}
#stageHerbImg {
    max-width: 88px;
    max-height: 88px;
    object-fit: contain;
    transition: all 0.3s;
    z-index: 2;
}
#stageEmoji {
    font-size: 50px;
    z-index: 2;
}
.stage-anim {
    position: absolute;
    z-index: 5;
    pointer-events: none;
    font-size: 32px;
    transition: all 0.4s ease-in-out;
}
#counterHerb {
    font-size: 14px;
    font-weight: bold;
    color: #5a3e2b;
    text-align: center;
    margin-top: 3px;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}
#counterStatus {
    font-size: 11px;
    color: #888;
    text-align: center;
    min-height: 14px;
}
#fryBarContainer {
    width: 90%;
    height: 14px;
    background: #ddd;
    border-radius: 7px;
    margin-top: 5px;
    overflow: hidden;
    display: none;
    position: relative;
}
#fryBar { height: 100%; width: 0%; background: #ffeb3b; transition: width 0.1s linear, background 0.2s; }
#fryMarks {
    position: absolute;
    inset: 0;
    display: flex;
    justify-content: space-between;
    pointer-events: none;
}
#fryMarks span {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 2px;
    background: rgba(0,0,0,0.3);
}
#counterButtons {
    display: flex;
    gap: 5px;
    margin-top: 5px;
}
#btnTakeOut, #btnToPlate {
    padding: 4px 12px;
    font-size: 12px;
    font-weight: bold;
    border-radius: 12px;
    cursor: pointer;
    border: 2px solid #558b2f;
    background: #aed581;
    color: #33691e;
}
#btnTakeOut { display: none; }
#btnToPlate:disabled { opacity: 0.4; cursor: not-allowed; }
/* 盘子区域 */
#plateArea {
    background: #5a3e2b;
    border-radius: 10px;
    padding: 5px 8px;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
    min-height: 70px;
}
#plateLabel {
    color: #fff;
    font-size: 12px;
    font-weight: bold;
    flex-shrink: 0;
    writing-mode: vertical-rl;
    text-orientation: upright;
    letter-spacing: 1px;
}
#plate {
    flex: 1;
    display: flex;
    gap: 4px;
    overflow-x: auto;
    min-height: 54px;
    align-items: center;
    background: #6b4c35;
    border-radius: 8px;
    padding: 4px;
    border: 1px dashed #b89a72;
}
.plate-item {
    width: 52px;
    height: 56px;
    background: #e8d5c0;
    border-radius: 6px;
    border: 1px solid #8b5e3c;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    position: relative;
    font-size: 9px;
    color: #3a2a1a;
    overflow: hidden;
    transition: transform 0.15s;
}
.plate-item:active { transform: scale(0.9); }
.plate-item img {
    width: 34px;
    height: 34px;
    object-fit: contain;
    pointer-events: none;
}
.plate-item .pname {
    font-size: 8px;
    line-height: 1;
    text-align: center;
    pointer-events: none;
    white-space: nowrap;
    max-width: 50px;
    overflow: hidden;
    text-overflow: ellipsis;
}
.plate-item .pemoji {
    font-size: 24px;
    line-height: 1;
}
#btnPackage {
    padding: 9px 18px;
    font-size: 14px;
    font-weight: bold;
    background: #aed581;
    border: 2px solid #33691e;
    border-radius: 16px;
    color: #33691e;
    cursor: pointer;
    flex-shrink: 0;
}
#btnPackage:active { transform: scale(0.95); }
/* ===== 动画 ===== */
@keyframes herbShake {
    0%, 100% { transform: translateX(0) rotate(0); }
    20% { transform: translateX(-5px) rotate(-4deg); }
    40% { transform: translateX(5px) rotate(4deg); }
    60% { transform: translateX(-4px) rotate(-3deg); }
    80% { transform: translateX(4px) rotate(3deg); }
}
@keyframes fryShake {
    0%, 100% { transform: translate(0, 0) rotate(0); }
    25% { transform: translate(-4px, -2px) rotate(-6deg); }
    50% { transform: translate(4px, 2px) rotate(6deg); }
    75% { transform: translate(-2px, 1px) rotate(-3deg); }
}
.shake { animation: herbShake 0.4s; }
.frying { animation: fryShake 0.4s infinite; }
/* 药包弹窗 */
#bagModal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
}
#bagModal.active { display: flex; }
.bag-box {
    background: #f5f0e8;
    border-radius: 20px;
    padding: 20px;
    text-align: center;
    width: 80%;
    max-width: 300px;
    border: 3px solid #558b2f;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    animation: bagPop 0.4s ease-out;
}
@keyframes bagPop {
    0% { transform: scale(0.3); opacity: 0; }
    60% { transform: scale(1.1); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
}
.bag-box img {
    width: 120px;
    height: 120px;
    object-fit: contain;
}
.bag-emoji { font-size: 70px; }
.bag-name {
    font-size: 20px;
    font-weight: bold;
    color: #33691e;
    margin: 8px 0;
}
.bag-herbs {
    font-size: 12px;
    color: #666;
    margin-bottom: 12px;
    line-height: 1.5;
}
/* 通用弹窗 */
#modalOverlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.65);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 999;
}
#modalOverlay.active { display: flex; }
.modal-box {
    background: #f5f0e8;
    border-radius: 20px;
    padding: 20px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    width: 85%;
    max-width: 360px;
    max-height: 80vh;
    overflow-y: auto;
    border: 3px solid #558b2f;
}
.modal-title {
    font-size: 20px;
    font-weight: bold;
    color: #33691e;
    margin-bottom: 10px;
}
.modal-text {
    font-size: 14px;
    color: #666;
    margin-bottom: 16px;
    text-align: left;
    white-space: pre-wrap;
    line-height: 1.6;
}
.modal-btn {
    display: block;
    width: 100%;
    font-size: 16px;
    font-weight: bold;
    padding: 10px;
    margin: 6px 0;
    border: 2px solid #558b2f;
    border-radius: 12px;
    background: #aed581;
    color: #33691e;
    cursor: pointer;
}
.modal-btn:active { transform: scale(0.96); }
#manualContent {
    text-align: left;
    font-size: 12px;
    line-height: 1.7;
    max-height: 55vh;
    overflow-y: auto;
}
#manualContent h4 {
    color: #33691e;
    margin: 8px 0 4px;
    border-bottom: 1px solid #ccc;
    padding-bottom: 2px;
}
</style>
</head>
<body>

<div id="topBar">
    <div class="left">
        <a class="top-btn" href="index.html">← 返回</a>
        <button class="top-btn" id="btnManual">📖 说明书</button>
    </div>
    <div id="orderInfo" title="点击查看当前订单">订单：<span id="orderName">—</span></div>
    <div class="right">
        <div class="top-btn" id="coinDisplay">💰 0</div>
    </div>
</div>

<div id="main">
    <div class="herb-row" id="herbRowTop"></div>

    <div id="workArea">
        <div id="leftTools"></div>

        <div id="counter">
            <div id="stage">
                <img id="stageHerbImg" style="display:none;">
                <span id="stageEmoji" style="display:none;">🌿</span>
            </div>
            <div id="counterHerb">请选择药材</div>
            <div id="counterStatus"></div>
            <div id="fryBarContainer">
                <div id="fryBar"></div>
                <div id="fryMarks"></div>
            </div>
            <div id="counterButtons">
                <button id="btnTakeOut">取出</button>
                <button id="btnToPlate" disabled>放到盘子</button>
            </div>
        </div>

        <div id="rightTools"></div>
    </div>

    <div class="herb-row" id="herbRowBottom"></div>

    <div id="plateArea">
        <div id="plateLabel">药盘</div>
        <div id="plate"></div>
        <button id="btnPackage">包药</button>
    </div>
</div>

<div id="bagModal">
    <div class="bag-box">
        <img id="bagImg" src="images/medicine-bag.png" onerror="this.style.display='none';this.nextElementSibling.style.display='block';">
        <div class="bag-emoji" style="display:none;">🎁</div>
        <div class="bag-name" id="bagName">麻黄汤</div>
        <div class="bag-herbs" id="bagHerbs"></div>
        <button class="modal-btn" id="bagConfirm">收入药柜</button>
    </div>
</div>

<div id="modalOverlay">
    <div class="modal-box">
        <div class="modal-title" id="modalTitle">提示</div>
        <div class="modal-text" id="modalText"></div>
        <div id="manualContent" style="display:none;"></div>
        <button class="modal-btn" id="modalConfirm">确定</button>
    </div>
</div>

<script>
/* ============================================================
   图片路径约定：
   images/herbs/药材名.png
   images/herbs/processed/炮制品名.png
   images/tools/工具key.png
   images/materials/辅料名.png
   images/medicine-bag.png
   ============================================================ */

const TOOLS_LEFT = {
    cut:    { name: '切刀', icon: '🔪' },
    scrape: { name: '刮刀', icon: '🪒' },
    peel:   { name: '镊子', icon: '🥢' },
    remove: { name: '针挑', icon: '📌' },

const MATERIALS = {

    '盐水':    { icon: '🧂' },
    '蜂蜜':    { icon: '🍯' },
    '姜汁':    { icon: '🫚' },
    '醋':      { icon: '🍾' },
    '清水':    { icon: '💧' },
    '白矾':    { icon: '⬜' },
    '麦麸':    { icon: '🌾' },
    '米泔水':  { icon: '🍚' },
    '甘草水':  { icon: '🍵' },
    '石灰水':  { icon: '🥛' },
    '黑豆汁':  { icon: '🫘' }
};

const HERB_RULES = {
    '桂枝': [
        { type: 'tool', tool: 'scrape', result: '桂枝(去皮)', desc: '刮去粗皮' },
        { type: 'tool', tool: 'cut',    result: '桂枝(切片)', desc: '切片' }
    ],
    '茯苓': [{ type: 'none', result: '茯苓', desc: '无需炮制' }],

    '黄连': [{ type: 'none', result: '黄连', desc: '无需炮制' }],
    '人参': [{ type: 'none', result: '人参', desc: '无需炮制' }],

    '厚朴': [
        { type: 'material', material: '姜汁', result: '姜炙厚朴', desc: '姜汁拌炒' },
        { type: 'tool', tool: 'scrape', result: '厚朴(去皮)', desc: '刮去粗皮' }
    ],
    '枳实': [
        { type: 'tool', tool: 'fry', result: '炒枳实', desc: '水浸→去瓤→炒黄' },
        { type: 'tool', tool: 'cut', result: '枳实(切片)', desc: '切片' }
    ],
    '猪苓': [{ type: 'tool', tool: 'scrape', result: '猪苓(去皮)', desc: '刮去外皮' }],
    '麻黄': [{ type: 'tool', tool: 'remove', result: '麻黄(去节)', desc: '摘除节部' }],
    '杏仁': [
        { type: 'tool', tool: 'peel', result: '杏仁(去皮尖)', desc: '剥皮去尖' },
        { type: 'tool', tool: 'fry',  result: '炒杏仁', desc: '炒至表面焦黑' }
    ],
    '柴胡': [{ type: 'none', result: '柴胡', desc: '无需炮制' }],

    ],
    '栀子': [

        { type: 'tool', tool: 'fry', result: '炒栀子', desc: '炒至焦黄' }
    ],
