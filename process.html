<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>炮制药材 - 重生之我是赤脚医生</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box;
    font-family: "KaiTi", "STKaiti", "楷体", "Kaiti SC", serif; }
html, body { width: 100%; height: 100%; overflow: hidden; }
body {
    user-select: none;
    background: #f5f0e8;
    display: flex;
    flex-direction: column;
}
#topBar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px 10px; background: #33691e; color: #fff;
    font-size: 13px; font-weight: bold; flex-shrink: 0; gap: 6px;
}
.top-btn {
    background: #aed581; border: 2px solid #fff;
    border-radius: 14px; padding: 4px 10px;
    font-size: 12px; font-weight: bold;
    color: #33691e; cursor: pointer; text-decoration: none;
    white-space: nowrap;
}
#coinDisplay {
    background: #aed581; border: 2px solid #fff; border-radius: 14px;
    padding: 4px 10px; font-size: 12px; color: #33691e;
    display: flex; align-items: center;
}
#main {
    flex: 1; display: flex; flex-direction: column;
    padding: 4px; gap: 4px; overflow: hidden; min-height: 0;
}
.herb-row {
    display: flex; gap: 6px;
    padding: 4px 16px;
    flex-shrink: 0;
    justify-content: flex-start;
    overflow-x: auto;
    scroll-padding: 16px;
    height: 100px;
}
.herb-slot {
    width: 76px; height: 86px;
    background: #e8d5c0; border: 2px solid #8b5e3c;
    border-radius: 10px;
    display: flex; flex-direction: column;
    align-items: flex-end; justify-content: flex-end;
    cursor: pointer; font-size: 11px; font-weight: bold;
    color: #3a2a1a; flex-shrink: 0; position: relative;
    overflow: hidden; transition: all 0.15s; padding-bottom: 3px;
}
.herb-slot img {
    width: 42px; height: 42px; object-fit: contain;
    position: absolute; top: 6px; left: 50%;
    transform: translateX(-50%); pointer-events: none;
}
.herb-slot .hname { font-size: 11px; text-align: center; width: 100%; }
.herb-slot .hcount {
    position: absolute; top: 2px; right: 4px; font-size: 10px; color: #c62828;
    background: rgba(255,255,255,0.85); border-radius: 6px; padding: 0 4px;
}
.herb-slot.empty { background: #d0c0b0; border-style: dashed; color: #999; cursor: default; }
.herb-slot.selected { border-color: #ff8c00; box-shadow: 0 0 8px #ff8c00; }

#workArea {
    flex: 1; display: flex;
    background: rgba(255,255,255,0.5);
    border-radius: 10px; border: 2px solid #b89a72;
    padding: 6px; gap: 6px;
    min-height: 0; overflow: hidden;
    justify-content: center;
}
#leftTools, #rightTools {
    display: flex; flex-direction: column; gap: 6px;
    width: 24%; overflow-y: auto; flex-shrink: 0;
    padding-right: 2px;
}
.tool-btn, .material-btn {
    width: 100%; min-height: 56px;
    background: #fff; border: 2px solid #8b5e3c;
    border-radius: 10px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    cursor: pointer; font-size: 11px; font-weight: bold;
    color: #5a3e2b; flex-shrink: 0; padding: 3px;
    transition: all 0.15s; line-height: 1.1;
    text-align: center; position: relative;
}
.tool-btn img, .material-btn img {
    width: 28px; height: 28px; object-fit: contain;
    pointer-events: none;
}
.tool-btn .ticon, .material-btn .ticon { font-size: 22px; line-height: 1; }
.material-btn .mcount {
    position: absolute; top: 2px; right: 4px; font-size: 10px; color: #c62828;
    background: rgba(255,255,255,0.85); border-radius: 6px; padding: 0 4px;
}
.material-btn.out { opacity: 0.4; cursor: not-allowed; }

#counter {
    flex: 0 0 42%;
    max-width: 42%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: #f0e6d8; border-radius: 10px;
    border: 2px dashed #b89a72;
    padding: 10px; min-width: 0; overflow: hidden;
    gap: 6px;
}
#stage {
    position: relative;
    width: 100px; height: 100px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
}
#stageHerbImg {
    max-width: 90px; max-height: 90px;
    object-fit: contain; transition: all 0.3s; z-index: 2;
}
#stageEmoji { font-size: 56px; z-index: 2; }
.stage-anim {
    position: absolute; z-index: 5; pointer-events: none;
    font-size: 32px; transition: all 0.4s ease-in-out;
}
#counterHerb {
    font-size: 14px; font-weight: bold; color: #5a3e2b;
    text-align: center; width: 100%;
    overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap;
}
#counterStatus {
    font-size: 12px; color: #888; text-align: center;
    width: 100%; min-height: 16px;
}
#fryBarContainer {
    width: 90%; height: 12px; background: #ddd; border-radius: 6px;
    overflow: hidden; display: none; position: relative;
}
#fryBar { height: 100%; width: 0%; background: #ffeb3b; transition: width 0.1s linear; }
#counterButtons {
    display: flex; gap: 8px; justify-content: center; width: 100%;
}
#btnFinish, #btnCancel {
    padding: 6px 14px; font-size: 13px; font-weight: bold;
    border-radius: 10px; cursor: pointer;
    border: 2px solid #558b2f;
    background: #aed581; color: #33691e;
    font-family: inherit;
}
#btnCancel { background: #e0e0e0; border-color: #999; color: #555; }
#btnFinish:disabled, #btnCancel:disabled { opacity: 0.4; cursor: not-allowed; }

@keyframes herbShake {
    0%, 100% { transform: translateX(0) rotate(0); }
    20% { transform: translateX(-5px) rotate(-4deg); }
    40% { transform: translateX(5px) rotate(4deg); }
    60% { transform: translateX(-4px) rotate(-3deg); }
    80% { transform: translateX(4px) rotate(3deg); }
}
.shake { animation: herbShake 0.4s; }

#modalOverlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.65);
    display: none; align-items: center; justify-content: center;
    z-index: 999;
}
#modalOverlay.active { display: flex; }
.modal-box {
    background: #f5f0e8; border-radius: 20px;
    padding: 16px; text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    width: 88%; max-width: 420px;
    max-height: 80vh; overflow-y: auto;
    border: 3px solid #558b2f;
}
.modal-title { font-size: 18px; font-weight: bold; color: #33691e; margin-bottom: 8px; }
.modal-text {
    font-size: 13px; color: #666; margin-bottom: 12px;
    text-align: left; white-space: pre-wrap; line-height: 1.5;
}
.modal-btn {
    display: block; width: 100%; font-size: 15px; font-weight: bold;
    padding: 8px; margin: 4px 0; border: 2px solid #558b2f;
    border-radius: 10px; background: #aed581; color: #33691e;
    cursor: pointer; font-family: inherit;
}
#manualContent {
    text-align: left; font-size: 12px; line-height: 1.6;
    max-height: 55vh; overflow-y: auto;
}
#manualContent h4 {
    color: #33691e; margin: 6px 0 4px;
    border-bottom: 1px solid #ccc; padding-bottom: 2px;
}
#shopGrid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin: 10px 0;
}
.shop-card {
    background: #f0e6d8;
    border: 2px solid #aed581;
    border-radius: 14px;
    padding: 10px 6px;
    display: flex; flex-direction: column;
    align-items: center; gap: 4px;
}
.shop-card img { width: 50px; height: 50px; object-fit: contain; }
.shop-card .shop-icon { font-size: 40px; line-height: 1; }
.shop-card .shop-name { font-size: 14px; font-weight: bold; color: #33691e; }
.shop-card .shop-price { font-size: 13px; font-weight: bold; color: #c62828; }
.shop-card .shop-buy {
    width: 100%; padding: 6px 0;
    border: 2px solid #558b2f; border-radius: 18px;
    background: #aed581; color: #33691e;
    font-weight: bold; font-size: 13px;
    cursor: pointer; font-family: inherit;
}
.shop-card .shop-stock { font-size: 11px; color: #777; }
</style>

/* ===== 仓库系统 ===== */
var WAREHOUSE_KEY = 'warehouse';
function getWarehouse() {
    try {
        return JSON.parse(localStorage.getItem(WAREHOUSE_KEY)) ||
            { herbs: {}, seeds: {}, materials: {}, processed: {} };
    } catch(e) {
        return { herbs: {}, seeds: {}, materials: {}, processed: {} };
    }
}
function saveWarehouse(w) {
    localStorage.setItem(WAREHOUSE_KEY, JSON.stringify(w));
}

var warehouse = getWarehouse();
var inventory = warehouse.herbs;
var materialInventory = warehouse.materials;
var processedInventory = warehouse.processed;

function saveInventory() { warehouse.herbs = inventory; saveWarehouse(warehouse); }
function saveMaterial()  { warehouse.materials = materialInventory; saveWarehouse(warehouse); }
function saveProcessed() { warehouse.processed = processedInventory; saveWarehouse(warehouse); }

function getCoins() { return parseInt(localStorage.getItem('coins') || 0); }
function setCoins(n) { localStorage.setItem('coins', String(n)); }
function updateCoinDisplay() {
    var el = document.getElementById('coinText');
    if (el) el.textContent = getCoins();
}

/* ===== 渲染药材栏 ===== */
function renderHerbRows() {
    var allHerbs = Object.keys(inventory)
        .filter(function(n) { return inventory[n] > 0; })
        .sort();
    var mid = Math.ceil(allHerbs.length / 2);
    renderRow(herbRowTop, allHerbs.slice(0, mid));
    renderRow(herbRowBottom, allHerbs.slice(mid));
}
function renderRow(rowEl, herbs) {
    rowEl.innerHTML = '';
    if (herbs.length === 0) {
        var slot = document.createElement('div');
        slot.className = 'herb-slot empty';
        slot.textContent = '仓库暂无药材，先去采药吧';
        slot.style.width = '100%';
        rowEl.appendChild(slot);
        return;
    }
    herbs.forEach(function(name) {
        var slot = document.createElement('div');
        slot.className = 'herb-slot';
        if (currentHerb === name) slot.classList.add('selected');
        slot.innerHTML =
            '<img src="images/herbs/' + name + '.webp" onerror="this.style.display=\'none\';">' +
            '<span class="hname">' + name + '</span>' +
            '<span class="hcount">x' + inventory[name] + '</span>';
        slot.addEventListener('click', function() { selectHerb(name); });
        rowEl.appendChild(slot);
    });
}

/* ===== 渲染工具与辅料 ===== */
function renderTools() {
    leftTools.innerHTML = '';
    Object.keys(TOOLS_LEFT).forEach(function(key) {
        var tool = TOOLS_LEFT[key];
        var btn = document.createElement('div');
        btn.className = 'tool-btn';
        btn.innerHTML =
            '<img src="images/tools/' + key + '.webp" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'block\';">' +
            '<span class="ticon" style="display:none;">' + tool.icon + '</span>' +
            '<span>' + tool.name + '</span>';
        btn.addEventListener('click', function() { useTool(key); });
        leftTools.appendChild(btn);
    });

    rightTools.innerHTML = '';
    Object.keys(TOOLS_RIGHT).forEach(function(key) {
        var tool = TOOLS_RIGHT[key];
        var btn = document.createElement('div');
        btn.className = 'tool-btn';
        btn.innerHTML =
            '<img src="images/tools/' + key + '.webp" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'block\';">' +
            '<span class="ticon" style="display:none;">' + tool.icon + '</span>' +
            '<span>' + tool.name + '</span>';
        btn.addEventListener('click', function() { useTool(key); });
        rightTools.appendChild(btn);
    });

    Object.keys(MATERIALS).forEach(function(name) {
        var info = MATERIALS[name];
        var count = materialInventory[name] || 0;
        var btn = document.createElement('div');
        btn.className = 'material-btn' + (count <= 0 ? ' out' : '');
        btn.innerHTML =
            '<img src="images/materials/' + name + '.webp" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'block\';">' +
            '<span class="ticon" style="display:none;">' + info.icon + '</span>' +
            '<span>' + name + '</span>' +
            '<span class="mcount">x' + count + '</span>';
        btn.addEventListener('click', function() { useMaterial(name); });
        rightTools.appendChild(btn);
    });
}

/* ===== 舞台显示 ===== */
function setStageHerb(name, isProcessed) {
    stageHerbImg.style.display = 'none';
    stageEmoji.style.display = 'none';
    stageHerbImg.src = '';
    if (!name) return;

    var primary = isProcessed
        ? 'images/herbs/processed/' + name + '.webp'
        : 'images/herbs/' + name + '.webp';
    var fallback = 'images/herbs/' + name.replace(/\(.*?\)/g, '').replace(/^(炒|煅|炮|姜炙|盐炙|酒炙|酒洗|酒浸|醋|汤洗|矾制|蜜炙|洗)/, '') + '.webp';

    stageHerbImg.src = primary;
    stageHerbImg.style.display = 'block';

    var tried = false;
    stageHerbImg.onerror = function() {
        if (!tried && isProcessed && fallback && fallback !== primary) {
            tried = true;
            this.src = fallback;
            return;
        }
        this.style.display = 'none';
        stageEmoji.style.display = 'block';
        stageEmoji.textContent = '🌿';
    };
    stageHerbImg.onload = function() {
        this.style.display = 'block';
        stageEmoji.style.display = 'none';
    };
}

/* ===== 选择药材 ===== */
function selectHerb(name) {
    if (isFrying) { showModal('提示', '正在炒制中，请先取出！'); return; }
    if (currentHerb) { showModal('提示', '操作台上已有药材。'); return; }
    if (inventory[name] <= 0) { showModal('提示', '库存不足！'); return; }

    inventory[name] -= 1;
    saveInventory();
    currentHerb = name;
    currentProcessed = null;
    multiStepIndex = 0;
    setStageHerb(name, false);
    counterHerb.textContent = '生药：' + name;

    // 多步药材
    if (MULTI_STEP_HERBS[name]) {
        var config = MULTI_STEP_HERBS[name];
        counterStatus.textContent = '第1步：' + config.steps[0].desc;
        btnFinish.disabled = true;
        btnCancel.disabled = false;
        renderHerbRows();
        return;
    }

    // 单步或无炮制
    var rules = HERB_RULES[name] || [];
    var noneRule = null;
    for (var i = 0; i < rules.length; i++) {
        if (rules[i].type === 'none') { noneRule = rules[i]; break; }
    }
    if (noneRule) {
        counterStatus.textContent = '无需炮制，直接点"收好"';
        btnFinish.disabled = false;
        btnCancel.disabled = false;
    } else {
        counterStatus.textContent = '请点击工具或辅料进行炮制';
        btnFinish.disabled = true;
        btnCancel.disabled = false;
    }
    renderHerbRows();
}

/* ===== 使用工具 ===== */
function useTool(key) {
    if (isFrying) { showModal('提示', '正在炒制中！'); return; }
    if (!currentHerb) { showModal('提示', '请先选择药材。'); return; }
    if (currentProcessed) { showModal('提示', '已经炮制完成了，点"收好"。'); return; }

    // 多步药材中途不能改工具
    if (MULTI_STEP_HERBS[currentHerb]) {
        var config = MULTI_STEP_HERBS[currentHerb];
        var step = config.steps[multiStepIndex];
        if (step && step.type !== 'tool') {
            showModal('提示', '当前第' + (multiStepIndex + 1) + '步需要辅料：' + step.desc);
        }
        return;
    }

    var rules = HERB_RULES[currentHerb] || [];
    var rule = null;
    for (var i = 0; i < rules.length; i++) {
        if (rules[i].type === 'tool' && rules[i].tool === key) { rule = rules[i]; break; }
    }

    if (!rule) {
        var toolName = (TOOLS_LEFT[key] && TOOLS_LEFT[key].name) ||
                       (TOOLS_RIGHT[key] && TOOLS_RIGHT[key].name) || key;
        showModal('提示', '【' + currentHerb + '】不能用【' + toolName + '】。');
        return;
    }
    if (key === 'fry') { startFrying(rule); return; }

    playToolAnim(key, function() {
        currentProcessed = rule.result;
        setStageHerb(rule.result, true);
        counterHerb.textContent = '炮制品：' + rule.result;
        counterStatus.textContent = rule.desc + ' ✅';
        btnFinish.disabled = false;
    });
}

/* ===== 使用辅料 ===== */
function useMaterial(name) {
    if (isFrying) { showModal('提示', '正在炒制中！'); return; }
    if (!currentHerb) { showModal('提示', '请先选择药材。'); return; }
    if (currentProcessed) { showModal('提示', '已经炮制完成了，点"收好"。'); return; }

    // 多步药材
    if (MULTI_STEP_HERBS[currentHerb]) {
        var config = MULTI_STEP_HERBS[currentHerb];
        var step = config.steps[multiStepIndex];
        if (!step) { showModal('提示', '所有步骤已完成。'); return; }
        if (step.type !== 'material' || step.material !== name) {
            showModal('提示', '当前第' + (multiStepIndex + 1) + '步需要：' + step.desc);
            return;
        }
        if (!materialInventory[name] || materialInventory[name] <= 0) {
            showModal('辅料不足', '【' + name + '】已用完。\n请点击顶部"🛒 购买辅料"补充。');
            return;
        }

        materialInventory[name] -= 1;
        saveMaterial();
        renderTools();

        playMaterialAnim(name, function() {
            multiStepIndex++;
            if (multiStepIndex >= config.steps.length) {
                currentProcessed = config.finalResult;
                setStageHerb(config.finalResult, true);
                counterHerb.textContent = '炮制品：' + config.finalResult;
                counterStatus.textContent = '炮制完成 ✅';
                btnFinish.disabled = false;
            } else {
                var next = config.steps[multiStepIndex];
                counterStatus.textContent = '第' + (multiStepIndex + 1) + '步：' + next.desc;
                setStageHerb(currentHerb, false);
            }
        });
        return;
    }

    // 单步药材
    var rules = HERB_RULES[currentHerb] || [];
    var rule = null;
    for (var i = 0; i < rules.length; i++) {
        if (rules[i].type === 'material' && rules[i].material === name) { rule = rules[i]; break; }
    }

    if (!rule) { showModal('提示', '【' + currentHerb + '】不能用【' + name + '】。'); return; }
    if (!materialInventory[name] || materialInventory[name] <= 0) {
        showModal('辅料不足', '【' + name + '】已用完。\n请点击顶部"🛒 购买辅料"补充。');
        return;
    }

    materialInventory[name] -= 1;
    saveMaterial();
    renderTools();

    playMaterialAnim(name, function() {
        currentProcessed = rule.result;
        setStageHerb(rule.result, true);
        counterHerb.textContent = '炮制品：' + rule.result;
        counterStatus.textContent = rule.desc + ' ✅';
        btnFinish.disabled = false;
    });
}

/* ===== 动画 ===== */
function playToolAnim(key, callback) {
    var tool = TOOLS_LEFT[key] || TOOLS_RIGHT[key];
    var toolEl = document.createElement('div');
    toolEl.className = 'stage-anim';
    toolEl.textContent = tool.icon;
    toolEl.style.top = '-50px';
    toolEl.style.left = '50%';
    toolEl.style.transform = 'translateX(-50%)';
    toolEl.style.opacity = '0';
    stage.appendChild(toolEl);

    requestAnimationFrame(function() {
        toolEl.style.top = '8px'; toolEl.style.opacity = '1';
    });
    setTimeout(function() { stageHerbImg.classList.add('shake'); stageEmoji.classList.add('shake'); }, 350);
    setTimeout(function() {
        stageHerbImg.classList.remove('shake'); stageEmoji.classList.remove('shake');
        toolEl.style.top = '-50px'; toolEl.style.opacity = '0';
    }, 700);
    setTimeout(function() { toolEl.remove(); if (callback) callback(); }, 1100);
}

function playMaterialAnim(name, callback) {
    var info = MATERIALS[name];
    var matEl = document.createElement('div');
    matEl.className = 'stage-anim';
    matEl.textContent = info.icon;
    matEl.style.right = '-50px';
    matEl.style.top = '50%';
    matEl.style.opacity = '0';
    stage.appendChild(matEl);

    requestAnimationFrame(function() {
        matEl.style.right = '15px'; matEl.style.top = '30%'; matEl.style.opacity = '1';
    });
    setTimeout(function() { matEl.style.opacity = '0'; stageHerbImg.classList.add('shake'); stageEmoji.classList.add('shake'); }, 600);
    setTimeout(function() { stageHerbImg.classList.remove('shake'); stageEmoji.classList.remove('shake'); }, 1000);
    setTimeout(function() { matEl.remove(); if (callback) callback(); }, 1200);
}

/* ===== 炒制 ===== */
function startFrying(rule) {
    isFrying = true; fryProgress = 0; fryRule = rule;
    fryBarContainer.style.display = 'block';
    counterHerb.textContent = '炒制中：' + currentHerb;
    counterStatus.textContent = '火候：冷锅';
    fryBar.style.width = '0%';
    fryBar.style.background = '#ffeb3b';
    stageHerbImg.classList.add('shake');
    btnFinish.disabled = false;
    btnCancel.disabled = false;

    if (fryInterval) clearInterval(fryInterval);
    fryInterval = setInterval(function() {
        fryProgress += 1;
        if (fryProgress >= 100) {
            fryProgress = 100; fryBar.style.width = '100%';
            clearInterval(fryInterval);
            return;
        }
        fryBar.style.width = fryProgress + '%';
        if (fryProgress < 30) { fryBar.style.background = '#ffeb3b'; counterStatus.textContent = '火候：冷锅'; }
        else if (fryProgress < 60) { fryBar.style.background = '#ff9800'; counterStatus.textContent = '火候：炒黄 ✅'; }
        else if (fryProgress < 90) { fryBar.style.background = '#f44336'; counterStatus.textContent = '火候：炒焦 ⚠️'; }
        else { fryBar.style.background = '#333'; counterStatus.textContent = '火候：焦黑 ❌'; }
    }, 80);
}

function finishFry() {
    if (!isFrying) return;
    clearInterval(fryInterval);
    isFrying = false;
    stageHerbImg.classList.remove('shake');
    fryBarContainer.style.display = 'none';

    var result;
    if (fryProgress < 30) {
        result = null;
        counterHerb.textContent = '生药：' + currentHerb;
        counterStatus.textContent = '火候不足，再炒一次。';
    } else if (fryProgress < 60) {
        result = fryRule.result;
        counterHerb.textContent = '炮制品：' + result;
        counterStatus.textContent = '炒黄 ✅';
    } else if (fryProgress < 90) {
        result = '炒焦' + currentHerb;
        counterHerb.textContent = '炮制品：' + result;
        counterStatus.textContent = '炒焦 ⚠️';
    } else {
        currentHerb = null; currentProcessed = null;
        setStageHerb(null);
        counterHerb.textContent = '药材已废弃';
        counterStatus.textContent = '❌ 焦黑，报废';
        btnFinish.disabled = true; btnCancel.disabled = true;
        fryProgress = 0;
        renderHerbRows();
        return;
    }

    if (result) {
        currentProcessed = result;
        setStageHerb(result, true);
        btnFinish.disabled = false;
        btnCancel.disabled = false;
    } else {
        currentProcessed = null;
        setStageHerb(currentHerb, false);
        btnFinish.disabled = true;
    }
    fryProgress = 0;
}

/* ===== 收好 ===== */
btnFinish.addEventListener('click', function() {
    if (isFrying) {
        if (fryProgress < 30) {
            counterStatus.textContent = '火候不足，继续炒到炒黄再取出～';
            return;
        }
        finishFry();
        if (!currentHerb) return;
    }
    if (!currentHerb) return;

    var resultName = currentProcessed || currentHerb;
    processedInventory[resultName] = (processedInventory[resultName] || 0) + 10;
    saveProcessed();

    currentHerb = null; currentProcessed = null;
    multiStepIndex = 0;
    setStageHerb(null);
    counterHerb.textContent = '请选择药材';
    counterStatus.textContent = '';
    btnFinish.disabled = true;
    btnCancel.disabled = true;
    renderHerbRows();
});

/* ===== 放弃 ===== */
btnCancel.addEventListener('click', function() {
    if (isFrying) {
        clearInterval(fryInterval); isFrying = false;
        stageHerbImg.classList.remove('shake');
        fryBarContainer.style.display = 'none';
    }
    if (currentHerb) {
        inventory[currentHerb] = (inventory[currentHerb] || 0) + 1;
        saveInventory();
    }
    currentHerb = null; currentProcessed = null;
    multiStepIndex = 0;
    setStageHerb(null);
    counterHerb.textContent = '请选择药材';
    counterStatus.textContent = '';
    btnFinish.disabled = true;
    btnCancel.disabled = true;
    renderHerbRows();
});

/* ===== 说明书 ===== */
document.getElementById('btnManual').addEventListener('click', function() {
    var html = '<h4>🌿 药材炮制指南</h4>';
    Object.keys(HERB_RULES).forEach(function(herb) {
        var rules = HERB_RULES[herb];
        var parts = rules.map(function(r) {
            if (r.type === 'none') return r.result + '（无需炮制）';
            if (r.type === 'tool') {
                var t = TOOLS_LEFT[r.tool] || TOOLS_RIGHT[r.tool];
                return t.icon + t.name + '→' + r.result + '（' + r.desc + '）';
            }
            if (r.type === 'material') return MATERIALS[r.material].icon + r.material + '→' + r.result + '（' + r.desc + '）';
            return r.result;
        });
        html += '<div><b>' + herb + '</b>：' + parts.join('；') + '</div>';
    });
    // 多步药材
    Object.keys(MULTI_STEP_HERBS).forEach(function(herb) {
        var config = MULTI_STEP_HERBS[herb];
        var steps = config.steps.map(function(s, i) {
            if (s.type === 'material') return (i+1) + '. ' + MATERIALS[s.material].icon + s.material + '（' + s.desc + '）';
            if (s.type === 'tool') {
                var t = TOOLS_LEFT[s.tool] || TOOLS_RIGHT[s.tool];
                return (i+1) + '. ' + t.icon + t.name + '（' + s.desc + '）';
            }
            return (i+1) + '. ' + s.desc;
        });
        html += '<div><b>' + herb + '</b>：依次 ' + steps.join(' → ') + ' → ' + config.finalResult + '</div>';
    });
    showModal('炮制说明书', html, true);
});

/* ===== 购买辅料 ===== */
document.getElementById('btnShop').addEventListener('click', function() {
    var html = '<div id="shopGrid">';
    Object.keys(MATERIALS).forEach(function(name) {
        var info = MATERIALS[name];
        var count = materialInventory[name] || 0;
        html +=
            '<div class="shop-card">' +
                '<img src="images/materials/' + name + '.webp" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'block\';">' +
                '<div class="shop-icon" style="display:none;">' + info.icon + '</div>' +
                '<div class="shop-name">' + name + '</div>' +
                '<div class="shop-price">💰 ' + info.price + '</div>' +
                '<div class="shop-stock">库存：' + count + '</div>' +
                '<button class="shop-buy" data-material="' + name + '" data-price="' + info.price + '">购买</button>' +
            '</div>';
    });
    html += '</div>';
    showModal('🛒 购买辅料', html, true);

    setTimeout(function() {
        document.querySelectorAll('.shop-buy').forEach(function(btn) {
            btn.addEventListener('click', function() {
                var mat = btn.getAttribute('data-material');
                var price = parseInt(btn.getAttribute('data-price'));
                var curCoins = getCoins();
                if (curCoins < price) { alert('铜币不足！'); return; }
                setCoins(curCoins - price);
                updateCoinDisplay();
                materialInventory[mat] = (materialInventory[mat] || 0) + 1;
                saveMaterial();
                renderTools();
                var card = btn.parentElement;
                card.querySelector('.shop-stock').textContent = '库存：' + materialInventory[mat];
            });
        });
    }, 50);
});

/* ===== 通用弹窗 ===== */
function showModal(title, text, isManual) {
    document.getElementById('modalTitle').textContent = title;
    var mt = document.getElementById('modalText');
    var mc = document.getElementById('manualContent');
    if (isManual) {
        mt.style.display = 'none';
        mc.style.display = 'block';
        mc.innerHTML = text;
    } else {
        mt.style.display = 'block';
        mc.style.display = 'none';
        mt.textContent = text;
    }
    modalOverlay.classList.add('active');
}
document.getElementById('modalConfirm').addEventListener('click', function() {
    modalOverlay.classList.remove('active');
});

/* ===== 初始化 ===== */
function init() {
    renderHerbRows();
    renderTools();
    updateCoinDisplay();
    setStageHerb(null);
}
init();
</script>
</body>
</html>
