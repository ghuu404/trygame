<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>炮制药材 - 重生之我是赤脚医生</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box;
    font-family: "KaiTi", "STKaiti", "楷体", "Kaiti SC", serif; }
html, body { width: 100%; height: 100%; overflow: hidden; }
body {
    user-select: none;
    background: #f5f0e8;
    display: flex;
    flex-direction: column;
}
#topBar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px 10px; background: #33691e; color: #fff;
    font-size: 13px; font-weight: bold; flex-shrink: 0; gap: 6px;
}
.top-btn {
    background: #aed581; border: 2px solid #fff;
    border-radius: 14px; padding: 4px 10px;
    font-size: 12px; font-weight: bold;
    color: #33691e; cursor: pointer; text-decoration: none;
    white-space: nowrap;
}
#coinDisplay {
    background: #aed581; border: 2px solid #fff; border-radius: 14px;
    padding: 4px 10px; font-size: 12px; color: #33691e;
    display: flex; align-items: center;
}
#main {
    flex: 1; display: flex; flex-direction: column;
    padding: 4px; gap: 4px; overflow: hidden; min-height: 0;
}
.herb-row {
    display: flex; gap: 6px;
    padding: 4px 16px;
    flex-shrink: 0;
    justify-content: flex-start;
    overflow-x: auto;
    height: 100px;
}
.herb-slot {
    width: 76px; height: 86px;
    background: #e8d5c0; border: 2px solid #8b5e3c;
    border-radius: 10px;
    display: flex; flex-direction: column;
    align-items: flex-end; justify-content: flex-end;
    cursor: pointer; font-size: 11px; font-weight: bold;
    color: #3a2a1a; flex-shrink: 0; position: relative;
    overflow: hidden; transition: all 0.15s; padding-bottom: 3px;
}
.herb-slot img {
    width: 42px; height: 42px; object-fit: contain;
    position: absolute; top: 6px; left: 50%;
    transform: translateX(-50%); pointer-events: none;
}
.herb-slot .hname { font-size: 11px; text-align: center; width: 100%; }
.herb-slot .hcount {
    position: absolute; top: 2px; right: 4px; font-size: 10px; color: #c62828;
    background: rgba(255,255,255,0.85); border-radius: 6px; padding: 0 4px;
}
.herb-slot.empty { background: #d0c0b0; border-style: dashed; color: #999; cursor: default; }
.herb-slot.selected { border-color: #ff8c00; box-shadow: 0 0 8px #ff8c00; }

#workArea {
    flex: 1; display: flex;
    background: rgba(255,255,255,0.5);
    border-radius: 10px; border: 2px solid #b89a72;
    padding: 6px; gap: 6px;
    min-height: 0; overflow: hidden;
    justify-content: center;
}
#leftTools, #rightTools {
    display: flex; flex-direction: column; gap: 6px;
    width: 24%; overflow-y: auto; flex-shrink: 0;
    padding-right: 2px;
}
.tool-btn, .material-btn {
    width: 100%; min-height: 56px;
    background: #fff; border: 2px solid #8b5e3c;
    border-radius: 10px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    cursor: pointer; font-size: 11px; font-weight: bold;
    color: #5a3e2b; flex-shrink: 0; padding: 3px;
    transition: all 0.15s; line-height: 1.1;
    text-align: center; position: relative;
}
.tool-btn img, .material-btn img {
    width: 28px; height: 28px; object-fit: contain;
    pointer-events: none;
}
.material-btn .mcount {
    position: absolute; top: 2px; right: 4px; font-size: 10px; color: #c62828;
    background: rgba(255,255,255,0.85); border-radius: 6px; padding: 0 4px;
}
.material-btn.out { opacity: 0.4; cursor: not-allowed; }

#counter {
    flex: 0 0 42%;
    max-width: 42%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: #f0e6d8; border-radius: 10px;
    border: 2px dashed #b89a72;
    padding: 10px; min-width: 0; overflow: hidden;
    gap: 6px;
}
#stage {
    position: relative;
    width: 100px; height: 100px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
}
#stageHerbImg {
    max-width: 90px; max-height: 90px;
    object-fit: contain; transition: all 0.3s; z-index: 2;
}
#stageEmoji { font-size: 56px; z-index: 2; }
.stage-anim {
    position: absolute; z-index: 5; pointer-events: none;
    transition: all 0.4s ease-in-out;
}
#counterHerb {
    font-size: 14px; font-weight: bold; color: #5a3e2b;
    text-align: center; width: 100%;
    overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap;
}
#counterStatus {
    font-size: 12px; color: #888; text-align: center;
    width: 100%; min-height: 16px;
}
#stepList {
    font-size: 11px; color: #5a3e2b;
    text-align: center; width: 100%;
    line-height: 1.6;
    padding: 0 4px;
}
#stepList .step-done { color: #2e7d32; font-weight: bold; }
#stepList .step-active { color: #ff8c00; font-weight: bold; }
#stepList .step-todo { color: #999; }
#counterButtons {
    display: flex; gap: 8px; justify-content: center; width: 100%;
}
#btnFinish, #btnCancel {
    padding: 6px 14px; font-size: 13px; font-weight: bold;
    border-radius: 10px; cursor: pointer;
    border: 2px solid #558b2f;
    background: #aed581; color: #33691e;
    font-family: inherit;
}
#btnCancel { background: #e0e0e0; border-color: #999; color: #555; }
#btnFinish:disabled, #btnCancel:disabled { opacity: 0.4; cursor: not-allowed; }

@keyframes herbShake {
    0%, 100% { transform: translateX(0) rotate(0); }
    20% { transform: translateX(-5px) rotate(-4deg); }
    40% { transform: translateX(5px) rotate(4deg); }
    60% { transform: translateX(-4px) rotate(-3deg); }
    80% { transform: translateX(4px) rotate(3deg); }
}
.shake { animation: herbShake 0.4s; }

#modalOverlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.65);
    display: none; align-items: center; justify-content: center;
    z-index: 999;
}
#modalOverlay.active { display: flex; }
.modal-box {
    background: #f5f0e8; border-radius: 20px;
    padding: 16px; text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    width: 88%; max-width: 420px;
    max-height: 80vh; overflow-y: auto;
    border: 3px solid #558b2f;
}
.modal-title { font-size: 18px; font-weight: bold; color: #33691e; margin-bottom: 8px; }
.modal-text {
    font-size: 13px; color: #666; margin-bottom: 12px;
    text-align: left; white-space: pre-wrap; line-height: 1.5;
}
.modal-btn {
    display: block; width: 100%; font-size: 15px; font-weight: bold;
    padding: 8px; margin: 4px 0; border: 2px solid #558b2f;
    border-radius: 10px; background: #aed581; color: #33691e;
    cursor: pointer; font-family: inherit;
}
#manualContent {
    text-align: left; font-size: 12px; line-height: 1.6;
    max-height: 55vh; overflow-y: auto;
}
#manualContent h4 {
    color: #33691e; margin: 6px 0 4px;
    border-bottom: 1px solid #ccc; padding-bottom: 2px;
}
</style>
</head>
<body>

<div id="topBar">
    <div style="display:flex;gap:6px;">
        <a class="top-btn" href="index.html">← 返回</a>
        <button class="top-btn" id="btnManual">📖 说明书</button>
        <button class="top-btn" id="btnShop">🛒 购买辅料</button>
    </div>
    <div id="coinDisplay">
        <img src="images/icon-coin.webp" style="width:16px;height:16px;vertical-align:middle;margin-right:3px;" onerror="this.style.display='none'">
        <span id="coinText">0</span>
    </div>
</div>

<div id="main">
    <div class="herb-row" id="herbRowTop"></div>
    <div id="workArea">
        <div id="leftTools"></div>
        <div id="counter">
            <div id="stage">
                <img id="stageHerbImg" style="display:none;">
                <span id="stageEmoji" style="display:none;">🌿</span>
            </div>
            <div id="counterHerb">请选择药材</div>
            <div id="stepList"></div>
            <div id="counterStatus"></div>
            <div id="counterButtons">
                <button id="btnFinish" disabled>收好（×10）</button>
                <button id="btnCancel" disabled>放弃</button>
            </div>
        </div>
        <div id="rightTools"></div>
    </div>
    <div class="herb-row" id="herbRowBottom"></div>
</div>

<div id="modalOverlay">
    <div class="modal-box">
        <div class="modal-title" id="modalTitle">提示</div>
        <div class="modal-text" id="modalText"></div>
        <div id="manualContent" style="display:none;"></div>
        <button class="modal-btn" id="modalConfirm">确定</button>
    </div>
</div>

<script>
/* ===== 仓库 ===== */
var WAREHOUSE_KEY = 'warehouse';
function getWarehouse() {
    try {
        return JSON.parse(localStorage.getItem(WAREHOUSE_KEY)) ||
            { herbs: {}, seeds: {}, materials: {}, processed: {} };
    } catch(e) {
        return { herbs: {}, seeds: {}, materials: {}, processed: {} };
    }
}
function saveWarehouse(w) {
    localStorage.setItem(WAREHOUSE_KEY, JSON.stringify(w));
}
var warehouse = getWarehouse();
var inventory = warehouse.herbs;
var materialInventory = warehouse.materials;
var processedInventory = warehouse.processed;
function saveInventory() { warehouse.herbs = inventory; saveWarehouse(warehouse); }
function saveMaterial()  { warehouse.materials = materialInventory; saveWarehouse(warehouse); }
function saveProcessed() { warehouse.processed = processedInventory; saveWarehouse(warehouse); }

function getCoins() { return parseInt(localStorage.getItem('coins') || 0); }
function setCoins(n) { localStorage.setItem('coins', String(n)); }
function updateCoinDisplay() {
    var el = document.getElementById('coinText');
    if (el) el.textContent = getCoins();
}

/* 首次进入：给测试药材 */
if (Object.keys(inventory).length === 0) {
    var testHerbs = {
        '桂枝': 3, '麻黄': 3, '山杏': 3, '甘草': 3, '芍药': 3,
        '生姜': 3, '大枣': 3, '葛根': 3, '细辛': 3, '干姜': 3,
        '五味子': 3, '半夏': 3, '柴胡': 3, '黄芩': 3, '人参': 3,
        '枳实': 3, '大黄': 3, '厚朴': 3, '茯苓': 3, '猪苓': 3,
        '泽泻': 3, '白术': 3, '知母': 3, '石膏': 3, '芒硝': 3,
        '附子': 3, '栀子': 3, '淡豆豉': 3, '饴糖': 3, '当归': 3,
        '通草': 3, '茵陈': 3, '黄连': 3, '粳米': 3
    };
    Object.assign(inventory, testHerbs);
    saveInventory();
}

/* ===== 工具/辅料 ===== */
var TOOLS_LEFT = {
    cut:    { name: '切刀', icon: '🔪' },
    scrape: { name: '刮刀', icon: '🪒' },
    peel:   { name: '镊子', icon: '🥢' },
    remove: { name: '针挑', icon: '📌' },
    smash:  { name: '研钵', icon: '🥣' },
    break:  { name: '手擘', icon: '🤲' }
};
var TOOLS_RIGHT = {
    fry:    { name: '炒锅', icon: '🍳' },
    fire:   { name: '火炉', icon: '🔥' },
    wash:   { name: '水洗', icon: '💧' },
    dry:    { name: '晒干', icon: '☀️' }
};
var MATERIALS = {
    '黄酒':    { icon: '🍶', price: 4 },
    '蜂蜜':    { icon: '🍯', price: 5 },
    '盐':      { icon: '🧂', price: 2 },
    '姜汁':    { icon: '🫚', price: 4 },
    '醋':      { icon: '🍾', price: 3 },
    '清水':    { icon: '💧', price: 1 },
    '白矾':    { icon: '⬜', price: 3 },
    '麦麸':    { icon: '🌾', price: 2 },
    '米泔水':  { icon: '🍚', price: 2 },
    '甘草水':  { icon: '🍵', price: 5 },
    '石灰水':  { icon: '🥛', price: 2 },
    '黑豆汁':  { icon: '🫘', price: 6 }
};

/* ===== 每味药唯一一条炮制路径 ===== */
var HERB_PROCESSES = {
    // 水洗 + 处理
    '桂枝': { steps: [ {tool:'wash'}, {tool:'cut'} ], result: '桂枝(切片)' },
    '麻黄': { steps: [ {tool:'wash'}, {tool:'remove'} ], result: '麻黄(去节)' },
    '山杏': { steps: [ {tool:'wash'}, {tool:'peel'} ], result: '山杏(去皮尖)' },
    '甘草': { steps: [ {tool:'wash'}, {tool:'cut'}, {material:'蜂蜜'} ], result: '甘草(蜜炙)' },
    '芍药': { steps: [ {tool:'wash'}, {tool:'cut'} ], result: '芍药(切片)' },
    '生姜': { steps: [ {tool:'wash'}, {tool:'cut'} ], result: '生姜(切片)' },
    '干姜': { steps: [ {tool:'wash'}, {tool:'cut'} ], result: '干姜(切片)' },
    '大枣': { steps: [ {tool:'wash'}, {tool:'break'} ], result: '大枣(擘)' },
    '葛根': { steps: [ {tool:'wash'}, {tool:'cut'} ], result: '葛根(切片)' },
    '细辛': { steps: [ {tool:'wash'}, {tool:'cut'} ], result: '细辛(切段)' },
    '柴胡': { steps: [ {tool:'wash'}, {tool:'cut'} ], result: '柴胡(切片)' },
    '黄芩': { steps: [ {tool:'wash'}, {tool:'cut'} ], result: '黄芩(切片)' },
    '知母': { steps: [ {tool:'wash'}, {tool:'scrape'} ], result: '知母(去毛)' },
    '附子': { steps: [ {tool:'wash'}, {tool:'fire'}, {tool:'peel'} ], result: '炮附子' },
    '白术': { steps: [ {tool:'wash'}, {tool:'cut'}, {tool:'fry'} ], result: '炒白术' },
    '大黄': { steps: [ {tool:'wash'}, {material:'黄酒'} ], result: '酒洗大黄' },
    '厚朴': { steps: [ {tool:'wash'}, {tool:'scrape'}, {material:'姜汁'} ], result: '姜炙厚朴' },
    '枳实': { steps: [ {tool:'wash'}, {tool:'cut'}, {tool:'fry'} ], result: '炒枳实' },
    '猪苓': { steps: [ {tool:'wash'}, {tool:'scrape'} ], result: '猪苓(去皮)' },
    '当归': { steps: [ {tool:'wash'}, {material:'黄酒'} ], result: '酒洗当归' },
    '泽泻': { steps: [ {tool:'wash'}, {tool:'cut'}, {material:'盐'} ], result: '盐炙泽泻' },
    '栀子': { steps: [ {tool:'wash'}, {tool:'break'} ], result: '栀子(擘)' },
    '半夏': { steps: [ {material:'清水'}, {material:'白矾'}, {material:'姜汁'} ], result: '姜半夏' },
    '茯苓': { steps: [ {tool:'wash'}, {tool:'cut'} ], result: '茯苓(切块)' },
    '五味子': { steps: [ {tool:'wash'}, {tool:'dry'} ], result: '五味子(晒干)' },
    '茵陈': { steps: [ {tool:'wash'}, {tool:'cut'} ], result: '茵陈(切片)' },
    '人参': { steps: [ {tool:'wash'} ], result: '人参' },
    '黄连': { steps: [ {tool:'wash'} ], result: '黄连' },
    '通草': { steps: [ {tool:'wash'} ], result: '通草' },
    // 不水洗
    '石膏': { steps: [ {tool:'smash'} ], result: '碎石膏' },
    '芒硝': { steps: [], result: '芒硝' },
    '淡豆豉': { steps: [], result: '淡豆豉' },
    '饴糖': { steps: [], result: '饴糖' },
    '粳米': { steps: [], result: '粳米' }
};

/* ===== 元素 ===== */
var herbRowTop = document.getElementById('herbRowTop');
var herbRowBottom = document.getElementById('herbRowBottom');
var leftTools = document.getElementById('leftTools');
var rightTools = document.getElementById('rightTools');
var stageHerbImg = document.getElementById('stageHerbImg');
var stageEmoji = document.getElementById('stageEmoji');
var stage = document.getElementById('stage');
var counterHerb = document.getElementById('counterHerb');
var counterStatus = document.getElementById('counterStatus');
var stepList = document.getElementById('stepList');
var btnFinish = document.getElementById('btnFinish');
var btnCancel = document.getElementById('btnCancel');
var modalOverlay = document.getElementById('modalOverlay');

var currentHerb = null;
var currentProcessed = null;
var stepIndex = 0;

/* ===== 渲染药材栏 ===== */
function renderHerbRows() {
    var allHerbs = Object.keys(inventory)
        .filter(function(n) { return inventory[n] > 0; })
        .sort();
    var mid = Math.ceil(allHerbs.length / 2);
    renderRow(herbRowTop, allHerbs.slice(0, mid));
    renderRow(herbRowBottom, allHerbs.slice(mid));
}
function renderRow(rowEl, herbs) {
    rowEl.innerHTML = '';
    if (herbs.length === 0) {
        var slot = document.createElement('div');
        slot.className = 'herb-slot empty';
        slot.textContent = '仓库暂无药材，先去采药吧';
        slot.style.width = '100%';
        rowEl.appendChild(slot);
        return;
    }
    herbs.forEach(function(name) {
        var slot = document.createElement('div');
        slot.className = 'herb-slot';
        if (currentHerb === name) slot.classList.add('selected');
        slot.innerHTML =
            '<img src="images/herbs/' + name + '.webp" onerror="this.style.display=\'none\';">' +
            '<span class="hname">' + name + '</span>' +
            '<span class="hcount">x' + inventory[name] + '</span>';
        slot.addEventListener('click', function() { selectHerb(name); });
        rowEl.appendChild(slot);
    });
}

/* ===== 渲染工具/辅料 ===== */
function renderTools() {
    leftTools.innerHTML = '';
    Object.keys(TOOLS_LEFT).forEach(function(key) {
        var tool = TOOLS_LEFT[key];
        var btn = document.createElement('div');
        btn.className = 'tool-btn';
        btn.innerHTML =
            '<img src="images/tools/' + key + '.webp" onerror="this.style.display=\'none\';">' +
            '<span>' + tool.name + '</span>';
        btn.addEventListener('click', function() { useTool(key); });
        leftTools.appendChild(btn);
    });
    rightTools.innerHTML = '';
    Object.keys(TOOLS_RIGHT).forEach(function(key) {
        var tool = TOOLS_RIGHT[key];
        var btn = document.createElement('div');
        btn.className = 'tool-btn';
        btn.innerHTML =
            '<img src="images/tools/' + key + '.webp" onerror="this.style.display=\'none\';">' +
            '<span>' + tool.name + '</span>';
        btn.addEventListener('click', function() { useTool(key); });
        rightTools.appendChild(btn);
    });
    Object.keys(MATERIALS).forEach(function(name) {
        var info = MATERIALS[name];
        var count = materialInventory[name] || 0;
        var btn = document.createElement('div');
        btn.className = 'material-btn' + (count <= 0 ? ' out' : '');
        btn.innerHTML =
            '<img src="images/materials/' + name + '.webp" onerror="this.style.display=\'none\';">' +
            '<span>' + name + '</span>' +
            '<span class="mcount">x' + count + '</span>';
        btn.addEventListener('click', function() { useMaterial(name); });
        rightTools.appendChild(btn);
    });
}

/* ===== 舞台显示 ===== */
function setStageHerb(name, isProcessed) {
    stageHerbImg.style.display = 'none';
    stageEmoji.style.display = 'none';
    stageHerbImg.src = '';
    if (!name) return;
    var p = isProcessed
        ? 'images/herbs/processed/' + name + '.webp'
        : 'images/herbs/' + name + '.webp';
    stageHerbImg.src = p;
    stageHerbImg.style.display = 'block';
    stageHerbImg.onerror = function() {
        this.style.display = 'none';
        stageEmoji.style.display = 'block';
        stageEmoji.textContent = '🌿';
    };
    stageHerbImg.onload = function() {
        this.style.display = 'block';
        stageEmoji.style.display = 'none';
    };
}

/* ===== 步骤列表显示 ===== */
function renderStepList() {
    stepList.innerHTML = '';
    if (!currentHerb) return;
    var proc = HERB_PROCESSES[currentHerb];
    if (!proc || proc.steps.length === 0) {
        stepList.innerHTML = '<span class="step-todo">无需炮制</span>';
        return;
    }
    var html = '';
    proc.steps.forEach(function(s, i) {
        var label = s.tool
            ? (TOOLS_LEFT[s.tool] || TOOLS_RIGHT[s.tool]).name
            : s.material;
        var cls = i < stepIndex ? 'step-done' : (i === stepIndex ? 'step-active' : 'step-todo');
        var mark = i < stepIndex ? '✓ ' : (i === stepIndex ? '▶ ' : '· ');
        html += '<span class="' + cls + '">' + mark + label + '</span>';
        if (i < proc.steps.length - 1) html += ' → ';
    });
    stepList.innerHTML = html;
}

/* ===== 选择药材 ===== */
function selectHerb(name) {
    if (currentHerb) { showModal('提示', '操作台上已有药材。'); return; }
    if (inventory[name] <= 0) { showModal('提示', '库存不足！'); return; }

    var proc = HERB_PROCESSES[name];
    if (!proc) { showModal('提示', '这个药材暂时不支持炮制。'); return; }

    inventory[name] -= 1;
    saveInventory();
    currentHerb = name;
    currentProcessed = null;
    stepIndex = 0;

    setStageHerb(name, false);
    counterHerb.textContent = '生药：' + name;

    if (proc.steps.length === 0) {
        // 无需炮制
        counterStatus.textContent = '无需炮制，直接收好';
        btnFinish.disabled = false;
        btnCancel.disabled = false;
    } else {
        counterStatus.textContent = '请按顺序操作';
        btnFinish.disabled = true;
        btnCancel.disabled = false;
    }
    renderStepList();
    renderHerbRows();
}

/* ===== 使用工具 ===== */
function useTool(key) {
    if (!currentHerb) { showModal('提示', '请先选择药材。'); return; }
    if (currentProcessed) { showModal('提示', '已完成，点"收好"。'); return; }

    var proc = HERB_PROCESSES[currentHerb];
    if (!proc || proc.steps.length === 0) {
        showModal('提示', '【' + currentHerb + '】无需炮制。');
        return;
    }
    var step = proc.steps[stepIndex];
    if (!step) return;

    if (!step.tool || step.tool !== key) {
        var wantDesc = step.tool
            ? (TOOLS_LEFT[step.tool] || TOOLS_RIGHT[step.tool]).name
            : step.material;
        showModal('提示', '当前步骤需要：' + wantDesc);
        return;
    }
    playToolAnim(key, function() { advanceStep(); });
}

/* ===== 使用辅料 ===== */
function useMaterial(name) {
    if (!currentHerb) { showModal('提示', '请先选择药材。'); return; }
    if (currentProcessed) { showModal('提示', '已完成，点"收好"。'); return; }

    var proc = HERB_PROCESSES[currentHerb];
    if (!proc || proc.steps.length === 0) {
        showModal('提示', '【' + currentHerb + '】无需炮制。');
        return;
    }
    var step = proc.steps[stepIndex];
    if (!step) return;

    if (!step.material || step.material !== name) {
        var wantDesc = step.tool
            ? (TOOLS_LEFT[step.tool] || TOOLS_RIGHT[step.tool]).name
            : step.material;
        showModal('提示', '当前步骤需要：' + wantDesc);
        return;
    }
    if (!materialInventory[name] || materialInventory[name] <= 0) {
        showModal('辅料不足', '【' + name + '】已用完。\n请点击"🛒 购买辅料"补充。');
        return;
    }

    materialInventory[name] -= 1;
    saveMaterial();
    renderTools();

    playMaterialAnim(name, function() { advanceStep(); });
}

/* ===== 推进步骤 ===== */
function advanceStep() {
    var proc = HERB_PROCESSES[currentHerb];
    stepIndex++;
    if (stepIndex >= proc.steps.length) {
        // 全部完成
        currentProcessed = proc.result;
        setStageHerb(proc.result, true);
        counterHerb.textContent = '炮制品：' + proc.result;
        counterStatus.textContent = '炮制完成 ✅';
        btnFinish.disabled = false;
    } else {
        // 还有下一步
        counterStatus.textContent = '请继续下一步';
        setStageHerb(currentHerb, false);
    }
    renderStepList();
}

/* ===== 动画 ===== */
function playToolAnim(key, callback) {
    var tool = TOOLS_LEFT[key] || TOOLS_RIGHT[key];
    var toolEl = document.createElement('div');
    toolEl.className = 'stage-anim';
    toolEl.innerHTML = '<img src="images/tools/' + key + '.webp" style="width:60px;height:60px;object-fit:contain;" onerror="this.style.display=\'none\';">';
    toolEl.style.top = '-60px';
    toolEl.style.left = '50%';
    toolEl.style.transform = 'translateX(-50%)';
    toolEl.style.opacity = '0';
    stage.appendChild(toolEl);
    requestAnimationFrame(function() {
        toolEl.style.top = '8px'; toolEl.style.opacity = '1';
    });
    setTimeout(function() { stageHerbImg.classList.add('shake'); }, 350);
    setTimeout(function() {
        stageHerbImg.classList.remove('shake');
        toolEl.style.top = '-60px'; toolEl.style.opacity = '0';
    }, 700);
    setTimeout(function() { toolEl.remove(); if (callback) callback(); }, 1100);
}

function playMaterialAnim(name, callback) {
    var matEl = document.createElement('div');
    matEl.className = 'stage-anim';
    matEl.innerHTML = '<img src="images/materials/' + name + '.webp" style="width:60px;height:60px;object-fit:contain;" onerror="this.style.display=\'none\';">';
    matEl.style.right = '-60px';
    matEl.style.top = '50%';
    matEl.style.opacity = '0';
    stage.appendChild(matEl);
    requestAnimationFrame(function() {
        matEl.style.right = '15px'; matEl.style.top = '30%'; matEl.style.opacity = '1';
    });
    setTimeout(function() { matEl.style.opacity = '0'; stageHerbImg.classList.add('shake'); }, 600);
    setTimeout(function() { stageHerbImg.classList.remove('shake'); }, 1000);
    setTimeout(function() { matEl.remove(); if (callback) callback(); }, 1200);
}

/* ===== 收好 ===== */
btnFinish.addEventListener('click', function() {
    if (!currentHerb) return;
    var resultName = currentProcessed || HERB_PROCESSES[currentHerb].result;
    processedInventory[resultName] = (processedInventory[resultName] || 0) + 10;
    saveProcessed();

    currentHerb = null; currentProcessed = null; stepIndex = 0;
    setStageHerb(null);
    counterHerb.textContent = '请选择药材';
    counterStatus.textContent = '';
    stepList.innerHTML = '';
    btnFinish.disabled = true;
    btnCancel.disabled = true;
    renderHerbRows();
});

/* ===== 放弃 ===== */
btnCancel.addEventListener('click', function() {
    if (currentHerb) {
        inventory[currentHerb] = (inventory[currentHerb] || 0) + 1;
        saveInventory();
    }
    currentHerb = null; currentProcessed = null; stepIndex = 0;
    setStageHerb(null);
    counterHerb.textContent = '请选择药材';
    counterStatus.textContent = '';
    stepList.innerHTML = '';
    btnFinish.disabled = true;
    btnCancel.disabled = true;
    renderHerbRows();
});

/* ===== 说明书 ===== */
document.getElementById('btnManual').addEventListener('click', function() {
    var html = '<h4>🌿 药材炮制指南</h4>';
    Object.keys(HERB_PROCESSES).forEach(function(herb) {
        var proc = HERB_PROCESSES[herb];
        if (proc.steps.length === 0) {
            html += '<div><b>' + herb + '</b>：无需炮制</div>';
            return;
        }
        var steps = proc.steps.map(function(s) {
            if (s.tool) {
                var t = TOOLS_LEFT[s.tool] || TOOLS_RIGHT[s.tool];
                return '<img src="images/tools/' + s.tool + '.webp" style="width:16px;height:16px;vertical-align:middle;margin:0 2px;" onerror="this.style.display=\'none\'">' + t.name;
            }
            return '<img src="images/materials/' + s.material + '.webp" style="width:16px;height:16px;vertical-align:middle;margin:0 2px;" onerror="this.style.display=\'none\'">' + s.material;
        });
        html += '<div><b>' + herb + '</b>：' + steps.join(' → ') + ' → ' + proc.result + '</div>';
    });
    showModal('炮制说明书', html, true);
});

/* ===== 购买辅料 ===== */
document.getElementById('btnShop').addEventListener('click', function() {
    var html = '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0;">';
    Object.keys(MATERIALS).forEach(function(name) {
        var info = MATERIALS[name];
        var count = materialInventory[name] || 0;
        html +=
            '<div style="background:#f0e6d8;border:2px solid #aed581;border-radius:14px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;">' +
                '<img src="images/materials/' + name + '.webp" style="width:50px;height:50px;object-fit:contain;" onerror="this.style.display=\'none\'">' +
                '<div style="font-size:14px;font-weight:bold;color:#33691e;">' + name + '</div>' +
                '<div style="font-size:13px;font-weight:bold;color:#c62828;">💰 ' + info.price + '</div>' +
                '<div style="font-size:11px;color:#777;">库存：' + count + '</div>' +
                '<button class="shop-buy" data-material="' + name + '" data-price="' + info.price + '" style="width:100%;padding:6px 0;border:2px solid #558b2f;border-radius:18px;background:#aed581;color:#33691e;font-weight:bold;font-size:13px;cursor:pointer;font-family:inherit;">购买</button>' +
            '</div>';
    });
    html += '</div>';
    showModal('🛒 购买辅料', html, true);

    setTimeout(function() {
        document.querySelectorAll('.shop-buy').forEach(function(btn) {
            btn.addEventListener('click', function() {
                var mat = btn.getAttribute('data-material');
                var price = parseInt(btn.getAttribute('data-price'));
                var cur = getCoins();
                if (cur < price) { alert('铜币不足！'); return; }
                setCoins(cur - price);
                updateCoinDisplay();
                materialInventory[mat] = (materialInventory[mat] || 0) + 1;
                saveMaterial();
                renderTools();
                var card = btn.parentElement;
                card.querySelector('div:nth-child(5)').textContent = '库存：' + materialInventory[mat];
            });
        });
    }, 50);
});

/* ===== 弹窗 ===== */
function showModal(title, text, isManual) {
    document.getElementById('modalTitle').textContent = title;
    var mt = document.getElementById('modalText');
    var mc = document.getElementById('manualContent');
    if (isManual) {
        mt.style.display = 'none';
        mc.style.display = 'block';
        mc.innerHTML = text;
    } else {
        mt.style.display = 'block';
        mc.style.display = 'none';
        mt.textContent = text;
    }
    modalOverlay.classList.add('active');
}
document.getElementById('modalConfirm').addEventListener('click', function() {
    modalOverlay.classList.remove('active');
});

/* ===== 初始化 ===== */
function init() {
    renderHerbRows();
    renderTools();
    updateCoinDisplay();
    setStageHerb(null);
}
init();
</script>
</body>
</html>
