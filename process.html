<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>行医 · 问诊</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    user-select: none; background: #2a1a0a;
    display: flex; flex-direction: column; align-items: center;
  }
  #app {
    width: 100%; max-width: 440px; height: 100%;
    display: flex; flex-direction: column; position: relative;
    background: #f5f0e8;
  }
  #topBar {
    height: 46px; display: flex; align-items: center;
    padding: 0 12px; gap: 10px;
    background: linear-gradient(180deg, #6d4c2a 0%, #4a2f1a 100%);
    color: #fff; box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    flex-shrink: 0; z-index: 5;
  }
  .icon-btn {
    background: rgba(255,255,255,0.15); border: none; color: #fff;
    font-size: 18px; width: 34px; height: 34px; border-radius: 8px; cursor: pointer;
  }
  .icon-btn:active { transform: scale(0.92); }
  #progress { flex: 1; text-align: center; font-size: 14px; font-weight: bold; letter-spacing: 1px; }
  #coinTag {
    font-size: 13px; font-weight: bold;
    background: rgba(255,215,0,0.2); color: #ffd700;
    border: 1px solid rgba(255,215,0,0.5);
    padding: 4px 10px; border-radius: 12px;
  }
  #stage {
    flex: 1; position: relative; overflow: hidden;
    background: #3a2a1a;
    display: flex; align-items: center; justify-content: center;
  }
  #sceneWrap {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
  }
  #sceneWrap svg { width: 100%; height: 100%; display: block; }

  @keyframes shiver {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-3px); }
    75% { transform: translateX(3px); }
  }
  .shiver { animation: shiver 0.3s infinite; }
  @keyframes breathe {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-2.5px); }
  }
  .breathe { animation: breathe 3s ease-in-out infinite; }
  .patient-group { transform-origin: 180px 340px; }

  .hotspot { cursor: pointer; pointer-events: all; }
  .hotspot .hotspot-ring {
    transform-box: fill-box;
    transform-origin: center;
    animation: pulseRing 1.4s infinite ease-out;
  }
  @keyframes pulseRing {
    0% { transform: scale(0.7); opacity: 0.85; }
    100% { transform: scale(1.55); opacity: 0; }
  }
  .hotspot .hotspot-dot { animation: dotBlink 1.4s infinite ease-in-out; }
  @keyframes dotBlink {
    0%,100% { opacity: 0.5; }
    50% { opacity: 1; }
  }

  #bubble {
    position: absolute; top: 14px; left: 50%;
    transform: translateX(-50%) scale(0.9);
    background: #fffdf5; border: 2px solid #6d4c2a;
    border-radius: 14px; padding: 10px 16px;
    font-size: 14px; color: #3a2a1a; font-weight: bold;
    max-width: 82%; line-height: 1.4;
    box-shadow: 0 6px 16px rgba(0,0,0,0.3);
    opacity: 0; transition: all 0.25s ease;
    z-index: 3; text-align: center;
  }
  #bubble::after {
    content: ''; position: absolute; bottom: -10px; left: 50%;
    transform: translateX(-50%);
    border: 8px solid transparent;
    border-top-color: #6d4c2a;
  }
  #bubble.show { opacity: 1; transform: translateX(-50%) scale(1); }

  #casePanel {
    background: #fffaf0; border-top: 3px solid #6d4c2a;
    padding: 8px 14px; min-height: 62px; max-height: 96px;
    overflow-y: auto; font-size: 12px; color: #5a4a30;
    flex-shrink: 0;
  }
  .case-title { font-size: 12px; font-weight: bold; color: #6d4c2a; margin-bottom: 4px; }
  #caseContent { line-height: 1.6; }
  #caseContent .sym { color: #b34100; font-weight: bold; }
  #caseContent .pulse { color: #1565c0; font-weight: bold; }

  #actionArea {
    padding: 10px 14px 16px; background: #f0e6d0;
    border-top: 2px solid #d4c4a8; flex-shrink: 0;
    min-height: 76px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .action-tip {
    font-size: 13px; color: #6b5a3a; text-align: center;
    font-weight: bold; line-height: 1.4;
  }
  .action-btn {
    display: block; width: 100%; font-size: 15px; font-weight: bold;
    padding: 11px; border: 2px solid #6d4c2a; border-radius: 12px;
    background: linear-gradient(180deg, #d4a574 0%, #b8845a 100%);
    color: #3a2a1a; cursor: pointer; transition: all 0.15s;
    box-shadow: 0 3px 0 #6d4c2a;
  }
  .action-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #6d4c2a; }
  .option-btn {
    display: block; width: 100%; text-align: left;
    font-size: 15px; font-weight: bold;
    padding: 12px 16px; margin-bottom: 6px;
    border: 2px solid #8b7355; border-radius: 12px;
    background: #fffdf5; color: #4a3a20; cursor: pointer;
    transition: all 0.15s;
  }
  .option-btn:active { transform: scale(0.98); background: #f0e6d0; }
  .option-btn.correct { background: #c5e1a5; border-color: #33691e; color: #1a3a00; }
  .option-btn.wrong { background: #ffcdd2; border-color: #c62828; color: #7a1010; }
  .option-btn:disabled { cursor: default; }

  #modalOverlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.65);
    display: none; align-items: center; justify-content: center;
    z-index: 999; padding: 20px;
  }
  #modalOverlay.active { display: flex; }
  .modal-box {
    background: #f5f0e8; border-radius: 20px; padding: 26px 30px;
    text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    width: 100%; max-width: 320px; border: 3px solid #6d4c2a;
  }
  .modal-title { font-size: 22px; font-weight: bold; color: #6d4c2a; margin-bottom: 10px; }
  .modal-text { font-size: 14px; color: #5a4a30; margin-bottom: 20px; line-height: 1.5; white-space: pre-line; }
  .modal-btn {
    display: block; width: 100%; font-size: 16px; font-weight: bold;
    padding: 12px; margin: 8px 0; border: 2px solid #6d4c2a;
    border-radius: 12px;
    background: linear-gradient(180deg, #d4a574 0%, #b8845a 100%);
    color: #3a2a1a; cursor: pointer;
    box-shadow: 0 3px 0 #6d4c2a;
  }

</head>

/* ---------- 音效 ---------- */
let audioCtx = null;
function beep(freq, dur = 0.12, type = 'sine', vol = 0.12) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type; osc.frequency.value = freq;
    osc.connect(gain); gain.connect(audioCtx.destination);
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.start(); osc.stop(audioCtx.currentTime + dur);
  } catch (e) {}
}
const sfx = {
  wrong:   () => { beep(180, 0.14, 'square', 0.1); setTimeout(() => beep(140, 0.2, 'square', 0.1), 110); },
  correct: () => { beep(660, 0.1); setTimeout(() => beep(880, 0.14), 90); },
  click:   () => beep(520, 0.06, 'sine', 0.08),
  win:     () => { beep(523,0.1); setTimeout(()=>beep(659,0.1),100); setTimeout(()=>beep(784,0.2),200); },
  lose:    () => { beep(300,0.2,'sawtooth',0.08); setTimeout(()=>beep(200,0.3,'sawtooth',0.08),180); }
};

/* ---------- 状态 ---------- */
const ST = { INTRO:'intro', OBSERVE:'observe', INQUIRY:'inquiry', PULSE:'pulse', DIAGNOSE:'diagnose' };
let curIndex = 0;
let curPatient = null;
let state = ST.INTRO;
let wrongCount = 0;
let observeWrong = 0;
let symptomsShown = [];
let pulseShown = '';
let timers = [];

const $ = id => document.getElementById(id);
const sceneWrap    = $('sceneWrap');
const bubbleEl     = $('bubble');
const caseContent  = $('caseContent');
const actionArea   = $('actionArea');
const progressEl   = $('progress');
const coinTag      = $('coinTag');
const modalOverlay = $('modalOverlay');
const modalTitle   = $('modalTitle');
const modalText    = $('modalText');
const modalBtn     = $('modalBtn');

function clearTimers() { timers.forEach(t => clearTimeout(t)); timers = []; }
function later(fn, ms) { timers.push(setTimeout(fn, ms)); }
function shuffle(a) { return [...a].sort(() => Math.random() - 0.5); }
function showBubble(text, keep) {
  bubbleEl.textContent = text;
  bubbleEl.classList.add('show');
  if (!keep) later(() => bubbleEl.classList.remove('show'), 2200);
}
function hideBubble() { bubbleEl.classList.remove('show'); }
function updateCoin() { coinTag.textContent = `💰 ${Player.getCoins()}`; }
function updateProgress() { progressEl.textContent = `病人 ${curIndex + 1} / ${PATIENTS.length}`; }
function renderCase() {
  if (symptomsShown.length === 0 && !pulseShown) { caseContent.textContent = '尚未开始诊治'; return; }
  let html = '';
  if (symptomsShown.length) html += '<div><b>症状：</b>' + symptomsShown.map(s => `<span class="sym">${s}</span>`).join('、') + '</div>';
  if (pulseShown) html += `<div><b>脉象：</b><span class="pulse">${pulseShown}</span></div>`;
  caseContent.innerHTML = html;
}
function showModal(title, text, btnText, cb) {
  modalTitle.textContent = title; modalText.textContent = text; modalBtn.textContent = btnText;
  modalOverlay.classList.add('active');
  modalBtn.onclick = () => { modalOverlay.classList.remove('active'); cb && cb(); };
}
function renderScene(opts) {
  opts.patient = curPatient;
  sceneWrap.innerHTML = buildSceneSVG(opts);
  sceneWrap.querySelectorAll('.hotspot').forEach(el => el.addEventListener('click', () => onHotspotClick(el)));
  if (opts.isPulseStage && opts.hotspots && opts.hotspots.length) {
    const el = sceneWrap.querySelector('.hotspot[data-id="pulse"]');
    if (el) el.addEventListener('click', onPulseClick);
  }
}
function setState(s) { state = s; render(); }
function render() {
  clearTimers();
  if (state === ST.INTRO)         renderIntro();
  else if (state === ST.OBSERVE)  renderObserve();
  else if (state === ST.INQUIRY)  renderInquiry();
  else if (state === ST.PULSE)    renderPulse();
  else if (state === ST.DIAGNOSE) renderDiagnose();
}

function renderIntro() {
  const actionClass = curPatient.pose === 'hug' ? 'shiver' : 'breathe';
  renderScene({ isPulseStage: false, hotspots: [], actionClass });
  actionArea.innerHTML = `<div class="action-tip">👀 ${curPatient.intro}</div>
    <button class="action-btn" id="btnObserve">开始望诊</button>`;
  $('btnObserve').onclick = () => { sfx.click(); setState(ST.OBSERVE); };
}
function renderObserve() {
  observeWrong = 0;
  const actionClass = curPatient.pose === 'hug' ? 'shiver' : 'breathe';
  renderScene({ isPulseStage: false, hotspots: curPatient.observe.hotspots, actionClass });
  actionArea.innerHTML = `<div class="action-tip">${curPatient.observe.hint}</div>`;
}
function onHotspotClick(el) {
  const isCorrect = el.dataset.correct === 'true';
  if (isCorrect) {
    sfx.correct();
    showBubble('✅ ' + curPatient.observe.correctMsg, true);
    const dot = el.querySelector('.hotspot-dot');
    if (dot) dot.setAttribute('fill', 'rgba(120,220,120,0.95)');
    el.querySelectorAll('.hotspot-ring').forEach(r => { r.setAttribute('stroke', 'rgba(120,220,120,0.95)'); r.style.animation = 'none'; });
    later(() => setState(ST.INQUIRY), 1600);
    return;
  }
  sfx.wrong(); observeWrong++;
  const h = curPatient.observe.hotspots.find(x => x.id === el.dataset.id);
  const baseMsg = h ? h.msg : '这里没有异常。';
  const rings = el.querySelectorAll('.hotspot-ring');
  rings.forEach(r => r.setAttribute('stroke', 'rgba(255,80,80,0.95)'));
  later(() => rings.forEach(r => r.setAttribute('stroke', 'rgba(255,215,80,0.95)')), 350);
  if (observeWrong >= 3) {
    sceneWrap.querySelectorAll('.hotspot').forEach(x => x.style.pointerEvents = 'none');
    showBubble('❌ ' + baseMsg, true);
    actionArea.innerHTML = `<div class="action-tip" style="color:#c62828;">❌ 望诊失误三次，病人对你失去信任……</div>`;
    later(() => {
      showModal('😵 望诊失败', `你连续三次没有找准病位，${curPatient.name} 摇头坐了回去。`, '重新接诊', () => {
        observeWrong = 0; symptomsShown = []; pulseShown = ''; wrongCount = 0;
        loadPatient(curIndex);
      });
    }, 800);
  } else {
    showBubble('❌ ' + baseMsg + `（${observeWrong}/3）`, true);
    actionArea.innerHTML = `<div class="action-tip">${curPatient.observe.hint}（错误 ${observeWrong}/3）</div>`;
    later(hideBubble, 1200);
  }
}
function renderInquiry() {
  hideBubble();
  renderScene({ isPulseStage: false, hotspots: [], actionClass: 'breathe' });
  actionArea.innerHTML = `<div class="action-tip">💬 病人正在诉说症状……</div>`;
  const syms = curPatient.inquiry.symptoms;
  syms.forEach((s, i) => {
    later(() => {
      showBubble('「' + s + '」', true);
      if (!symptomsShown.includes(s)) symptomsShown.push(s);
      renderCase(); sfx.click();
      const g = sceneWrap.querySelector('.patient-group');
      if (g) { g.classList.remove('breathe'); g.classList.add('shiver'); later(() => { g.classList.remove('shiver'); g.classList.add('breathe'); }, 420); }
    }, 700 + i * 700);
  });
  later(() => {
    showBubble(curPatient.inquiry.doneMsg || '（病人沉默）', true);
    actionArea.innerHTML = `<div class="action-tip">问诊完毕，接下来请为病人切脉。</div>
      <button class="action-btn" id="btnPulse">切脉</button>`;
    $('btnPulse').onclick = () => { sfx.click(); setState(ST.PULSE); };
  }, 700 + syms.length * 700);
}
function renderPulse() {
  hideBubble();
  renderScene({ isPulseStage: true, hotspots: [{ id:'pulse', cx:256, cy:382, r:28, correct:true }], actionClass: 'breathe' });
  actionArea.innerHTML = `<div class="action-tip">🩺 伸出右手，点击病人手腕为其把脉</div>`;
}
function onPulseClick() {
  sfx.correct();
  pulseShown = curPatient.pulse.text; renderCase();
  showBubble('脉象：' + pulseShown, true);
  const el = sceneWrap.querySelector('.hotspot[data-id="pulse"]');
  if (el) el.style.display = 'none';
  later(() => {
    actionArea.innerHTML = `<div class="action-tip">四诊已毕，请判断病人的方证。</div>
      <button class="action-btn" id="btnDiagnose">开始辨证</button>`;
    $('btnDiagnose').onclick = () => { sfx.click(); setState(ST.DIAGNOSE); };
  }, 1800);
}
function renderDiagnose() {
  hideBubble();
  renderScene({ isPulseStage: true, hotspots: [], actionClass: 'breathe' });
  const opts = shuffle(curPatient.diagnose.options);
  actionArea.innerHTML =
    `<div class="action-tip">🧠 根据四诊所得，判断病人属于哪一证（剩余机会 ${2 - wrongCount}）</div>` +
    opts.map(o => `<button class="option-btn" data-opt="${o}">${o}</button>`).join('');
  actionArea.querySelectorAll('.option-btn').forEach(btn => btn.onclick = () => onDiagnoseClick(btn));
}
function onDiagnoseClick(btn) {
  const picked = btn.dataset.opt;
  const correct = curPatient.diagnose.answer;
  if (picked === correct) {
    sfx.win();
    btn.classList.add('correct');
    actionArea.querySelectorAll('.option-btn').forEach(b => b.disabled = true);
    const reward = 10 + curIndex * 5;
    Player.addCoins(reward); updateCoin();
    later(() => {
      showModal('✅ 辨证正确',
        `${curPatient.name} 患的是「${correct}」，当用「${curPatient.diagnose.formula}」。\n${curPatient.diagnose.desc}。\n\n💰 获得 ${reward} 铜币`,
        '继续', () => {
          curIndex++;
          if (curIndex >= PATIENTS.length) {
            showModal('🎉 今日行医完毕', `你已诊治完所有病人，共获得铜币 ${Player.getCoins()}。`, '返回主页', () => location.href = 'index.html');
          } else loadPatient(curIndex);
        });
    }, 900);
  } else {
    sfx.lose(); wrongCount++;
    btn.classList.add('wrong'); btn.disabled = true;
    if (wrongCount >= 2) {
      actionArea.innerHTML = `<div class="action-tip" style="color:#c62828;">❌ 两次辨证皆错，病人生气地离开了……</div>`;
      const g = sceneWrap.querySelector('.patient-group');
      if (g) g.style.opacity = '0.4';
      later(() => {
        showModal('😠 辨证失败', `${curPatient.name} 摇头离去了。你决定重新整理思路，请他再来一次。`, '重新接诊', () => {
          wrongCount = 0; observeWrong = 0; symptomsShown = []; pulseShown = '';
          loadPatient(curIndex);
        });
      }, 500);
    } else {
      actionArea.querySelector('.action-tip').textContent = `❌ 错了，「${picked}」不对。再想想（剩余机会 1）`;
      const g = sceneWrap.querySelector('.patient-group');
      if (g) { g.classList.remove('breathe'); g.classList.add('shiver'); later(() => { g.classList.remove('shiver'); g.classList.add('breathe'); }, 500); }
    }
  }
}
function loadPatient(index) {
  curPatient = PATIENTS[index];
  wrongCount = 0; observeWrong = 0; symptomsShown = []; pulseShown = '';
  updateProgress(); renderCase(); hideBubble();
  later(() => setState(ST.INTRO), 200);
}
updateCoin();
loadPatient(0);
$('btnHome').onclick = () => location.href = 'index.html';
</script>
</body>
